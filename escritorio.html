<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="manifest" href="escritorio.webmanifest"><meta name="theme-color" content="#0c0f16"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Escritório"><link rel="apple-touch-icon" href="escritorio-icon-192.png"><link rel="icon" type="image/png" href="escritorio-icon-192.png"><style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>/* Tela de Notificações do Escritório Virtual (só no Resiltrack). Usa a RPC public.escritorio_notif. */
(function(){
  const TIPOS=[['abertura','Abertura do dia','8h05 · quem está na escala, ausências avisadas, G-Click e números do dia anterior'],

  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let sb=null,D=null,dlg=null,minha=null;
  const css=`#esc-notif{width:min(760px,calc(100vw - 24px));max-height:calc(100svh - 32px)}#esc-notif .nt{display:flex;flex-direction:column;max-height:calc(100svh - 34px)}

  #esc-notif h3{margin:0 0 8px;font-size:14px}#esc-notif .nt-row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line,#283044)}#esc-notif .nt-row:first-of-type{border-top:0}
  #esc-notif .nt-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#f2b84b}#esc-notif .nt-row b{display:block;font-size:13.5px}#esc-notif .nt-row small{color:var(--fg-3,#8a94a8);font-size:12px}
  #esc-notif .nt-lim{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}#esc-notif .nt-lim label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-3,#8a94a8)}
  #esc-notif .nt-lim span{display:flex;align-items:center;gap:4px}#esc-notif input[type=number]{width:100%;font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line-2,#323c55);background:#0c0f16;color:inherit}

  #esc-notif .nt-st{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}#esc-notif .nt-ok{color:#4fd27f;font-weight:700}#esc-notif .nt-no{color:#f2b84b;font-weight:700}
  #esc-notif .nt-prev{white-space:pre-wrap;font-size:12.5px;background:#0c0f16;border-radius:8px;padding:8px 10px;margin-top:6px}#esc-notif .nt-hist{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
  #esc-notif .nt-hist div{border-left:3px solid #f2b84b;padding:2px 8px}#esc-notif .nt-hist small{color:var(--fg-3,#8a94a8)}#esc-notif .nt-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line,#283044)}
  #esc-notif .nt-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#esc-notif .nt-msg{font-size:12.5px;color:var(--fg-3,#8a94a8)}
  @media (max-width:760px),(max-height:540px) and (max-width:1100px){#esc-notif{width:100vw;height:100svh;max-height:100svh;margin:0;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#esc-notif .nt{height:100%;max-height:none}#esc-notif .nt-lim{grid-template-columns:1fr 1fr}#esc-notif .nt-dep{grid-template-columns:1fr}}`;
  async function rpc(p){const{data,error}=await sb.rpc('escritorio_notif',{p});if(error)throw new Error(error.message);return data;}
  async function minhaInscricao(){try{if(!suporta())return null;const reg=await navigator.serviceWorker.getRegistration('./escritorio');return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;}}
  function msg(t){const m=dlg.querySelector('#nt-msg');if(m)m.textContent=t;}
  function estadoAparelho(){
    if(!suporta())return`<span class="nt-no">Este navegador não recebe notificações.</span>${ios?' <small>No iPhone, instale o app na Tela de Início (iOS 16.4 ou mais novo) e abra por lá.</small>':''}`;
    if(ios&&!solo())return`<span class="nt-no">No iPhone as notificações só funcionam com o app instalado.</span> <small>Toque em Compartilhar e "Adicionar à Tela de Início", depois abra o Escritório por lá.</small>`;

  function render(){

    dlg.querySelector('.nt-b').innerHTML=`
      <section><div class="nt-st"><div>${estadoAparelho()}</div><div class="nt-btns" style="margin:0">${suporta()&&!(ios&&!solo())&&Notification.permission!=='denied'?(minha?'<button type="button" class="btn" id="nt-off">Desligar neste aparelho</button><button type="button" class="btn" id="nt-teste">Enviar teste</button>':'<button type="button" class="btn gold" id="nt-on">Ligar neste aparelho</button>'):''}</div></div>
        <div class="nt-msg" id="nt-msg">${D.aparelhos.length?`Aparelhos ligados na sua conta: ${D.aparelhos.length}.`:'Nenhum aparelho ligado na sua conta ainda.'}</div></section>
      <section><label class="nt-row"><input type="checkbox" id="nt-ativo" ${pr.ativo?'checked':''}><span><b>Receber notificações</b><small>Desligue para pausar tudo sem perder suas escolhas. Só em dias úteis; feriados não têm aviso.</small></span></label></section>
      <section><h3>O que você quer receber</h3>${TIPOS.map(([k,n,d])=>`<label class="nt-row"><input type="checkbox" data-tipo="${k}" ${pr.tipos[k]?'checked':''}><span><b>${n}</b><small>${d}</small></span><button type="button" class="btn" data-prev="${k}" style="margin-left:auto;padding:5px 10px;font-size:12px">Prévia</button></label><div class="nt-prev" data-prevbox="${k}" hidden></div>`).join('')}</section>
      <section><h3>Limites dos alertas</h3><div class="nt-lim">${LIM.map(([k,n,u])=>`<label>${n}<span><input type="number" min="0" max="${k==='banco_h'?200:100}" step="1" data-lim="${k}" value="${esc(pr.limites[k])}"> ${u}</span></label>`).join('')}</div></section>
      <section><h3>Departamentos</h3><p class="nt-msg" style="margin:0 0 8px">Marcados com <span class="tag">seu</span> vêm do organograma do Themis RH. Marque outros se quiser acompanhar.</p>
        <div class="nt-dep">${D.deptos.map(d=>`<label class="nt-row"><input type="checkbox" data-dep="${d.id}" ${sel.has(d.id)?'checked':''}><span><b>${esc(d.nome)}${pad.has(d.id)?'<span class="tag">seu</span>':''}</b></span></label>`).join('')}</div>
        ${pr.personalizado?'<div class="nt-btns"><button type="button" class="btn" id="nt-padrao">Voltar ao padrão do organograma</button></div>':''}</section>
      <section><h3>Últimas notificações</h3><div class="nt-hist">${D.historico.length?D.historico.map(h=>`<div><b>${esc(h.titulo)}</b> <small>${new Date(h.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${h.enviado_em?'':' · aguardando envio'}</small><br>${esc(h.corpo).replace(/\n/g,'<br>')}</div>`).join(''):'<small>Nenhuma ainda.</small>'}</div></section>`;
    const q=s=>dlg.querySelector(s);
    const on=q('#nt-on');if(on)on.onclick=ligar;
    const off=q('#nt-off');if(off)off.onclick=desligar;
    const ts=q('#nt-teste');if(ts)ts.onclick=async()=>{try{await rpc({acao:'teste'});msg('Teste enviado. Deve chegar em alguns segundos.');}catch(e){msg(e.message);}};
    const pd=q('#nt-padrao');if(pd)pd.onclick=()=>salvar(true);
    dlg.querySelectorAll('[data-prev]').forEach(b=>b.onclick=async ev=>{ev.preventDefault();const k=b.dataset.prev,box=q(`[data-prevbox="${k}"]`);box.hidden=false;box.textContent='Montando…';
      try{const r=await rpc({acao:'previa',tipo:k});const it=(r.previa||[])[0];box.textContent=it?it.titulo+'\n'+it.corpo:'Nada para avisar agora com os seus departamentos e limites.';}catch(e){box.textContent=e.message;}});}
  function coletar(padrao){const pr=D.prefs,tipos={},limites={};
    dlg.querySelectorAll('[data-tipo]').forEach(i=>tipos[i.dataset.tipo]=i.checked);
    dlg.querySelectorAll('[data-lim]').forEach(i=>{if(i.value!=='')limites[i.dataset.lim]=String(Math.max(0,+i.value||0));});
    const deps=[...dlg.querySelectorAll('[data-dep]')].filter(i=>i.checked).map(i=>i.dataset.dep);
    const igualPadrao=deps.length===(pr.deptosPadrao||[]).length&&deps.every(d=>pr.deptosPadrao.includes(d));
    const p={acao:'salvar',ativo:dlg.querySelector('#nt-ativo').checked,tipos,limites};if(!padrao&&!igualPadrao)p.deptos=deps;return p;}
  async function salvar(padrao){const bt=dlg.querySelector('#nt-salvar');bt.disabled=true;
    try{D=await rpc(coletar(padrao));render();msg('Preferências salvas.');}catch(e){msg('Não salvou: '+e.message);}bt.disabled=false;}
  async function ligar(){try{
      const perm=await Notification.requestPermission();if(perm!=='granted'){msg('Sem permissão, o aparelho não recebe notificações.');render();return;}
      let reg=await navigator.serviceWorker.getRegistration('./escritorio');if(!reg)reg=await navigator.serviceWorker.register('escritorio-sw.js',{scope:'./escritorio'});
      await navigator.serviceWorker.ready;
      minha=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(D.vapid)});
      const j=minha.toJSON();D=await rpc({acao:'inscrever',endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,agente:navigator.userAgent.slice(0,200)});
      await rpc({acao:'teste'});render();msg('Pronto. Mandamos uma notificação de teste para este aparelho.');
    }catch(e){msg('Não deu para ligar: '+(e.message||e));}}
  async function desligar(){try{if(minha){const ep=minha.endpoint;await minha.unsubscribe().catch(()=>{});D=await rpc({acao:'cancelar',endpoint:ep});}minha=null;render();msg('Este aparelho não recebe mais notificações.');}catch(e){msg(e.message);}}
  async function abrir(){
    if(window.top!==window){const u=new URL('escritorio.html?notif=1',location.href).href;const w=window.open(u,'_blank');if(!w)location.href=u;return;}
    if(!dlg){const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
      dlg=document.createElement('dialog');dlg.id='esc-notif';dlg.innerHTML=`<div class="nt"><div class="nt-h"><h2>Notificações</h2><button type="button" class="btn" id="nt-x">Fechar</button></div><div class="nt-b"><p class="nt-msg">Carregando…</p></div><div class="nt-f"><button type="button" class="btn gold" id="nt-salvar">Salvar preferências</button></div></div>`;
      document.body.appendChild(dlg);dlg.querySelector('#nt-x').onclick=()=>dlg.close();dlg.querySelector('#nt-salvar').onclick=()=>salvar(false);}
    dlg.showModal();
    try{[D,minha]=await Promise.all([rpc({acao:'ler'}),minhaInscricao()]);render();}catch(e){dlg.querySelector('.nt-b').innerHTML=`<p class="nt-msg">Não carregou: ${esc(e.message)}</p>`;}}
  window.__ESC_NOTIF={iniciar(cli){sb=cli;
    const tools=document.querySelector('.tools');if(!tools||document.getElementById('b-notif'))return;
    const b=document.createElement('button');b.className='ib';b.id='b-notif';b.type='button';b.title='Notificações';b.setAttribute('aria-label','Notificações');
    b.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg>';b.onclick=abrir;
    tools.insertBefore(b,tools.querySelector('#b-app')?tools.querySelector('#b-app').nextSibling:tools.firstChild);
    if(/[?&]notif=1/.test(location.search))setTimeout(abrir,600);},abrir};
})();

/* Perfil do colaborador: dados do Themis RH, Kronos ID e atendimentos (RPC public.escritorio_perfil). Só no Resiltrack. */
(function(){
  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const n1=v=>v==null?'–':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});

  let css=false;
  function estilo(){if(css)return;css=true;const s=document.createElement('style');s.textContent=`.pf-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pf-c{background:var(--panel-2,#1a2030);border:1px solid var(--line,#283044);border-radius:12px;padding:10px 12px;min-width:0}

      <div class="pf-c"><h4>Kronos ID · ponto</h4>${K.hoje?linha('Hoje',`${esc(SIT[K.hoje.situacao]||K.hoje.situacao||'–')}${K.hoje.batidas&&K.hoje.batidas.length?` <small>${K.hoje.batidas.map(esc).join(' · ')}</small>`:''}`):linha('Hoje','sem escala')}
        ${linha('Banco no mês',K.mes?`<span class="${(K.mes.saldo||0)<0?'pf-dn':'pf-up'}">${hm(K.mes.saldo)}</span>`:'–')}${K.mes&&K.mes.pendentes?linha('Dias com batida faltando',K.mes.pendentes):''}

  };
})();

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});

const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const fmtDate=iso=>{if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-');return`${d}/${m}/${y}`;};
const fmtHora=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const daysAgo=iso=>Math.round((new Date(todayISO()+'T12:00:00')-new Date(iso.slice(0,10)+'T12:00:00'))/864e5);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:(u?'https://'+u:'');
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
const mensal=r=>{if(!r||r.custo===''||r.custo==null)return null;const v=Number(r.custo);if(!isFinite(v))return null;return r.cobranca==='Anual'?v/12:v;};

const STATUS={'Ideia':'s-mute','Em andamento':'s-info','Em teste':'s-warn','No ar':'s-ok','Concluído':'s-mute','Pausado':'s-bad','Ativa':'s-ok','Em avaliação':'s-info','Cancelar':'s-warn','Cancelada':'s-mute','Em uso':'s-ok','Configurando':'s-info','Desativada':'s-mute','Em construção':'s-info','Com problema':'s-warn','Fora do ar':'s-bad','Pausada':'s-warn','Encerrada':'s-mute','Planejada':'s-info'};

      {k:'economiaMes',l:'Economia mensal (R$)',t:'number',ph:'Automático',hint:'Deixe vazio para usar o valor da ferramenta cadastrada. Preencha só se a economia for diferente.'},

function presenca(c){
  const hoje=todayISO();
  if(c.presenca==='Ausente'&&c.retorno&&c.retorno>hoje&&(c.presencaData||'')<=hoje)return'Ausente';
  if(c.presencaData===hoje&&c.presenca)return c.presenca;
  return c.padrao||'Presencial';
}
const agoraHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const minutos=hm=>{const[h,m]=String(hm||'0:0').split(':').map(Number);return h*60+(m||0);};
function emReuniao(c){
  const r=c.reuniao;if(!r||r.data!==todayISO())return null;
  const now=minutos(agoraHM());
  if(r.fim&&minutos(r.fim)<=now)return null;
  if(r.inicio&&minutos(r.inicio)>now)return null;
  if(!r.fim&&r.inicio&&now-minutos(r.inicio)>240)return null;
  const p=presenca(c);if(p!=='Presencial'&&p!=='Home office')return null;
  return r;
}

/* ---- visitas de parabéns: quem escreveu na intranet vai até a mesa do aniversariante ---- */
const PARAB={feitos:new Set(),ultima:0};
function visitarAniversariante(){
  if(REDUCED||!ANIM.pronto||document.hidden)return;const agora=Date.now();if(agora-PARAB.ultima<15000)return;
  if(Object.values(ANIM.walk).some(w=>w.visita))return;
  const L=(COMUN.parabens||[]).map((m,i)=>({msg:String(m.msg||'').replace(/\s+/g,' ').trim(),para:idCol(m.para),de:idCol(m.de),k:i+'|'+m.de+'|'+m.para})).filter(m=>m.para&&m.de&&m.para!==m.de&&m.msg&&(ANIV.hoje||[]).some(a=>a.colaboradorId===m.para));
  if(!L.length)return;let pend=L.filter(m=>!PARAB.feitos.has(m.k));if(!pend.length){PARAB.feitos.clear();pend=L;}
  for(const m of pend){const pa=ANIM.pos[m.para],pd=ANIM.pos[m.de];
    if(!pa||!pd||ANIM.walk[m.para]||ANIM.walk[m.de])continue;
    if(String(pa.room).startsWith('ho:')||String(pd.room).startsWith('ho:')||!ROOMS[pa.room]?.dep||!ROOMS[pd.room]?.dep)continue;
    const ra=ROOMS[pa.room],lado=pa.x+52<ra.x+ra.w-10?34:-30,alvo={x:pa.x+lado,y:pa.y+8,room:pa.room};
    const ida=rotaEntre(pd,alvo);if(!ida)continue;
    const pts=[...ida,...ida.slice(0,-1).reverse()];
    ANIM.walk[m.de]={pts,i:0,x:pd.x,y:pd.y,room:pd.room,passeio:true,pausa:0,pausaMeio:62,vel:3.4,visita:{msg:m.msg,para:m.para}};
    PARAB.feitos.add(m.k);PARAB.ultima=agora;ANIM.refazerOverlay=true;return;}
}

    R[sl]={ponto:{},wmd:{},pessoas:[],pontoAte:info.ultimoDia,atualizadoEm:puxado,_w:{}};});
  ps.forEach(x=>{const wi=semIdx(x.d);
    Object.entries(x.ponto||{}).forEach(([sl,[n,h]])=>{if(D[sl])D[sl].pontoDias.push({d:x.d,n,h});});
    if(wi>=0)Object.entries(x.wm||{}).forEach(([sl,[t,p]])=>{if(D[sl]){D[sl].semanas[wi]._t+=t;D[sl].semanas[wi]._p+=p;}});

      .sort((a,b)=>(b.nota??-1)-(a.nota??-1));delete P._rk;});
  Object.values(DIAR).sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>{const wi=semIdx(x.d);

function iconeNatal(k){const cv2=document.createElement('canvas');cv2.width=48;cv2.height=48;const x=cv2.getContext('2d');x.imageSmoothingEnabled=false;
  const sp=k==='guirlanda'?SPN.guirlanda():k==='meias'?SPN.meia('#d42f3c'):k==='bengalas'?SPN.bengala():k==='boneco'?SPN.boneco():k==='tapete'?SPN.tapete():k==='presentes'?DECO_N.presente('#e8394a','#f2c94c',11):k==='arvore'?arvMini(12,20):null;
  if(sp){const s2=Math.min(40/sp.width,40/sp.height);x.drawImage(sp,(48-sp.width*s2)/2,(48-sp.height*s2)/2,sp.width*s2,sp.height*s2);}
  else if(k==='pisca'){x.fillStyle='#2b3326';x.fillRect(4,20,40,2);NAT_COR.forEach((c,i)=>{x.fillStyle=c;x.fillRect(5+i*7,22+(i%2)*3,4,5);});}
  else if(k==='neve'){x.fillStyle='#d9e6f2';x.fillRect(4,30,40,8);x.fillStyle='#fff';x.fillRect(4,27,40,4);for(let i=0;i<7;i++)x.fillRect(6+i*6,8+((i*7)%16),3,3);}
  else if(k==='gorro'){x.fillStyle='#d42f3c';x.fillRect(12,18,24,12);x.fillRect(18,10,14,8);x.fillRect(26,6,10,6);x.fillStyle='#fff';x.fillRect(10,30,28,6);x.fillRect(34,4,6,6);}
  return cv2.toDataURL();}

const isoDe=s=>String(s||'').slice(0,10);

  if(h.length)return h.slice().sort((a,b)=>a.em.localeCompare(b.em));

function fieldHtml(f,val){
  const id='f-'+f.k,v=val??'';let inp;
  if(f.t==='select')inp=`<select id="${id}"><option value="">Selecione</option>${f.o.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}"${f.rows?` rows="${f.rows}" style="min-height:${f.rows*1.5}em"`:''}>${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.t==='number'?'number':f.t==='date'?'date':f.t==='url'?'url':'text'}" ${f.t==='number'?'step="0.01" min="0" inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.dl?` list="${id}-dl" autocomplete="off"`:''}>${f.dl?`<datalist id="${id}-dl">${(typeof f.dl==='function'?f.dl():f.dl).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return`<div class="field ${f.wide?'wide':''}"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}${f.hint?`<span class="hint">${f.hint}</span>`:''}</div>`;
}
function openForm(col,rec,preset){
  if(rec===undefined)return;
  const sc=SCHEMAS[col],form=$('dlg-form'),ro=!canWrite||dbState!=='ok';
  form.innerHTML=`<div class="dlg-h"><h2>${rec?esc(rec.nome):'Novo '+sc.singular}</h2><button type="button" class="btn" id="dlg-x">Fechar</button></div>
  <div class="dlg-b">${sc.fields.map(f=>fieldHtml(f,rec?rec[f.k]:preset?.[f.k])).join('')}${col==='projetos'&&rec?histHTML(rec):''}${rec?.atualizadoEm?`<p class="hint wide" style="margin:0">Última atualização em ${fmtDate(rec.atualizadoEm)}</p>`:''}</div>
  <div class="dlg-f">${rec&&!ro?'<button type="button" class="btn danger" id="del">Excluir</button>':'<span></span>'}<div><button type="button" class="btn" id="cancel">Cancelar</button>${ro?'':'<button type="submit" class="btn gold" id="save">Salvar</button>'}</div></div>`;
  if(ro)form.querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);
  const close=()=>$('dlg').close();$('dlg-x').onclick=close;$('cancel').onclick=close;
  const del=$('del');
  if(del)del.onclick=async()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Confirmar exclusão';return;}del.disabled=true;try{await db.collection(col).doc(rec._id).delete();close();toast('Excluído');}catch(e){del.disabled=false;toast(errMsg(e));}};
  form.onsubmit=async e=>{e.preventDefault();if(ro)return;
    const nome=$('f-nome');if(!nome.value.trim()){nome.focus();toast('Preencha o nome');return;}
    const body={};sc.fields.forEach(f=>{let v=$('f-'+f.k).value.trim();if(f.t==='number')v=v===''?null:Number(v.replace(',','.'));body[f.k]=v;});
    body.atualizadoEm=new Date().toISOString();body.criadoEm=rec?.criadoEm||body.atualizadoEm;if(myId)body.atualizadoPor=myId;
    if(col==='projetos'){const av=liberarLanc(rec,body.status),fb=$('save');if(av&&!fb.dataset.ok){fb.dataset.ok='1';fb.textContent='Lançar mesmo assim';let w=$('f-aviso');if(!w){w=document.createElement('p');w.id='f-aviso';w.className='pr-aviso wide';form.querySelector('.dlg-b').appendChild(w);}w.textContent=av+' Clique em "Lançar mesmo assim" para confirmar.';w.scrollIntoView({block:'nearest'});return;}}
    if(col==='projetos'&&body.status&&(!rec||rec.status!==body.status))body.hist=novoHist(rec,body.status);
    const btn=$('save');btn.disabled=true;
    try{await(rec?db.collection(col).doc(rec._id).update(body):db.collection(col).doc().set(body));close();toast(rec?'Alterações salvas':'Adicionado');}
    catch(err){btn.disabled=false;toast(errMsg(err));if(err?.code==='invalid_argument'){canWrite=false;renderAll();}}};
  $('dlg').showModal();
}
function errMsg(e){if(e?.code==='invalid_argument')return'Você não tem permissão para editar esta base.';if(e?.code==='quota_exceeded')return'A base atingiu o limite. Exclua registros antigos.';return'Não foi possível salvar. Tente de novo em instantes.';}
function toast(msg,who){

  t.innerHTML=`${who?`<img alt="" src="${avatarUser(who)}">`:''}<p></p><button class="x" type="button" aria-label="Fechar">&times;</button>`;
  t.querySelector('p').textContent=msg;t.querySelector('.x').onclick=()=>t.remove();
  if(who){t.style.cursor='pointer';t.querySelector('p').onclick=()=>{t.remove();ficha(who);};}
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),who?7000:2800);
}

/* ---- cópia dos dados para o Resiltrack (Supabase, tabela escritorio.docs) ---- */
async function enviarResiltrack(){
  const bt=$('b-rt');if(bt.disabled)return;
  if(!bt.dataset.armado){bt.dataset.armado='1';bt.textContent='Clique de novo para confirmar o envio';bt.classList.add('gold');toast('Vai copiar todos os dados do escritório para o Resiltrack. Clique de novo no botão para confirmar.');setTimeout(()=>{if(bt.dataset.armado&&!bt.disabled){delete bt.dataset.armado;bt.textContent='Enviar ao Resiltrack';bt.classList.remove('gold');}},8000);return;}
  delete bt.dataset.armado;bt.classList.remove('gold');bt.textContent='Conectando ao Supabase…';
  let mcp=null;try{mcp=await window.claude.use('mcp');}catch(e){}
  if(!mcp){bt.textContent='Enviar ao Resiltrack';toast('O conector do Supabase não ficou disponível aqui. Abra a Central pelo claude.ai no navegador, confira se o conector Supabase está ligado e tente de novo.');return;}
  const rows=[],tira=o=>{const x={...o};delete x._id;return x;};
  ['projetos','ferramentas','apis','atividades','membros','colaboradores','paginas','campanhas','recepcao'].forEach(c=>(S[c]||[]).forEach(d=>rows.push({c,i:d._id,d:tira(d)})));
  Object.entries(DIAP||{}).forEach(([i,d])=>rows.push({c:'deptodia',i,d}));Object.entries(DIAR||{}).forEach(([i,d])=>rows.push({c:'restritodia',i,d}));
  Object.entries(DEPOLD||{}).forEach(([i,d])=>rows.push({c:'deptos',i,d}));Object.entries(RESOLD||{}).forEach(([i,d])=>rows.push({c:'restrito',i,d}));
  [['trofeus',TROFEUS],['aniversarios',ANIV],['recepcao',RECEP_SYNC],['comunicados',COMUN],['escritorio',cfg]].forEach(([i,d])=>{if(d&&Object.keys(d).length)rows.push({c:'config',i,d});});
  const lotes=[];let cur=[],tam=0;rows.forEach(r=>{const t=JSON.stringify(r);if(tam+t.length>150000&&cur.length){lotes.push(cur);cur=[];tam=0;}cur.push(t);tam+=t.length;});if(cur.length)lotes.push(cur);
  bt.disabled=true;let ok=0;
  try{for(let k=0;k<lotes.length;k++){bt.textContent=`Enviando ${k+1}/${lotes.length}…`;let tag='j';const corpo='['+lotes[k].join(',')+']';while(corpo.includes('$'+tag+'$'))tag+='x';
      const q=`insert into escritorio.docs(colecao,id,dados,atualizado_por) select x.c,x.i,x.d,'central-claude' from jsonb_to_recordset($${tag}$${corpo}$${tag}$::jsonb) as x(c text,i text,d jsonb) on conflict (colecao,id) do update set dados=excluded.dados,removido=false,versao=escritorio.docs.versao+1,atualizado_em=clock_timestamp(),atualizado_por=excluded.atualizado_por`;
      await mcp.callTool('Supabase','execute_sql',{project_id:'aumfhrqrnudmprvmvesb',query:q});ok+=lotes[k].length;}
    toast(`${ok} registros enviados ao Resiltrack.`);bt.textContent='Enviado ao Resiltrack';}
  catch(e){console.error('Envio ao Resiltrack',e);toast(`Parou depois de ${ok} registros: ${e&&(e.code||'')} ${e&&e.message||''}. Pode clicar de novo, o que já foi não duplica.`);bt.textContent='Enviar ao Resiltrack';}
  finally{bt.disabled=false;}
}

async function resolveNames(){
  if(!user)return;const ids=pessoas().map(p=>p.id);if(!ids.length)return;
  const ps=await user.profiles(ids);let ch=false;
  ids.forEach(id=>{const n=ps[id]?.name||'';if(n&&names[id]!==n){names[id]=n;ch=true;}});

}

(async()=>{
  try{[db,user]=await Promise.all([window.claude?.use?.('db')??null,window.claude?.use?.('user')??null]);}catch(e){db=null;}
  if(!db){dbState='off';renderAll();return;}
  if(user){myId=await user.id();isOwner=await user.isOwner();if(isOwner&&!window.__ESCRITORIO_RT)$('b-rt').hidden=false;const c=await user.can('data.write');if(c===false)canWrite=false;try{isAdmin=!!(await user.canEdit());}catch(e){isAdmin=false;}}
  db.collection('deptos').onSnapshot(snap=>{DEPOLD={};snap.docs.forEach(d=>DEPOLD[d.id]=d.data());rebuildDias();},()=>{});
  if(isAdmin)db.collection('restrito').onSnapshot(snap=>{RESOLD={};snap.docs.forEach(d=>RESOLD[d.id]=d.data());rebuildDias();},()=>{RESOLD={};});
  db.collection('deptodia').onSnapshot(snap=>{DIAP={};snap.docs.forEach(d=>DIAP[d.id]=d.data());rebuildDias();},()=>{});
  if(isAdmin)db.collection('restritodia').onSnapshot(snap=>{DIAR={};snap.docs.forEach(d=>DIAR[d.id]=d.data());rebuildDias();},()=>{DIAR={};});
  const colecoes=['projetos','ferramentas','apis','atividades','membros','colaboradores','paginas','campanhas','recepcao'];let pending=colecoes.length+1;
  const done=()=>{pending--;if(pending<=0){dbState='ok';loadedAt=Date.now();}};
  const upd=()=>{if(editing())needsRender=true;else renderAll();};
  for(const col of colecoes){let first=true;
    db.collection(col).onSnapshot(snap=>{
      if(col==='atividades'){
        if(!first&&dbState==='ok')snap.docChanges().forEach(ch=>{if(ch.type==='added'&&!seen.has(ch.doc.id)){const a=ch.doc.data();if(a.autor&&a.autor!==myId)toast(`${nomeDe(a.autor)} registrou: ${a.oque||''}`.slice(0,140),a.autor);}});
        snap.docs.forEach(d=>seen.add(d.id));
      }
      S[col]=snap.docs.map(d=>({...d.data(),_id:d.id}));
      if(first){first=false;done();}
      if(col==='colaboradores'&&Object.keys(DIAP).length)try{rebuildDias();}catch(e){}
      upd();if(col==='atividades'||col==='membros'||col==='colaboradores')resolveNames();
    },()=>{dbState='off';renderAll();});
  }
  let firstCfg=true;
  db.doc('config/recepcao').onSnapshot(s=>{RECEP_SYNC=s.exists?{entradas:[],saidas:[],sensiveis:[],...s.data()}:{entradas:[],saidas:[],sensiveis:[]};upd();},()=>{});
  db.doc('config/trofeus').onSnapshot(s=>{TROFEUS=s.exists?{top:[],...s.data()}:{top:[]};upd();},()=>{});
  db.doc('config/gclick').onSnapshot(s=>{GCLICK=s.exists?s.data():{};upd();},()=>{});
  db.doc('config/comunicados').onSnapshot(s=>{COMUN=s.exists?{itens:[],parabens:[],...s.data()}:{itens:[],parabens:[]};upd();},()=>{});
  db.doc('config/aniversarios').onSnapshot(s=>{ANIV=s.exists?{hoje:[],proximos:[],...s.data()}:{hoje:[],proximos:[]};upd();},()=>{});
  db.doc('config/escritorio').onSnapshot(s=>{cfg=s.exists?{setores:[],coordenador:null,...s.data()}:{setores:[],coordenador:null};if(firstCfg){firstCfg=false;done();}upd();resolveNames();},()=>{});
})();
