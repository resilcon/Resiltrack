<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>

  --verde:#5f8a0b;--vermelho:#d14b3a;--amarelo:#b7860b;--azul:#1c1c1f;
  --listra:repeating-linear-gradient(135deg,#bfc2c6 0 1.5px,transparent 1.5px 6px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pagina:#0d0e10;--tela:#141518;--card:#1b1c20;--card2:#212227;--tinta:#f1f1f3;--sub:#8e8e97;--borda:rgba(255,255,255,.06);--linha:#2a2b31;--hover:#24252a;--escuro:#f1f1f3;--c-neu:#4a4c53;--c-dis:#e9e9ec;--c-oci:#6e737b;--sombra:none;--azul:#f1f1f3;--listra:repeating-linear-gradient(135deg,#565961 0 1.5px,transparent 1.5px 6px)}}
:root[data-theme="dark"]{--pagina:#0d0e10;--tela:#141518;--card:#1b1c20;--card2:#212227;--tinta:#f1f1f3;--sub:#8e8e97;--borda:rgba(255,255,255,.06);--linha:#2a2b31;--hover:#24252a;--escuro:#f1f1f3;--c-neu:#4a4c53;--c-dis:#e9e9ec;--c-oci:#6e737b;--sombra:none;--azul:#f1f1f3;--listra:repeating-linear-gradient(135deg,#565961 0 1.5px,transparent 1.5px 6px)}
*{box-sizing:border-box}
html{background:var(--pagina)}
body{margin:0;font-family:"Manrope","Segoe UI",system-ui,sans-serif;background:var(--pagina);color:var(--tinta);font-size:14px;padding:18px}
button,input,select{font:inherit;color:inherit}
a{color:var(--tinta)}
.tela{max-width:1560px;margin:0 auto;background:var(--tela);border-radius:36px;box-shadow:var(--sombra);padding:22px 26px 30px;min-height:calc(100vh - 36px)}
/* topo */
.barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:18px}
.marca svg{width:34px;height:34px}
.marca b{font-size:17px;letter-spacing:-.3px}
.pilulas{display:flex;gap:6px;flex-wrap:wrap}
.pil{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;border:1px solid var(--borda);background:var(--card2);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--tinta)}
.pil svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.pil:hover{background:var(--hover)}
.pil.on{background:var(--escuro);color:var(--tela);border-color:var(--escuro)}
.direita{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatares{display:flex;align-items:center}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:3px solid var(--tela);margin-left:-10px;background:var(--lima2);color:var(--lima-t)}
.av:first-child{margin-left:0}
.av.mais{background:var(--escuro);color:var(--tela)}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid var(--borda);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none;color:var(--tinta)}
.circ svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.circ.esc{background:var(--escuro);color:var(--tela);border-color:var(--escuro)}
.circ .pt{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--lima);color:var(--lima-t);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.corpo{display:grid;grid-template-columns:58px 1fr;gap:22px;margin-top:26px}
.trilho{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:96px}
.trilho .circ.on{background:var(--escuro);color:var(--tela);border-color:var(--escuro)}
.trilho .circ[data-dica]:hover::after{content:attr(data-dica);position:absolute;left:52px;white-space:nowrap;background:var(--escuro);color:var(--tela);padding:6px 10px;border-radius:10px;font-size:12px;z-index:5}
.migalha{display:flex;gap:16px;color:var(--sub);font-size:12px;margin-left:4px}
.titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.titulo h1{margin:0;font-weight:400;font-size:42px;letter-spacing:-1.6px;line-height:1.05}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros select,.filtros input,.inp{padding:10px 14px;border:1px solid var(--borda);border-radius:999px;background:var(--card2);min-width:0;appearance:none;-webkit-appearance:none}
.filtros select{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.inp{border-radius:14px}
.btn{padding:10px 16px;border:1px solid var(--borda);border-radius:999px;background:var(--card2);cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--escuro);border-color:var(--escuro);color:var(--tela)}
.btn.ok{background:var(--lima);border-color:var(--lima);color:var(--lima-t);font-weight:700}
.btn.no{background:var(--card2);color:var(--vermelho)}
.btn.peq{padding:6px 12px;font-size:12px}
main{min-width:0}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.home{display:grid;gap:16px;grid-template-columns:1.05fr 1fr 2fr}
.home .alto{grid-row:span 2}.home .s2{grid-column:span 2}.home .s3{grid-column:1/-1}
@media(max-width:1200px){.home{grid-template-columns:1fr 1fr}.home .s2,.home .s3{grid-column:1/-1}.home .alto{grid-row:auto}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:760px){body{padding:0}.tela{border-radius:0;padding:14px 12px}.corpo{grid-template-columns:1fr}.trilho{flex-direction:row;padding:0;overflow-x:auto;order:-1}.g4,.g2,.home{grid-template-columns:1fr}.titulo h1{font-size:30px}.direita .avatares{display:none}}
.card{background:var(--card);border:1px solid var(--borda);border-radius:28px;padding:20px 22px;min-width:0;position:relative}
.card h3{margin:0 0 14px;font-size:17px;font-weight:500;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--sub);font-size:12px;letter-spacing:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acoes-c{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.acoes-c .circ{width:36px;height:36px}
.kpi .rot{color:var(--tinta);font-size:15px;font-weight:500;letter-spacing:-.2px;padding-right:40px}
.kpi .val{font-size:38px;font-weight:300;letter-spacing:-1.6px;margin-top:14px;line-height:1}
.kpi .det{font-size:12px;color:var(--sub);margin-top:8px}
.leg-p{font-size:12px;color:var(--sub)}
.grande{font-size:48px;font-weight:300;letter-spacing:-2px;line-height:1}
.grande small{font-size:18px;letter-spacing:0;margin-left:2px}
.sobe{color:var(--verde);font-weight:600}.desce{color:var(--vermelho);font-weight:600}
/* destaque com bolhas */
.destaque{overflow:hidden;padding:0;display:flex;flex-direction:column;background:var(--card2)}
.bolhas{position:relative;height:250px;flex:none;overflow:hidden}
.bolhas i{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#f2ffc2 0,#c9ec55 38%,#7fa51b 78%,#55720c 100%);box-shadow:0 6px 14px -6px rgba(60,80,0,.5)}
.destaque .cab-d{position:absolute;top:20px;left:22px;font-size:17px;font-weight:500;z-index:2}
.vidro{margin:-60px 12px 12px;border-radius:24px;padding:18px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);position:relative;flex:1;display:flex;flex-direction:column}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vidro{background:rgba(30,31,36,.7);border-color:rgba(255,255,255,.06)}}
.vidro .par{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 18px}
.vidro .par b{font-size:30px;font-weight:300;letter-spacing:-1px}
.vidro .par small{color:var(--sub);font-size:12px;margin-left:4px}
.colunas{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-items:end;min-height:200px}
.coluna{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;height:100%}
.coluna .tubo{border-radius:22px;background:var(--lima);padding:14px;color:var(--lima-t);display:flex;flex-direction:column;justify-content:flex-start;min-height:70px}
.coluna .tubo b{font-size:22px;font-weight:600;letter-spacing:-.5px}
.coluna .tubo span{font-size:12px}
.coluna .cresc{font-size:20px;font-weight:300}
.coluna .cresc small{display:block;font-size:11px;color:var(--sub)}
/* donut */
.donut{width:170px;height:170px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--card)}
.donut span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:32px;font-weight:300;letter-spacing:-1px}
.donut span small{font-size:11px;color:var(--sub);letter-spacing:0}
.leg{display:flex;flex-direction:column;gap:10px;font-size:13px;flex:1;min-width:180px}
.leg>div{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--borda)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.leg b{margin-left:auto;font-weight:500}
/* barras de progresso */
.pbar{height:8px;border-radius:8px;background:var(--linha);overflow:hidden;min-width:60px;display:flex}
.pbar i{display:block;height:100%}
.pilula-val{display:flex;align-items:center;gap:10px;margin:8px 0}
.pilula-val .rot{width:170px;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilula-val .fx{flex:1;height:34px;border-radius:12px;background:var(--card2);border:1px solid var(--borda);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 12px;font-size:13px}
.pilula-val .fx i{position:absolute;left:0;top:0;bottom:0;background:var(--lima2);z-index:0}
.pilula-val .fx span{position:relative;z-index:1}
/* tabela */
.tab{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tab th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:10px;border-bottom:1px solid var(--linha);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--card);z-index:1}
.tab td{padding:11px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tab tr:last-child td{border-bottom:0}
.tab tr.cl{cursor:pointer}.tab tr.cl:hover td{background:var(--hover)}
.tab tr.cl:hover td:first-child{border-radius:14px 0 0 14px}.tab tr.cl:hover td:last-child{border-radius:0 14px 14px 0}
.tab .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rolar{overflow:auto;max-height:640px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;background:var(--card2);border:1px solid var(--borda);color:var(--sub);white-space:nowrap}
.chip.produtivo,.chip.aprovado{background:var(--lima2);border-color:transparent;color:var(--lima-t)}
.chip.distracao,.chip.alto,.chip.recusado{background:var(--escuro);border-color:transparent;color:var(--tela)}
.chip.atencao,.chip.pendente{background:#f6e3a8;border-color:transparent;color:#6b4e00}
.chip.info{background:var(--card2)}
.est{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.est.online{background:var(--lima);box-shadow:0 0 0 3px rgba(201,236,85,.3)}.est.ocioso{background:#e8c04f}.est.offline{background:#bfc2c6}
.vivo{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vivo .card{padding:16px 18px;border-radius:24px}
.vivo .nm{font-weight:600}.vivo .rc{font-size:12px;color:var(--sub);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.rec .it{min-width:160px;border-radius:22px;padding:14px;background:var(--card2);border:1px solid var(--borda)}
.rec .it:first-child{background:var(--lima);color:var(--lima-t);border-color:transparent}
.rec .it:first-child .ajuda,.rec .it:first-child .pos{color:var(--lima-t)}
.rec .it .pos{color:var(--sub);font-size:11px}.rec .it b{display:block;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rec .it .t{font-size:22px;font-weight:300;letter-spacing:-.6px}
.alerta{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:13px;align-items:flex-start}.alerta:last-child{border:0}
.vazio{color:var(--sub);padding:22px;text-align:center}
svg text{fill:var(--sub);font-size:11px;font-family:inherit}
/* gaveta */
.gaveta{position:fixed;inset:0;background:rgba(10,10,14,.35);backdrop-filter:blur(3px);z-index:50;display:none}
.gaveta.on{display:block}
.gaveta .pn{position:absolute;right:12px;top:12px;bottom:12px;width:min(1000px,calc(100% - 24px));background:var(--tela);overflow:auto;padding:22px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.gaveta .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.gaveta h2{margin:0;font-size:30px;font-weight:400;letter-spacing:-1px}
.linha-t{position:relative;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--borda);overflow:hidden}
.linha-t i{position:absolute;top:6px;bottom:6px;border-radius:4px}
.horas{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}
.busca{max-width:280px}
.msg{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--escuro);color:var(--tela);padding:12px 18px;border-radius:999px;z-index:60;display:none}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.demo{max-width:1560px;margin:0 auto 10px;background:var(--lima2);color:var(--lima-t);padding:8px 18px;font-size:12px;border-radius:999px}
.ajuda{font-size:12px;color:var(--sub);line-height:1.5}
.oculto{display:none!important}
</style>
</head>

<div class="gaveta" id="gaveta"><div class="pn" id="gpn"></div></div>

<script>
try { const t = localStorage.getItem('argos_tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const $ = s => document.querySelector(s);

const H = s => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h + 'h' + String(m).padStart(2,'0'); };

}
function tabela(cols, linhas, op = {}) {

}
function csv(nome, cols, linhas) {

let _pad = 0;
function padraoListra() { const id = 'lst' + (++_pad); return [id, `<defs><pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card2)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--c-oci)" stroke-width="2"/></pattern></defs>`]; }
// barras arredondadas; com uma série só, a maior fica listrada com o valor numa etiqueta lima (como na referência)
function barrasEmpilhadas(serie, chaves, op = {}) {
  if (!serie.length) return '<div class="vazio">Sem dados.</div>';
  const W = op.w || 900, Hh = op.h || 190, top = 34, larg = (W - 10) / serie.length, bw = Math.max(6, Math.min(56, larg * 0.62));
  const tot = d => chaves.reduce((a, k) => a + (d[k[0]] || 0), 0);
  const max = Math.max(...serie.map(tot), 0.01), imax = serie.map(tot).indexOf(max);
  const [pid, defs] = padraoListra();
  let s = `<svg viewBox="0 0 ${W} ${Hh + 22}" width="100%" style="height:${Hh + 22}px" preserveAspectRatio="none">${defs}`;
  serie.forEach((d, i) => {
    const x = 5 + i * larg + (larg - bw) / 2, util = Hh - top;
    if (chaves.length === 1) {
      const h = Math.max(6, tot(d) / max * util), y = Hh - h;
      s += `<rect x="${x}" y="${top - 6}" width="${bw}" height="${util + 6}" rx="${Math.min(14, bw / 2)}" fill="var(--card2)" stroke="var(--borda)"/>`;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(14, bw / 2)}" fill="${i === imax ? `url(#${pid})` : 'var(--linha)'}" ${i === imax ? 'stroke="var(--c-oci)" stroke-opacity=".5"' : ''}><title>${esc(op.rot ? op.rot(d) : '')}: ${op.fmt ? op.fmt(tot(d)) : tot(d)}</title></rect>`;

    } else {
      let y = Hh; const r = Math.min(10, bw / 2);
      const partes = chaves.map(([k, c]) => [(d[k] || 0) / max * (Hh - 12), c, k]).filter(p => p[0] > 0);
      partes.forEach(([h, c, k], j) => { y -= h; const topo = j === partes.length - 1;
        s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="${topo && h > 2 * r ? r : 2}" fill="${c}"><title>${esc(op.rot ? op.rot(d) : '')} ${esc(CAT[k] || k)}: ${op.fmt ? op.fmt(d[k]) : d[k]}</title></rect>`; });
    }
    if (serie.length <= 31 || i % Math.ceil(serie.length / 20) === 0) s += `<text x="${x + bw / 2}" y="${Hh + 16}" text-anchor="middle">${esc(op.rot ? op.rot(d) : i)}</text>`;
  });
  return s + '</svg>';
}
// linha suave com pontos, área listrada e etiqueta lima no maior valor
function linhaSuave(serie, chave, op = {}) {
  if (serie.length < 2) return '<div class="vazio">Sem dados suficientes.</div>';
  const W = op.w || 900, Hh = op.h || 200, px = 14, top = 36, vals = serie.map(d => d[chave] || 0), max = Math.max(...vals, 0.01);
  const P = vals.map((v, i) => [px + i * (W - 2 * px) / (vals.length - 1), Hh - 8 - v / max * (Hh - top - 8)]);
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 1; i < P.length; i++) { const [x0, y0] = P[i - 1], [x1, y1] = P[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const [pid, defs] = padraoListra(), im = vals.indexOf(max);
  const media = vals.reduce((a, v) => a + v, 0) / vals.length, ym = Hh - 8 - media / max * (Hh - top - 8);
  let s = `<svg viewBox="0 0 ${W} ${Hh + 22}" width="100%" style="height:${Hh + 22}px" preserveAspectRatio="none">${defs}
    <path d="${d} L${P[P.length - 1][0]},${Hh} L${P[0][0]},${Hh} Z" fill="url(#${pid})" opacity=".55"/>
    <line x1="${px}" x2="${W - px}" y1="${ym}" y2="${ym}" stroke="var(--sub)" stroke-dasharray="3 5" stroke-opacity=".6"/>
    <path d="${d}" fill="none" stroke="var(--tinta)" stroke-width="2"/>`;
  P.forEach(([x, y], i) => { if (serie.length <= 31) s += `<circle cx="${x}" cy="${y}" r="${i === im ? 5 : 3.2}" fill="${i === im ? 'var(--lima)' : 'var(--tinta)'}" stroke="var(--card)" stroke-width="2"><title>${esc(op.rot ? op.rot(serie[i]) : '')}: ${op.fmt ? op.fmt(vals[i]) : vals[i]}</title></circle>`;
    if (serie.length <= 12 || i % Math.ceil(serie.length / 10) === 0) s += `<text x="${x}" y="${Hh + 16}" text-anchor="middle">${esc(op.rot ? op.rot(serie[i]) : i)}</text>`; });
  const t = op.fmt ? op.fmt(max) : max, lw = Math.max(46, String(t).length * 7 + 16), [xm, ymx] = P[im];

  return s + '</svg>';
}

function explicarScore() {
  abrirGaveta(`<div class="cab"><h2>Como o score é calculado</h2><button class="btn" onclick="fecharGaveta()">Fechar</button></div><div class="card ajuda" style="font-size:14px">
  <p>O score vai de 0 a 100 e junta quatro coisas, para não depender só de "ficar no computador":</p>
  <p><b>45%</b> tempo produtivo sobre o tempo em uso (inclui atividades extras aprovadas, como reunião com cliente).<br>
  <b>25%</b> atividade: tempo em uso dividido pela jornada (8h48 por dia, ajustável), limitado a 100%.<br>
  <b>20%</b> tempo ligado a algum cliente sobre o tempo em uso.<br>
  <b>10%</b> ausência de distração (100% menos o tempo em sites e programas de distração).</p>
  <p>Use como termômetro, não como sentença: quem trabalha muito em reunião presencial, ligação ou papel precisa justificar as pausas para aparecer bem.</p></div>`);
}

    $('#ap').onclick = () => decidir('aprovado'); $('#rc').onclick = () => decidir('recusado');
  }
};

// ---------- gavetas de detalhe ----------
function abrirGaveta(html) { $('#gpn').innerHTML = html; $('#gaveta').classList.add('on'); $('#gpn').scrollTop = 0; }
function fecharGaveta() { $('#gaveta').classList.remove('on'); }
$('#gaveta').onclick = e => { if (e.target.id === 'gaveta') fecharGaveta(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharGaveta(); });

async function abrirPessoa(id, nome) {
  abrirGaveta(`<div class="cab"><h2>${esc(nome)}</h2><button class="btn" onclick="fecharGaveta()">Fechar</button></div><div class="vazio">Carregando...</div>`);
  const d = await rpc('pessoa', params({colaborador: id})), r = d.resumo || {};
  const um = S.de === S.ate;
  let linha = '';
  if (um && (d.linha || []).length) {
    const ini = new Date(d.linha[0].i).getTime(), fim = new Date(d.linha[d.linha.length - 1].f).getTime(), tot = Math.max(fim - ini, 1);
    linha = `<div class="card"><h3>Linha do tempo do dia <small>passe o mouse para ver o que era</small></h3><div class="linha-t">${d.linha.map(s => {
      const x = (new Date(s.i).getTime() - ini) / tot * 100, w = Math.max(0.15, (new Date(s.f).getTime() - new Date(s.i).getTime()) / tot * 100);
      const cor = s.ocioso ? COR.ocioso : (COR[s.categoria] || COR.neutro);
      return `<i style="left:${x}%;width:${w}%;background:${cor}" title="${horaBR(s.i)} às ${horaBR(s.f)} · ${s.ocioso ? 'Parado' : esc(s.recurso)}${s.cliente ? ' · ' + esc(s.cliente) : ''}"></i>`; }).join('')}</div>
      <div class="horas"><span>${horaBR(d.linha[0].i)}</span><span>${horaBR(d.linha[d.linha.length - 1].f)}</span></div>
      <div class="leg" style="flex-direction:row;gap:14px;margin-top:8px;flex-wrap:wrap">${Object.keys(COR).map(k => `<div><i style="background:${COR[k]}"></i>${CAT[k]}</div>`).join('')}</div></div>`;
  }
  const lst = (itens, nomeF, maxSeg) => itens.length ? itens.map(i => `<div class="alerta"><div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nomeF(i)}</div>${pbar([[i.seg, 'var(--azul)']], maxSeg)}</div><b>${H(i.seg)}</b></div>`).join('') : '<div class="vazio">Nada no período.</div>';
  $('#gpn').innerHTML = `<div class="cab"><h2>${esc(nome)} <small class="ajuda">${esc(r.depto || '')}</small></h2><button class="btn" onclick="fecharGaveta()">Fechar</button></div>
  <div class="grid g4">${kpi('Atividade', P(r.atividade_pct), `${H(r.captadas)} captadas em ${N(r.dias)} dia(s)`)}${kpi('Produtivo', P(r.produtivo_pct), `distração ${H(r.distracao)}`)}${kpi('Com clientes', H(r.cliente), P(r.captadas ? r.cliente / r.captadas * 100 : null) + ' do tempo')}${kpi('Score', N(r.score), d.custo_hora != null ? 'custo/hora ' + R$(d.custo_hora) : '&nbsp;')}
  ${kpi('Entrada / saída', `${r.primeira || '-'} / ${r.ultima || '-'}`, `parado ${H(r.ocioso)}`)}${kpi('Teclas e cliques', N((r.teclas || 0) + (r.cliques || 0)), `${N(r.teclas)} teclas · ${N(r.cliques)} cliques · ${N(r.rolagem)} rolagens`)}${kpi('Trocas de programa', N(r.trocas), `maior bloco sem pausa ${H(r.maior_continua)}`)}${kpi('Atividades extras', H((r.extras_prod || 0) + (r.extras_neutro || 0)), `${N(r.extras_pend)} esperando aprovação`)}</div>
  <div style="margin-top:14px">${linha}</div>
  <div class="card" style="margin-top:14px"><h3>Por hora do dia <small>tempo e intensidade (teclas + cliques)</small></h3>${barrasEmpilhadas(Array.from({length: 24}, (_, h) => Object.assign({h, pro: 0, neu: 0, dis: 0, oci: 0}, (d.por_hora || []).find(x => x.h === h))).filter(x => x.h >= 6 && x.h <= 22),
    [['pro', COR.produtivo], ['neu', COR.neutro], ['dis', COR.distracao], ['oci', COR.ocioso]], {rot: x => x.h + 'h', fmt: v => H(v), h: 140})}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Programas e sites</h3>${lst(d.recursos || [], i => `${esc(i.recurso)} <span class="chip ${i.categoria}">${CAT[i.categoria] || ''}</span>`, d.recursos?.[0]?.seg)}</div>
    <div class="card"><h3>Clientes</h3>${lst(d.clientes || [], i => `<a href="#" data-emp="${esc(i.empresa_id)}">${esc(i.nome)}</a>`, d.clientes?.[0]?.seg)}</div>
  </div>

async function iniciar() {

  if (!DEMO) {
    const { data } = await sb.auth.getSession();

}
