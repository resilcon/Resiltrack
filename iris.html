  --bg:#EEF3F5;--panel:#fff;--panel-2:#F1F5F7;--line:#DCE5E8;--ink:#05303D;--ink-2:#3D4B50;--muted:#66777E;
  --petrol:#066789;--teal:#269A9E;--navy:#05303D;--coral:#E0604C;--sand:#F2B84B;
  --grad:linear-gradient(135deg,#006789 0%,#269A9E 100%);
  --good:#22804F;--warn:#C0730C;--crit:#D4513F;

*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#05303D;overflow:hidden;cursor:none}
body{color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
h1,h2,h3,.u{font-family:"Urbanist",system-ui,sans-serif;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:center;background:var(--bg);
  display:grid;grid-template-columns:1fr;grid-template-rows:104px 1fr 54px;overflow:hidden}
#stage.op{grid-template-columns:452px 1fr}
#stage>.top,#stage>.mid,#stage>.bot{grid-column:-2/-1;min-width:0}

/* topo */
.top{display:flex;align-items:center;gap:28px;padding:0 56px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:300px;top:-190px;width:380px;height:380px;border-radius:50%;border:46px solid rgba(255,255,255,.08)}
.logo{height:46px;aspect-ratio:720/186;background:var(--logo) no-repeat left center/contain}
.tvchip{font-size:22px;font-weight:600;color:#fff;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 20px}
.top .sp{flex:1}
.date{text-align:right;font-size:24px;color:rgba(255,255,255,.8);line-height:1.25;position:relative;z-index:1}
.date b{display:block;color:#fff;font-weight:600}
.clock{font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:68px;letter-spacing:-.02em;position:relative;z-index:1}

/* miolo */
.mid{display:grid;grid-template-columns:1fr;padding:28px 56px 0;min-height:0}
#stage.op .top,#stage.op .mid,#stage.op .bot{padding-left:36px}
.main{position:relative;border-radius:36px;background:var(--panel);border:1px solid var(--line);overflow:hidden;box-shadow:0 10px 40px rgba(5,48,61,.07)}
.slide{position:absolute;inset:0;padding:64px 72px;opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s;display:flex;flex-direction:column}
.slide.on{opacity:1;transform:none;z-index:2}
.s-com,.s-vazio{background:var(--panel)}
.tag{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--petrol)}
.tag i{width:14px;height:14px;border-radius:50%;background:var(--coral)}

/* escritorio virtual */
.s-esc{padding:0;background:#f3ead8}
.s-esc canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.s-esc .hora{position:absolute;right:22px;top:18px;background:rgba(5,48,61,.86);color:#fff;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:34px;padding:6px 20px;border-radius:999px}
.s-esc .velho{position:absolute;left:22px;bottom:18px;background:rgba(192,115,12,.92);color:#fff;font-size:22px;font-weight:600;padding:6px 16px;border-radius:999px;display:none}
.s-esc.antigo .velho{display:block}
#stage.cheia>.top,#stage.cheia>.bot{display:none}
#stage.cheia>.mid{grid-row:1/4;padding:24px 28px}
#stage.cheia .main{border-radius:26px}

/* comunicado */
.s-com{flex-direction:row;gap:64px;padding:0}
.s-com .txt{flex:1;min-width:0;padding:64px 0 64px 72px;display:flex;flex-direction:column;justify-content:center}
.s-com.sem-lado .txt{padding-right:72px}
.s-com h2{font-size:84px;line-height:1.04;font-weight:800;margin:28px 0 30px;color:var(--navy);text-wrap:balance;overflow-wrap:anywhere}
.s-com p{font-size:36px;line-height:1.35;color:var(--ink-2);max-width:24em;white-space:pre-line;overflow:hidden}
.s-com .side{flex:none;width:400px;background:linear-gradient(160deg,#E86F58,#D4513F);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;position:relative;overflow:hidden;padding:24px}
#stage.op .s-com .side{width:330px}
.s-com .side::before{content:"";position:absolute;left:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;border:54px solid rgba(255,255,255,.14)}
.s-com .side>*{position:relative}
.s-com .side small{font-size:28px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.s-com .side b{font-family:"Urbanist",system-ui,sans-serif;font-size:180px;font-weight:900;line-height:.95;overflow-wrap:anywhere}
.s-com .side b.longo{font-size:92px;line-height:1.05}
.s-com .side span{font-size:42px;font-weight:700;font-family:"Urbanist",system-ui,sans-serif}
.s-com .foto{flex:none;width:44%;background:#DCEAEF center/cover no-repeat}
.s-img{padding:0;background:#05303D}
.s-img div{position:absolute;inset:0;background:center/contain no-repeat}

/* elogio */
.s-elo{justify-content:center;background:var(--grad);color:#fff;overflow:hidden}
.s-elo::before{content:"";position:absolute;right:-160px;bottom:-220px;width:640px;height:640px;border-radius:50%;border:80px solid rgba(255,255,255,.09)}
.s-elo::after{content:"";position:absolute;right:210px;top:-150px;width:300px;height:300px;border-radius:50%;background:rgba(242,184,75,.9)}
.s-elo>*{position:relative;z-index:1}
.s-elo .tag{color:#fff}.s-elo .tag i{background:var(--sand)}
.s-elo blockquote{font-family:"Urbanist",system-ui,sans-serif;font-weight:700;font-size:60px;line-height:1.16;margin:34px 0 44px;text-wrap:balance;padding-left:44px;border-left:8px solid var(--sand);overflow:hidden}
.s-elo blockquote.longo{font-size:44px}
#stage.op .s-elo blockquote{font-size:52px}
#stage.op .s-elo blockquote.longo{font-size:38px}
.who{display:flex;align-items:center;gap:26px}
.av{flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:44px;background:#fff;color:var(--petrol)}
.who b{display:block;font-size:42px;font-family:"Urbanist",system-ui,sans-serif;font-weight:800}
.who span{font-size:30px;color:rgba(255,255,255,.82)}

/* boas-vindas */
.s-bv{flex-direction:row;align-items:center;gap:72px;background:#FBE9B7;overflow:hidden}
.s-bv::before{content:"";position:absolute;right:-140px;top:-180px;width:560px;height:560px;border-radius:50%;border:70px solid rgba(224,96,76,.16)}
.s-bv>*{position:relative}
.s-bv .big{flex:none;width:360px;height:360px;border-radius:50%;background:linear-gradient(160deg,#E86F58,#D4513F);color:#fff;display:grid;place-items:center;font-family:"Urbanist",system-ui,sans-serif;font-weight:900;font-size:150px;box-shadow:0 0 0 18px rgba(255,255,255,.6),0 0 0 44px rgba(255,255,255,.32)}
#stage.op .s-bv{gap:52px}#stage.op .s-bv .big{width:280px;height:280px;font-size:118px}
.s-bv .tag{color:#9A4A12}
.s-bv h2{font-size:88px;font-weight:800;line-height:1;margin:24px 0 18px;color:var(--navy)}
#stage.op .s-bv h2{font-size:72px}
.s-bv p{font-size:34px;line-height:1.35;color:#5b4a22;max-width:22em;white-space:pre-line}

/* espera (sem conteudo) */
.s-vazio{align-items:center;justify-content:center;text-align:center;background:var(--grad);color:#fff}
.s-vazio .logo{height:110px;margin-bottom:40px}
.s-vazio h2{font-size:150px;font-weight:800}
.s-vazio p{font-size:36px;opacity:.85}

/* lateral fixa */
.rail{display:none;grid-column:1;grid-row:1/4;flex-direction:column;gap:18px;min-height:0;padding:30px 26px 26px;background:#fff;border-right:1px solid var(--line)}
#stage.op .rail{display:flex}
.rh{display:flex;align-items:center;gap:12px;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:23px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.rh i{width:13px;height:13px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
.rh b{margin-left:auto;font-size:44px;color:var(--navy);letter-spacing:0;line-height:1}
.rsub{font-size:22px;color:var(--muted);margin:-10px 0 0 25px}
@keyframes pulse{50%{opacity:.25}}
#lig{display:flex;flex-direction:column;gap:10px;flex:none;max-height:300px;overflow:hidden}
.call,.q{background:var(--panel-2);border-radius:22px;padding:16px 20px}
.call{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:center;border-left:7px solid var(--good)}
.call b{font-size:27px;font-family:"Urbanist",system-ui,sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call span{grid-column:1;font-size:22px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call em{grid-column:2;grid-row:1/3;font-style:normal;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:34px;color:var(--good)}
.none{font-size:24px;color:var(--muted);padding:6px 4px}
.parado{font-size:22px;color:var(--warn);background:#FBF1DD;border-radius:16px;padding:12px 16px}
#fila{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:hidden}
.q{border-left:7px solid var(--warn)}
.q.crit{border-left-color:var(--crit)}
.q b{display:block;font-size:27px;font-family:"Urbanist",system-ui,sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q span{display:block;font-size:21px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q em{display:block;font-style:normal;font-family:"Urbanist",system-ui,sans-serif;font-weight:800;font-size:31px;color:var(--warn);margin-top:2px}
.q.crit em{color:var(--crit)}
.more{font-size:23px;font-weight:600;color:var(--muted);text-align:center;padding:4px}
.rdiv{height:1px;background:var(--line);margin:4px 0}

/* rodape: progresso */
.bot{padding:0 56px;display:flex;align-items:center;gap:20px}
.prog{flex:1;display:flex;gap:10px}
.prog i{flex:1;height:6px;border-radius:3px;background:#D5E0E4;overflow:hidden}
.prog i::after{content:"";display:block;height:100%;width:0;background:var(--petrol)}
.prog i.done::after{width:100%}
.prog i.on::after{animation:fill var(--dur,12s) linear forwards}
@keyframes fill{to{width:100%}}
#rede{font-size:20px;font-weight:600;color:var(--warn);display:none;white-space:nowrap}
#rede.on{display:block}


/* ===== temas ===== */

#alerta{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,48,61,.9)}

}

  const r=c.reuniao;if(!r||r.data!==todayISO())return null;

}

const FALA={ativas:{},ultima:0};
function escolherFala(){
  if(REDUCED||!ANIM.pronto||document.hidden)return;
  const agora=Date.now();for(const id in FALA.ativas)if(FALA.ativas[id]<agora)delete FALA.ativas[id];

  const cand=cols().filter(c=>c.frase&&String(c.frase).trim()&&ANIM.vistos.has(c._id)&&!FALA.ativas[c._id]&&ANIM.pos[c._id]&&!['reunioes','ausencia'].includes(ANIM.pos[c._id].room));if(!cand.length)return;
  const c=cand[Math.floor(Math.random()*cand.length)];FALA.ativas[c._id]=agora+6500;FALA.ultima=agora;}

  if(ls.length>2){ls.length=2;let s=ls[1];while(g.measureText(s+'…').width>max&&s.length>1)s=s.slice(0,-1);ls[1]=s+'…';}return ls;}
function desenharFalas(){
  const agora=Date.now();

    const vida=Math.min(1,(ate-agora)/400,(6500-(ate-agora))/250);g.save();g.globalAlpha=Math.max(0,vida);
    const ax=p.x+11,by=p.y-16;let bx=Math.max(4,Math.min(W-lw-4,ax-lw/2));const top=by-lh;
    g.fillStyle='rgba(20,16,30,.25)';g.beginPath();g.roundRect(bx+1,top+1.5,lw,lh,4);g.fill();

  else{const xx=r.x+20+Math.random()*(r.w-60),yy=Math.min(r.y+r.h-44,ya+Math.random()*40);
    pts=[{x:p.x,y:p.y},{x:p.x,y:ya},{x:xx,y:ya},{x:xx,y:yy},{x:xx,y:ya},{x:p.x,y:ya},{x:p.x,y:p.y}];}
  ANIM.walk[id]={pts,i:0,x:p.x,y:p.y,room:p.room,passeio:true,pausa:0};ANIM.refazerOverlay=true;}
function desenharAndando(){
  const ids=Object.keys(ANIM.walk);if(!ids.length)return;
  const V=1.7;
  ids.forEach(id=>{const w=ANIM.walk[id];if(w.fim)return;const c=cols().find(x=>x._id===id);if(!c){delete ANIM.walk[id];return;}
    const alvo=w.pts[w.i+1];let dy=0;
    if(!alvo){w.fim=true;}
    else if(w.pausa>0){w.pausa--;}
    else{const dx=alvo.x-w.x;dy=alvo.y-w.y;const d=Math.hypot(dx,dy);
      if(d<=V){w.x=alvo.x;w.y=alvo.y;w.i++;if(w.passeio&&w.i===Math.floor(w.pts.length/2))w.pausa=18;}
      else{w.x+=dx/d*V;w.y+=dy/d*V;}
      w.dir=dy<-0.3?'cima':'baixo';}
    const fr=w.pausa>0?0:(ANIM.quadro>>1)%2?1:2;
    shadow(w.x+11,w.y+37,7,2);put(spPessoa(vis(c),w.dir==='cima',false,fr),w.x,w.y);
    const nome=curto(c.nome);g.font='700 11px Inter,system-ui,sans-serif';const tw=g.measureText(nome).width+20;
    g.fillStyle='rgba(18,18,22,.9)';g.beginPath();g.roundRect(w.x+11-tw/2,w.y-12,tw,18,9);g.fill();g.fillStyle=corDep(c.depto);g.beginPath();g.arc(w.x+11-tw/2+8,w.y-3,3,0,7);g.fill();
    g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';g.fillText(nome,w.x+11-tw/2+14,w.y-2.7);
    if(w.i>=w.pts.length-1&&!w.pausa)w.fim=true;});}

}

const curto=n=>{const p=String(n||'').trim().split(/\s+/);let s=p[0]||'?';if(s.length>10)s=s.slice(0,9)+'.';return s;};
function pilula(x,y,txt,cor,fs=11,bg='rgba(18,18,22,.9)'){g.font=`700 ${fs}px Inter,system-ui,sans-serif`;const tw=g.measureText(txt).width,w=tw+(cor?20:12),h=fs+7;
  g.fillStyle=bg;g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,h/2);g.fill();if(cor){g.fillStyle=cor;g.beginPath();g.arc(x-w/2+8,y,3,0,7);g.fill();}
  g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';g.fillText(txt,x-w/2+(cor?14:6),y+.3);}
function caixa(x,y,l1,l2,bg){g.font='800 10px Inter,system-ui,sans-serif';const w=Math.max(g.measureText(l1).width,(g.font='600 10px Inter,system-ui,sans-serif',g.measureText(l2).width))+16;
  g.fillStyle=bg;g.beginPath();g.roundRect(x-w/2,y-14,w,28,4);g.fill();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='800 10px Inter,system-ui,sans-serif';g.fillText(l1,x,y-6);g.font='600 10px Inter,system-ui,sans-serif';g.fillText(l2,x,y+7);}
function desenharTags(){
  g.save();g.translate(0,TOP);
  Object.entries(ROOMS).forEach(([k,r])=>{pilula(r.x+r.w/2,r.y+13,r.nome,r.dep?corDep(r.dep):null,13,'rgba(14,18,26,.92)');});
  tags.forEach(t=>{
    if(t.k==='c'){const c=cols().find(x=>x._id===t.id);if(!c)return;pilula(t.x,t.y,curto(c.nome),t.mot?(t.mot==='Saiu'?'#8a94a8':'#f2b84b'):t.cor);}
    else if(t.k==='rank')pilula(t.x,t.y,t.n+'º '+t.txt,t.cor,11);
    else if(t.k==='bot')pilula(t.x,t.y,t.txt.length>14?t.txt.slice(0,13)+'…':t.txt,{'No ar':'#4fd27f','Pausado':'#ff6f66'}[t.st]||'#5ec8f2',9);
    else if(t.k==='srv')pilula(t.x,t.y,t.txt.length>9?t.txt.slice(0,8)+'…':t.txt,{'Ativa':'#4fd27f','Em avaliação':'#5ec8f2','Cancelar':'#ff9a3c'}[t.st]||'#8a94a8',8.5);
    else if(t.k==='mais')pilula(t.x,t.y,t.txt,null,10);
    else if(t.k==='mini')caixa(t.x,t.y,t.sala,t.txt+(t.extra?` +${t.extra}`:''),t.ocupada?'#4b3f9e':'rgba(40,46,62,.88)');
    else if(t.k==='ads')caixa(t.x,t.y,t.sala,t.txt,t.alerta?'rgba(120,72,10,.95)':'#4b3f9e');});
  g.restore();}
const normNome=n=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(/\s+/).filter(Boolean);
function aplicarLigacoes(){const hoje=todayISO();
  S.colaboradores.forEach(c=>{if(c.reuniao&&c.reuniao.fonte==='pabx')c.reuniao=null;});
  (LIG||[]).forEach(l=>{const a=normNome(l.agente);if(!a.length)return;const c=S.colaboradores.find(c=>{const n=normNome(c.nome);return n[0]===a[0]&&(a.length<2||n.includes(a[a.length-1]));});
    if(c&&!emReuniao(c))c.reuniao={tipo:'Ligação',cliente:l.cliente||'Cliente',data:hoje,inicio:'',fim:'',fonte:'pabx'};});}

function lembraCodigo(){try{localStorage.setItem("iris_tv",codigo);}catch(e){}}
var stage=document.getElementById("stage"),main=document.getElementById("main"),prog=document.getElementById("prog");
var FEED=null,offset=0,falhas=0,ultimoOk=0;
var oficina=null,escRecebido=null,escPayload=null;
var lista=[],cur=-1,timer=null,slideEl=null;
var vistos={};     // ligacao -> primeira vez vista (para contar o tempo)

/* ---------- utilidades ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function agora(){return Date.now()+offset;}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function palavras(s){return norm(s).split(/\s+/).filter(Boolean);}
function iniciais(n){var p=palavras(n);if(!p.length)return "";return (p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function hhmm(d){return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function idadeSeg(iso){if(!iso)return 1e9;var t=new Date(iso).getTime();return isNaN(t)?1e9:(agora()-t)/1000;}
function espera(seg){var m=Math.max(0,Math.floor(seg/60));return m>=60?Math.floor(m/60)+"h"+("0"+m%60).slice(-2)+" esperando":m+" min esperando";}
function mmss(seg){seg=Math.max(0,Math.floor(seg));var m=Math.floor(seg/60),s=seg%60;return m>=60?Math.floor(m/60)+":"+("0"+m%60).slice(-2)+":"+("0"+s).slice(-2):("0"+m).slice(-2)+":"+("0"+s).slice(-2);}

/* ---------- escala 1920x1080 em qualquer tela ---------- */
/* Ocupa a tela inteira em qualquer TV: a altura de desenho e sempre 1080 e a largura acompanha
   a proporcao real da tela (barra do navegador, 16:9, 16:10). Usa zoom quando existe, que deixa o
   texto nitido; se nao existir, cai para transform. */
var temZoom=!!(window.CSS&&CSS.supports&&CSS.supports("zoom","2"));
function escala(){
  var W=document.documentElement.clientWidth||innerWidth,H=document.documentElement.clientHeight||innerHeight;
  var s=H/1080,w=W/s;
  if(w<1600){w=1600;s=Math.min(W/1600,H/1080);}
  if(w>2560){w=2560;s=Math.min(W/2560,H/1080);}
  stage.style.width=Math.round(w)+"px";
  if(temZoom){
    stage.style.transform="none";stage.style.zoom=s;
    stage.style.left=((W-w*s)/2/s)+"px";stage.style.top=((H-1080*s)/2/s)+"px";
  }else{
    stage.style.left="50%";stage.style.top="50%";stage.style.transform="translate(-50%,-50%) scale("+s+")";
  }
}
addEventListener("resize",escala);escala();setTimeout(escala,500);

/* tela cheia com qualquer tecla do controle ou clique, e TV sem descanso de tela */
function telaCheia(){var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
  if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){try{var r=f.call(e);if(r&&r.catch)r.catch(function(){});}catch(x){}}}
addEventListener("keydown",telaCheia);addEventListener("click",telaCheia);
var trava=null;
function manterAcesa(){if(!navigator.wakeLock||document.visibilityState!=="visible")return;
  navigator.wakeLock.request("screen").then(function(l){trava=l;}).catch(function(){});}
document.addEventListener("visibilitychange",manterAcesa);manterAcesa();

/* ---------- relogio ---------- */
var DIAS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function relogio(){var d=new Date(agora());$("clock").textContent=hhmm(d);$("escHora").textContent=hhmm(d);
  $("dia").textContent=DIAS[d.getDay()];$("data").textContent=d.getDate()+" de "+MESES[d.getMonth()];}
relogio();setInterval(relogio,10000);

/* ---------- setor: liga departamento do Digisac ao do escritorio ---------- */
var SINONIMOS={advocacia:["advocacia","juridico"],pessoal:["pessoal","dp"],contabil:["contabil"],fiscal:["fiscal"],societario:["societario"],regulatorio:["regulatorio"]};
function chavesSetores(setores){var out=[];(setores||[]).forEach(function(s){var p=palavras(s),k=p[p.length-1]||"";out=out.concat(SINONIMOS[k]||[k]);});return out;}
function deptoDoAgente(nome){
  var p=escPayload&&escPayload.colaboradores;if(!p)return null;var a=palavras(nome);if(!a.length)return null;
  for(var i=0;i<p.length;i++){var n=palavras(p[i].nome);if(n[0]===a[0]&&(a.length<2||n.indexOf(a[a.length-1])>=0))return p[i].depto||"";}
  return null;}
function ligacaoDaTela(call){
  var t=FEED.tela;if(t.central||!t.setores||!t.setores.length)return true;
  var d=deptoDoAgente(call.agentName);if(d==null)return false;
  var dn=norm(d),ks=chavesSetores(t.setores);
  for(var i=0;i<ks.length;i++)if(dn.indexOf(ks[i])>=0)return true;return false;}

/* ---------- lateral: ligacoes e fila ---------- */
function desenhaLateral(){
  if(!FEED)return;var t=FEED.tela;
  stage.classList.toggle("op",!!t.mostra_fila);
  if(!t.mostra_fila)return;
  $("setores").textContent=(t.central||!t.setores||!t.setores.length)?"Todos os setores":t.setores.join(", ").replace(/Departamento /g,"");

  // ligacoes
  var L=FEED.ligacoes,box=$("lig");
  if(!L||idadeSeg(L.recebido_em)>CFG.ligVelhaSeg){
    $("nlig").textContent="–";
    box.innerHTML='<div class="parado">Ligações sem atualização'+(L&&L.recebido_em?" desde "+hhmm(new Date(L.recebido_em)):"")+'</div>';
  }else{
    var calls=(L.calls||[]).filter(ligacaoDaTela),agoraMs=agora(),vivos={};
    calls.forEach(function(c){var k=(c.agentName||"")+"|"+(c.callerNumber||c.callerName||"");vivos[k]=1;if(!vistos[k])vistos[k]=agoraMs;c._k=k;});
    for(var k in vistos)if(!vivos[k]&&!(L.calls||[]).some(function(c){return (c.agentName||"")+"|"+(c.callerNumber||c.callerName||"")===k;}))delete vistos[k];
    $("nlig").textContent=calls.length;
    box.innerHTML=calls.length?calls.slice(0,3).map(function(c){
      return '<div class="call"><b>'+esc(c.agentName||"Ramal")+'</b><em class="num">'+mmss((agoraMs-vistos[c._k])/1000)+'</em><span>'+esc(c.callerName||c.callerNumber||"Número não identificado")+'</span></div>';}).join("")
      +(calls.length>3?'<div class="more">mais '+(calls.length-3)+' em ligação</div>':"")
      :'<div class="none">Nenhuma ligação em andamento</div>';
  }

  // fila do digisac
  var F=FEED.fila,fb=$("fila");
  if(!F||idadeSeg(F.recebido_em)>CFG.filaVelhaSeg){
    $("nfila").textContent="–";
    fb.innerHTML='<div class="parado">Fila sem atualização'+(F&&F.recebido_em?" desde "+hhmm(new Date(F.recebido_em)):"")+'</div>';return;}
  var extra=Math.max(0,(agora()-new Date(F.gerado_em||F.recebido_em).getTime())/1000);
  var ts=(F.tickets||[]).map(function(x){return {c:x.clientName||"Cliente",a:x.agent||"Sem atendente",d:String(x.department||"").replace(/^Departamento /,""),s:(+x.idleSeconds||0)+extra};})
    .sort(function(a,b){return b.s-a.s;});
  $("nfila").textContent=ts.length;
  function draw(n){
    if(!ts.length){fb.innerHTML='<div class="none">Fila zerada. Bom trabalho!</div>';return;}
    var h=ts.slice(0,n).map(function(x){return '<div class="q'+(x.s>=3600?" crit":"")+'"><b>'+esc(x.c)+'</b><span>'+esc(x.a)+" · "+esc(x.d)+'</span><em class="num">'+espera(x.s)+'</em></div>';}).join("");
    if(n<ts.length)h+='<div class="more">mais '+(ts.length-n)+' na fila</div>';fb.innerHTML=h;}
  var n=Math.min(ts.length,14);draw(n);while(n>1&&fb.scrollHeight>fb.clientHeight+1){n--;draw(n);}
}
setInterval(desenhaLateral,1000);

/* ---------- escritorio virtual ---------- */
function atualizaEscritorio(){
  var E=FEED&&FEED.escritorio;if(!E||!E.payload||!E.payload.colaboradores)return;
  escPayload=E.payload;
  var ligs=(FEED.ligacoes&&idadeSeg(FEED.ligacoes.recebido_em)<=CFG.ligVelhaSeg?FEED.ligacoes.calls||[]:[]).map(function(c){return {agente:c.agentName,cliente:c.callerName||c.callerNumber};});
  try{
    if(!oficina)oficina=montarEscritorio($("cv"));
    oficina.atualizar(escPayload,ligs);escRecebido=E.recebido_em;
  }catch(e){console.error("escritorio",e);}
  var velho=idadeSeg(E.recebido_em)>CFG.escVelhoSeg;
  $("esc").classList.toggle("antigo",velho);
  if(velho)$("escVelho").textContent="Atualizado às "+hhmm(new Date(E.recebido_em));
}

/* ---------- conteudos ---------- */
function montaLista(){
  var out=[];
  if(escPayload)out.push({tipo:"escritorio",id:"escritorio",dur:CFG.escDur,nome:"Escritório virtual"});
  (FEED&&FEED.conteudos||[]).forEach(function(c){
    var d=Math.min(60,Math.max(6,+c.duracao_seg||12))*1000;
    out.push({tipo:c.tipo||"comunicado",id:c.id,dur:d,c:c,nome:(c.titulo||c.tipo||"").slice(0,80)});});
  if(!out.length)out.push({tipo:"vazio",id:"vazio",dur:30000,nome:"Sem conteúdo"});
  return out;}

function htmlSlide(it){
  var c=it.c||{};
  if(it.tipo==="vazio")return '<div class="slide s-vazio"><div class="logo"></div><h2 class="num">'+hhmm(new Date(agora()))+'</h2><p>'+esc(FEED&&FEED.tela?FEED.tela.nome:"")+'</p></div>';
  if(it.tipo==="elogio"){
    var quem=c.destinatario||c.titulo||"";var dep=deptoDoAgente(quem);var txt=c.texto||c.titulo||"";
    return '<div class="slide s-elo"><div class="tag"><i></i>'+esc(c.categoria&&c.categoria!=="elogios"?c.categoria:"Elogio")+'</div>'
      +'<blockquote class="'+(txt.length>220?"longo":"")+'">'+esc(txt.length>420?txt.slice(0,417)+"…":txt)+'</blockquote>'
      +(quem?'<div class="who"><div class="av">'+esc(iniciais(quem))+'</div><div><b>'+esc(quem)+'</b>'+(dep?'<span>'+esc(dep)+'</span>':"")+'</div></div>':"")+'</div>';}
  if(it.tipo==="boas_vindas"){
    var nome=c.destinatario||c.titulo||"";
    return '<div class="slide s-bv"><div class="big">'+esc(iniciais(nome)||"Oi")+'</div><div><div class="tag"><i></i>Boas-vindas</div><h2>'+esc(nome)+'</h2>'
      +(c.texto?'<p>'+esc(c.texto.slice(0,300))+'</p>':"")+'</div></div>';}
  // comunicado
  if(c.imagem_url&&!c.titulo&&!c.texto)return '<div class="slide s-img"><div style="background-image:url(\''+encodeURI(c.imagem_url).replace(/'/g,"%27")+'\')"></div></div>';
  var dq=c.destaque&&c.destaque.valor?c.destaque:null,lado="";
  if(dq)lado='<div class="side">'+(dq.rotulo?'<small>'+esc(dq.rotulo)+'</small>':"")+'<b class="num'+(String(dq.valor).length>3?" longo":"")+'">'+esc(dq.valor)+'</b>'+(dq.complemento?'<span>'+esc(dq.complemento)+'</span>':"")+'</div>';
  else if(c.imagem_url)lado='<div class="foto" style="background-image:url(\''+encodeURI(c.imagem_url).replace(/'/g,"%27")+'\')"></div>';
  var t=c.texto||"";
  return '<div class="slide s-com'+(lado?"":" sem-lado")+'"><div class="txt"><div class="tag"><i></i>Comunicado'+(c.categoria&&c.categoria!=="comunicado"?" · "+esc(c.categoria):"")+'</div>'
    +'<h2>'+esc(c.titulo||"")+'</h2>'+(t?'<p>'+esc(t.length>380?t.slice(0,377)+"…":t)+'</p>':"")+'</div>'+lado+'</div>';
}

function barras(){
  prog.innerHTML="";lista.forEach(function(_,k){var i=document.createElement("i");i.className=k<cur?"done":"";prog.appendChild(i);});
  var on=prog.children[cur];if(on){prog.style.setProperty("--dur",lista[cur].dur/1000+"s");void on.offsetWidth;on.className="on";}}

function proximo(){
  clearTimeout(timer);
  if(cur+1>=lista.length||!lista.length){lista=montaLista();cur=0;}else cur++;
  var it=lista[cur];
  var antigo=slideEl;slideEl=null;
  if(it.tipo==="escritorio"){$("esc").classList.add("on");stage.classList.add("cheia");}
  else{
    $("esc").classList.remove("on");stage.classList.remove("cheia");
    var w=document.createElement("div");w.innerHTML=htmlSlide(it);slideEl=w.firstChild;main.appendChild(slideEl);
    void slideEl.offsetWidth;slideEl.classList.add("on");}
  if(antigo){antigo.classList.remove("on");setTimeout(function(){if(antigo.parentNode)antigo.parentNode.removeChild(antigo);},900);}
  barras();
  timer=setTimeout(proximo,it.dur);
}

/* ---------- busca no banco ---------- */
function aviso(t,p){$("avisoT").textContent=t;$("avisoP").textContent=p;$("aviso").classList.add("on");}
function busca(){
  var atual=lista[cur]?lista[cur].nome:"";
  var ctl=new AbortController();var to=setTimeout(function(){ctl.abort();},15000);
  return fetch(CFG.url+"/rest/v1/rpc/iris_feed",{method:"POST",signal:ctl.signal,cache:"no-store",
    headers:{"apikey":CFG.chave,"Content-Type":"application/json"},
    body:JSON.stringify({p_codigo:codigo,p_tela_atual:atual,p_versao:CFG.versao})})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(d){
    clearTimeout(to);
    if(d&&d.erro==="tela_nao_encontrada"){aviso("Tela não encontrada","O código "+codigo+" não existe ou está desativado. Confira o link no Resiltrack, em Íris.");return false;}
    $("aviso").classList.remove("on");
    if(d.agora){var s=new Date(d.agora).getTime();if(!isNaN(s))offset=s-Date.now();}
    if(d.tela&&d.tela.codigo&&d.tela.codigo!==codigo)codigo=d.tela.codigo;
    if(!temaUrl)aplicaTema(d.tela&&d.tela.tema);
    lembraCodigo();FEED=d;falhas=0;ultimoOk=Date.now();$("rede").classList.remove("on");
    $("tvname").textContent=d.tela&&d.tela.nome||"Íris";
    atualizaEscritorio();desenhaLateral();
    return true;})
  .catch(function(e){clearTimeout(to);falhas++;console.warn("iris_feed",e);
    if(Date.now()-ultimoOk>120000&&FEED)$("rede").classList.add("on");
    if(!FEED&&falhas>=2)aviso("Conectando…","Não consegui falar com o servidor. Vou tentar de novo sozinha.");
    return false;});
}

/* ---------- atualizacao da propria pagina ---------- */
var marca=null;
function confereVersao(){
  fetch(location.pathname+"?v="+Date.now(),{method:"HEAD",cache:"no-store"}).then(function(r){
    var m=r.headers.get("etag")||r.headers.get("last-modified");if(!m)return;
    if(marca&&m!==marca)location.reload();marca=m;}).catch(function(){});}
setInterval(confereVersao,10*60000);confereVersao();
var diaInicio=new Date().getDate();
setInterval(function(){var d=new Date();if(d.getHours()===3&&d.getDate()!==diaInicio)location.reload();},5*60000);

/* ---------- alerta urgente ---------- */
function irisTocarSom(chave,url){
 if(url){ try{ const a=new Audio(url); a.volume=1; const p=a.play(); if(p&&p.catch) p.catch(function(e){console.warn("som",e);}); }catch(e){} return; }
 const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; let ctx; try{ ctx=new AC(); if(ctx.resume) ctx.resume(); }catch(e){ return; }
 const tom=(f,ini,dur,tipo,vol)=>{ const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+ini; o.type=tipo||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.05); };
 const P={
  padrao:[[784,0,1.1],[1175,0.32,1.3],[784,1.5,1.1],[1175,1.82,1.6]],
  bipe:[0,1.2,2.4].reduce((a,o)=>a.concat([[880,o,0.2,"square",0.25],[880,o+0.3,0.2,"square",0.25],[1100,o+0.6,0.4,"square",0.25]]),[]),
  alarme:Array.from({length:8},(_,i)=>[i%2?720:960,i*0.3,0.28,"sawtooth",0.22]),
  campainha:[[659,0,1.0],[523,0.55,1.5],[659,2.0,1.0],[523,2.55,1.6]]
 };
 (P[chave]||P.padrao).forEach(x=>tom(x[0],x[1],x[2],x[3],x[4]));
 setTimeout(()=>{ try{ctx.close();}catch(e){} },5500);
}

var alAtual=null,alTocados={};
function mostraAlerta(a){
  var box=$("alerta");
  if(!a){ if(alAtual){box.classList.remove("on");alAtual=null;} return; }
  if(!alAtual||alAtual.id!==a.id){
    $("alT").textContent=a.titulo||"";$("alT").className=(a.titulo||"").length>40?"longo":(a.titulo||"").length>18?"medio":"";
    $("alP").textContent=a.texto||"";$("alP").style.display=a.texto?"":"none";
    box.classList.add("on");
    if(!a.silencioso&&!alTocados[a.id]){alTocados[a.id]=1;irisTocarSom(a.som,a.som_url);}
  }
  alAtual=a;
  var ini=new Date(a.inicia_em).getTime(),fim=new Date(a.expira_em).getTime(),f=Math.max(0,Math.min(1,(fim-agora())/Math.max(1,fim-ini)));
  $("alB").style.transform="scaleX("+f+")";
}
function buscaAlerta(){
  if(!codigo)return;
  fetch(CFG.url+"/rest/v1/rpc/iris_alerta_ativo",{method:"POST",cache:"no-store",headers:{"apikey":CFG.chave,"Content-Type":"application/json"},body:JSON.stringify({p_codigo:codigo})})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(d){mostraAlerta(d&&d.alerta);})
  .catch(function(){ if(alAtual&&new Date(alAtual.expira_em).getTime()<agora())mostraAlerta(null); });
}
setInterval(buscaAlerta,5000);
setInterval(function(){ if(alAtual){ if(new Date(alAtual.expira_em).getTime()<agora())mostraAlerta(null); else mostraAlerta(alAtual);} },1000);

/* ---------- partida ---------- */
if(!codigo){aviso("Falta o código da TV","Digite o endereço com o código da TV depois do ponto de interrogação. Exemplo: resiltrack.resilcon.com.br/tv?cs");return;}
busca().then(function(ok){proximo();});
buscaAlerta();
setInterval(busca,CFG.buscaMs);
})();
