<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Admissão Resilcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--az:#066789;--az2:#269A9E;--esc:#044B64;--cl:#DCEAEF;--fu:#F3F6F7;--tx:#1C1C1C;--tx2:#5b6770;--ok:#0f7a5c;--warn:#b7791f;--err:#b4532a;--r:18px}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 "DM Sans",system-ui,sans-serif;color:var(--tx);background:var(--fu)}
h1,h2,h3{font-family:Urbanist,sans-serif;margin:0}
.top{background:linear-gradient(120deg,#006789,#269A9E);color:#fff;padding:28px 20px 70px}
.top .in,.wrap{max-width:860px;margin:0 auto}
.marca{font:800 22px Urbanist,sans-serif;letter-spacing:.5px;opacity:.95}.marca small{font-weight:600;opacity:.8;font-size:13px;margin-left:8px}
.top h1{font-size:28px;margin-top:22px}.top p{margin:6px 0 0;opacity:.92;max-width:640px}
.wrap{padding:0 16px 60px;margin-top:-48px}
.card{background:#fff;border-radius:var(--r);border:1px solid #e3eaee;padding:22px;margin-bottom:16px;box-shadow:0 6px 24px rgba(4,75,100,.06)}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.resumo div{background:var(--fu);border-radius:12px;padding:10px 14px}.resumo b{display:block;font-size:12px;color:var(--tx2);font-weight:500}.resumo span{font-weight:700}
.prog{height:8px;background:var(--cl);border-radius:8px;overflow:hidden;margin:14px 0 6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#006789,#269A9E);transition:width .4s}
.passos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.passos button{flex:0 0 auto;border:1px solid #d6e2e7;background:#fff;border-radius:999px;padding:8px 14px;font:500 14px "DM Sans",system-ui,sans-serif;color:var(--tx2);cursor:pointer}
.passos button.on{background:var(--esc);border-color:var(--esc);color:#fff}.passos button.ok:not(.on){border-color:#9fd3c2;color:var(--ok)}
.passos button.ok:not(.on)::before{content:"✓ ";font-weight:700}
h2{font-size:20px;margin-bottom:4px}.sub{color:var(--tx2);font-size:14px;margin:0 0 16px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.w2{grid-column:span 2}.w3{grid-column:1/-1}
@media(max-width:640px){.g,.g3{grid-template-columns:1fr}.w2{grid-column:auto}.top h1{font-size:23px}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:#33424a}
label.f em{color:var(--err);font-style:normal}label.f>span{display:block}
input,select,textarea{font:15px "DM Sans",system-ui,sans-serif;padding:11px 12px;border:1px solid #cfdbe0;border-radius:10px;background:#fff;color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9ccbdc;border-color:var(--az)}
input:disabled,select:disabled{background:#f1f4f5;color:#6b7a82}
.inv{border-color:#e0a07f!important;background:#fff8f4}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 20px;font:700 15px "DM Sans",system-ui,sans-serif;cursor:pointer}
.pri{background:linear-gradient(120deg,#006789,#269A9E);color:#fff}.sec{background:var(--cl);color:var(--esc)}.lnk{background:none;color:var(--az);padding:6px 4px}
.btn:disabled{opacity:.55;cursor:default}
.aviso{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}.aviso.warn{background:#fff6e5;border:1px solid #f1d39c}.aviso.err{background:#fdeee6;border:1px solid #f0c3ab}.aviso.ok{background:#e4f4ee;border:1px solid #a9dccb}.aviso.info{background:#e8f2f6;border:1px solid #c4dde7}
.doc{border:1px solid #e1e9ed;border-radius:14px;padding:14px;margin-bottom:12px}
.doc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.doc-h b{font-size:15px}.doc-h small{display:block;color:var(--tx2)}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}.tag.ob{background:#fdeee6;color:var(--err)}.tag.op{background:var(--fu);color:var(--tx2)}
.arqs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.arq{display:flex;align-items:center;gap:10px;background:var(--fu);border-radius:10px;padding:8px 10px;font-size:14px}.arq span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}.st.enviado{background:#e8f2f6;color:var(--az)}.st.aprovado{background:#e4f4ee;color:var(--ok)}.st.recusado{background:#fdeee6;color:var(--err)}
.mot{font-size:13px;color:var(--err);margin:2px 0 0 4px}
.up{margin-top:10px;display:inline-flex;align-items:center;gap:8px;border:1.5px dashed #9ccbdc;border-radius:10px;padding:9px 14px;color:var(--az);font-weight:700;cursor:pointer;background:#f7fbfc}
.up input{display:none}
.dep{border:1px solid #e1e9ed;border-radius:14px;padding:14px;margin-bottom:12px}
.pend li{margin:3px 0}.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.salvo{font-size:12px;color:var(--tx2);text-align:right;min-height:18px}
.vazio{text-align:center;padding:50px 20px}.vazio h2{margin-bottom:8px}
.load{color:var(--tx2);text-align:center;padding:40px}
footer{text-align:center;color:var(--tx2);font-size:12px;padding:10px 16px 30px}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="marca">RESILCON<small>Admissão</small></div><h1 id="tit">Bem-vindo(a)</h1><p id="sub">Carregando seus dados…</p></div></header>
<main class="wrap" id="app"><div class="card load">Carregando…</div></main>
<footer>Seus dados ficam guardados com segurança e só o RH da Resilcon tem acesso. Dúvidas? Fale com o RH.</footer>
<script>
const FN="https://aumfhrqrnudmprvmvesb.supabase.co/functions/v1/admissao-candidato";
const TOKEN=new URLSearchParams(location.search).get("t")||"";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
let D=null, F={}, DEP=[], passo=0, timer=null, salvando=false;

async function api(acao,dados){ const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:TOKEN,...(dados||{})})});
  const j=await r.json().catch(()=>({erro:"Falha de conexão. Tente de novo."})); if(!r.ok||j.erro) throw new Error(j.erro||"Erro"); return j; }

const OP={
 sexo:["Masculino","Feminino"],
 raca_cor:["Branca","Preta","Parda","Amarela","Indígena","Prefiro não informar"],
 estado_civil:["Solteiro(a)","Casado(a)","União estável","Divorciado(a)","Separado(a) judicialmente","Viúvo(a)"],
 escolaridade:["Analfabeto","Fundamental incompleto","Fundamental completo","Médio incompleto","Médio completo","Superior incompleto","Superior completo","Pós-graduação","Mestrado","Doutorado"],
 pcd:["Não","Deficiência física","Deficiência auditiva","Deficiência visual","Deficiência intelectual","Deficiência múltipla","Reabilitado"],
 camisa:["PP","P","M","G","GG","XG","XGG"],
 conta_tipo:["Corrente","Poupança","Salário"],
 pix_tipo:["CPF","E-mail","Telefone","Chave aleatória"],
 parentesco:["Filho(a) ou enteado(a)","Cônjuge","Companheiro(a)","Pai","Mãe","Irmão(ã)","Avô/Avó","Outro"],
 uf:["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"]
};
// [campo, rótulo, tipo, obrigatório, classe extra, opções]
const PASSOS=[
 {t:"Dados pessoais",d:"Como aparecem nos seus documentos.",c:[
  ["nome","Nome completo","text",1,"w2"],["nome_social","Nome social","text",0],["nascimento","Data de nascimento","date",1],
  ["sexo","Sexo","sel",1,"",OP.sexo],["genero","Identidade de gênero","text",0],["raca_cor","Raça/cor","sel",1,"",OP.raca_cor],
  ["estado_civil","Estado civil","sel",1,"",OP.estado_civil],["nacionalidade","Nacionalidade","text",1],["naturalidade","Naturalidade (cidade e estado)","text",0],
  ["nome_mae","Nome da mãe","text",1],["nome_pai","Nome do pai","text",0],["escolaridade","Grau de instrução","sel",1,"",OP.escolaridade],
  ["pcd","Pessoa com deficiência","sel",0,"",OP.pcd],["qtd_filhos","Quantidade de filhos","number",0],["camisa","Tamanho de camisa","sel",0,"",OP.camisa],
  ["telefone","Celular com DDD","tel",1],["email","E-mail pessoal","email",1]]},
 {t:"Documentos pessoais",d:"Números dos seus documentos. Os arquivos você envia no passo Anexos.",c:[
  ["cpf","CPF","cpf",1],["pis","PIS/PASEP/NIT","text",0],["rg","RG","text",0],["rg_emissao","Data de emissão do RG","date",0],["rg_orgao","Órgão/UF emissor do RG","text",0],
  ["titulo","Título de eleitor","text",0],["titulo_zona","Zona","text",0],["titulo_secao","Seção","text",0],
  ["ctps","Número da CTPS","text",0],["ctps_serie","Série da CTPS","text",0],["ctps_emissao","Emissão da CTPS","date",0],
  ["reservista","Certificado de reservista","text",0],["orgao_classe","Registro em órgão de classe (CRC, OAB...)","text",0]]},
 {t:"Endereço",d:"Digite o CEP que a gente completa o resto.",c:[
  ["cep","CEP","cep",1],["endereco","Endereço (rua, avenida)","text",1,"w2"],["numero","Número","text",1],["complemento","Complemento","text",0],
  ["bairro","Bairro","text",1],["cidade","Cidade","text",1],["uf","Estado","sel",1,"",OP.uf],["pais","País","text",0]]},
 {t:"Banco e emergência",d:"Conta para receber o salário e alguém para avisarmos em caso de emergência. Preencha a conta ou a chave PIX.",c:[
  ["banco","Banco","text",0],["agencia","Agência","text",0],["conta","Conta com dígito","text",0],["conta_tipo","Tipo de conta","sel",0,"",OP.conta_tipo],
  ["pix_tipo","Tipo da chave PIX","sel",0,"",OP.pix_tipo],["pix","Chave PIX","text",0],
  ["emergencia_nome","Nome do contato de emergência","text",1],["emergencia_telefone","Telefone do contato","tel",1],["emergencia_parentesco","Parentesco","sel",0,"",OP.parentesco]]},
 {t:"Dependentes",dep:true},
 {t:"Anexos",docs:true},
 {t:"Revisar e enviar",fim:true}
];

function maskCPF(v){ v=v.replace(/\D/g,"").slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); }
function maskCEP(v){ v=v.replace(/\D/g,"").slice(0,8); return v.replace(/(\d{5})(\d)/,"$1-$2"); }
function maskTel(v){ v=v.replace(/\D/g,"").slice(0,11); return v.length>10?v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3"):v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3").replace(/-$/,""); }
function cpfOk(c){ const d=String(c||"").replace(/\D/g,""); if(d.length!==11||/^(\d)\1{10}$/.test(d)) return false;
  const v=n=>{ let s=0; for(let i=0;i<n;i++) s+=+d[i]*(n+1-i); const r=s%11; return r<2?0:11-r; }; return v(9)==+d[9]&&v(10)==+d[10]; }

function campo([k,l,t,ob,cl,ops],obj,pref){ const val=obj[k]??"", id=(pref||"f_")+k, dis=D.editavel?"":"disabled", req=ob?" <em>*</em>":"";
  if(t==="sel") return `<label class="f ${cl||""}"><span>${l}${req}</span><select id="${id}" data-k="${k}" ${dis}><option value="">Selecione</option>${ops.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const tp={cpf:"text",cep:"text",tel:"tel",number:"number",date:"date",email:"email"}[t]||"text", im={cpf:"numeric",cep:"numeric",tel:"tel"}[t]||"";
  return `<label class="f ${cl||""}"><span>${l}${req}</span><input id="${id}" data-k="${k}" data-t="${t}" type="${tp}" ${im?`inputmode="${im}"`:""} value="${esc(val)}" ${dis} autocomplete="off"></label>`; }

function pendTotal(){ return (D.pendencias||[]).length; }
function render(){
  const P=PASSOS[passo], ed=D.editavel;
  const passosHtml=PASSOS.map((p,i)=>`<button data-p="${i}" class="${i===passo?"on":""} ${passoOk(i)?"ok":""}">${i+1}. ${p.t}</button>`).join("");
  let corpo="";
  if(P.c) corpo=`<div class="g">${P.c.map(c=>campo(c,F)).join("")}</div>`;
  else if(P.dep) corpo=depHtml();
  else if(P.docs) corpo=docsHtml();
  else corpo=fimHtml();
  const tot=PASSOS.length-1, feitos=PASSOS.slice(0,tot).filter((_,i)=>passoOk(i)).length;
  $("#app").innerHTML=`${avisosHtml()}
  <div class="card"><div class="resumo"><div><b>Cargo</b><span>${esc(D.cargo||"A definir")}</span></div><div><b>Início previsto</b><span>${dt(D.data_admissao)||"A definir"}</span></div><div><b>Envie até</b><span>${dt(D.prazo_docs)||"-"}</span></div></div>
   <div class="prog"><i style="width:${Math.round(feitos/tot*100)}%"></i></div><div class="sub" style="margin:0">${feitos} de ${tot} etapas completas</div></div>
  <div class="passos">${passosHtml}</div>
  <div class="card"><h2>${P.t}</h2>${P.d?`<p class="sub">${P.d}</p>`:""}${corpo}<div class="salvo" id="salvo"></div>
   <div class="nav">${passo>0?`<button class="btn sec" id="ant">Voltar</button>`:"<span></span>"}${passo<PASSOS.length-1?`<button class="btn pri" id="prox">Continuar</button>`:""}</div></div>`;
  liga();
}
function avisosHtml(){ let h="";
  if(D.observacao) h+=`<div class="aviso info"><b>Recado do RH:</b> ${esc(D.observacao)}</div>`;
  if(D.devolvido_motivo&&D.editavel) h+=`<div class="aviso err"><b>O RH pediu uma correção:</b> ${esc(D.devolvido_motivo)}</div>`;
  if(!D.editavel) h+=`<div class="aviso ok"><b>Recebemos sua ficha${D.enviado_em?` em ${dt(D.enviado_em)}`:""}.</b> O RH está conferindo e entra em contato se precisar de algo. Você pode só consultar o que enviou.</div>`;
  return h; }
function passoOk(i){ const P=PASSOS[i];
  if(P.c) return P.c.every(c=>!c[3]||String(F[c[0]]??"").trim())&&(P.t!=="Documentos pessoais"||cpfOk(F.cpf))&&(P.t!=="Banco e emergência"||!!(String(F.pix||"").trim()||(F.banco&&F.agencia&&F.conta)));
  if(P.dep) return true;
  if(P.docs) return obrigDocsOk();
  return false; }
function arqsDe(cod,dep){ return (D.arquivos||[]).filter(a=>a.doc_codigo===cod&&(dep==null?a.dependente==null:a.dependente===dep)); }
function obrigDocsOk(){ return (D.documentos||[]).filter(d=>d.obrigatorio).every(d=>d.grupo==="dependentes"?DEP.every((_,i)=>arqsDe(d.codigo,i).some(a=>a.status!=="recusado")):arqsDe(d.codigo).some(a=>a.status!=="recusado")); }

function depHtml(){ const ed=D.editavel;
  return `<p class="sub">Inclua filhos, cônjuge ou outras pessoas que dependem de você (para salário-família, imposto de renda e plano de saúde). Se não tiver, é só continuar.</p>
  ${DEP.map((d,i)=>`<div class="dep"><div class="doc-h"><b>Dependente ${i+1}</b>${ed?`<button class="btn lnk" data-rmdep="${i}">Remover</button>`:""}</div>
   <div class="g" style="margin-top:10px">${[["nome","Nome completo","text",1,"w2"],["parentesco","Parentesco","sel",1,"",OP.parentesco],["nascimento","Data de nascimento","date",1],["cpf","CPF","cpf",0],
   ["ir","Dependente no imposto de renda?","sel",0,"",["Sim","Não"]]].map(c=>campo(c,d,`d${i}_`)).join("")}</div></div>`).join("")}
  ${ed&&DEP.length<12?`<button class="btn sec" id="addDep">+ Adicionar dependente</button>`:""}`; }

function docItem(d,dep){ const ed=D.editavel, L=arqsDe(d.codigo,dep);
  return `<div class="doc"><div class="doc-h"><div><b>${esc(d.nome)}${dep!=null?` · ${esc(DEP[dep]?.nome||"Dependente "+(dep+1))}`:""}</b>${d.descricao?`<small>${esc(d.descricao)}</small>`:""}</div><span class="tag ${d.obrigatorio?"ob":"op"}">${d.obrigatorio?"Obrigatório":"Opcional"}</span></div>
  <div class="arqs">${L.map(a=>`<div><div class="arq"><span>${esc(a.nome||"arquivo")}</span><i class="st ${a.status}">${{enviado:"Enviado",aprovado:"Aprovado",recusado:"Recusado"}[a.status]}</i>${ed&&a.status!=="aprovado"?`<button class="btn lnk" data-rm="${a.id}">Remover</button>`:""}</div>${a.status==="recusado"&&a.motivo?`<div class="mot">Motivo: ${esc(a.motivo)}</div>`:""}</div>`).join("")}</div>
  ${ed?`<label class="up">+ Anexar arquivo<input type="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic" data-doc="${d.codigo}" ${dep!=null?`data-dep="${dep}"`:""} multiple></label>`:""}</div>`; }
function docsHtml(){ const Ds=D.documentos||[], pes=Ds.filter(d=>d.grupo!=="dependentes"), dep=Ds.filter(d=>d.grupo==="dependentes");
  return `<p class="sub">PDF, JPG ou PNG, até 5 MB cada. Foto do celular serve, desde que dê para ler. Pode enviar frente e verso em arquivos separados.</p>
  ${pes.map(d=>docItem(d,null)).join("")}
  ${dep.length?(DEP.length?DEP.map((_,i)=>dep.map(d=>docItem(d,i)).join("")).join(""):`<div class="aviso info">Se você tiver dependentes, cadastre no passo anterior para enviar os documentos deles.</div>`):""}`; }
function fimHtml(){ const p=D.pendencias||[];
  return `${p.length?`<div class="aviso warn"><b>Ainda falta:</b><ul class="pend">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div class="aviso ok">Tudo preenchido. Confira e envie para o RH.</div>`}
  <label class="chk"><input type="checkbox" id="lgpd" ${F.aceite_lgpd?"checked":""} ${D.editavel?"":"disabled"}><span>Autorizo a ${esc(D.empresa||"Resilcon")} a usar os dados e documentos enviados aqui para o meu processo de admissão, o registro do contrato de trabalho, o eSocial, a folha de pagamento e os benefícios, conforme a Lei Geral de Proteção de Dados (LGPD). Declaro que as informações são verdadeiras.</span></label>
  ${D.editavel?`<div class="nav"><span></span><button class="btn pri" id="enviar" ${p.length?"disabled":""}>Enviar para o RH</button></div>`:""}`; }

function liga(){
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{ await salvarJa(); passo=+b.dataset.p; render(); scrollTo(0,0); });
  const a=$("#ant"), p=$("#prox");
  if(a) a.onclick=async()=>{ await salvarJa(); passo--; render(); scrollTo(0,0); };
  if(p) p.onclick=async()=>{ marcaInvalidos(); await salvarJa(); passo++; render(); scrollTo(0,0); };
  document.querySelectorAll("input[data-k],select[data-k]").forEach(el=>{
    const dId=el.id.match(/^d(\d+)_/), alvo=()=>dId?DEP[+dId[1]]:F;
    el.oninput=()=>{ const t=el.dataset.t;
      if(t==="cpf") el.value=maskCPF(el.value); if(t==="cep") el.value=maskCEP(el.value); if(t==="tel") el.value=maskTel(el.value);
      alvo()[el.dataset.k]=el.value; agenda();
      if(t==="cep"&&el.value.replace(/\D/g,"").length===8) buscaCep(el.value); };
    el.onchange=el.oninput; });
  const ad=$("#addDep"); if(ad) ad.onclick=()=>{ DEP.push({}); agenda(); render(); };
  document.querySelectorAll("[data-rmdep]").forEach(b=>b.onclick=()=>{ if(!confirmar(b)) return; DEP.splice(+b.dataset.rmdep,1); agenda(); render(); });
  document.querySelectorAll("input[type=file][data-doc]").forEach(i=>i.onchange=()=>enviarArquivos(i));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{ if(!confirmar(b)) return; b.disabled=true;
    try{ await api("remover",{arquivo_id:b.dataset.rm}); await recarregar(); }catch(e){ alert(e.message); b.disabled=false; } });
  const lg=$("#lgpd"); if(lg) lg.onchange=async()=>{ F.aceite_lgpd=lg.checked?"sim":null; if(!lg.checked) delete F.aceite_lgpd; await salvarJa(); render(); };
  const en=$("#enviar"); if(en) en.onclick=enviarTudo;
}
function confirmar(b){ if(b.dataset.ok==="1") return true; b.dataset.ok="1"; b.textContent="Confirmar?"; setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=""; b.textContent="Remover"; } },3500); return false; }
function marcaInvalidos(){ document.querySelectorAll("label.f").forEach(l=>{ const el=l.querySelector("[data-k]"); if(!el) return;
  const ob=!!l.querySelector("em"), v=String(el.value||"").trim(); el.classList.toggle("inv",(ob&&!v)||(el.dataset.t==="cpf"&&v&&!cpfOk(v))); }); }

function agenda(){ if(!D.editavel) return; clearTimeout(timer); $("#salvo")&&($("#salvo").textContent="Salvando…"); timer=setTimeout(salvarJa,900); }
async function salvarJa(){ if(!D.editavel) return; clearTimeout(timer);
  if(F.cpf&&!cpfOk(F.cpf)){ const s=$("#salvo"); if(s) s.textContent="Confira o CPF: o número não é válido."; return; }
  salvando=true;
  try{ const r=await api("salvar",{ficha:F,dependentes:DEP}); D.pendencias=r.pendencias; const s=$("#salvo"); if(s) s.textContent="Salvo automaticamente";
    document.querySelectorAll(".passos button").forEach((b,i)=>b.classList.toggle("ok",passoOk(i))); }
  catch(e){ const s=$("#salvo"); if(s) s.textContent=e.message; } finally{ salvando=false; } }

async function buscaCep(c){ try{ const r=await fetch(`https://viacep.com.br/ws/${c.replace(/\D/g,"")}/json/`); const j=await r.json(); if(j.erro) return;
  Object.assign(F,{endereco:j.logradouro||F.endereco,bairro:j.bairro||F.bairro,cidade:j.localidade||F.cidade,uf:j.uf||F.uf,pais:F.pais||"Brasil"});
  ["endereco","bairro","cidade","uf","pais"].forEach(k=>{ const el=$("#f_"+k); if(el) el.value=F[k]||""; }); agenda(); }catch(e){} }

// Imagens grandes são reduzidas no próprio celular antes de subir.
function lerB64(file){ return new Promise((ok,er)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result)); r.onerror=er; r.readAsDataURL(file); }); }
async function reduzir(file){ if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.5e6) return [await lerB64(file),file.name];
  const url=URL.createObjectURL(file), img=await new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=er; i.src=url; });
  const k=Math.min(1,2200/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); return [c.toDataURL("image/jpeg",.85),file.name.replace(/\.\w+$/,"")+".jpg"]; }
async function enviarArquivos(inp){ const files=[...inp.files]; if(!files.length) return; const lab=inp.closest(".up"); const txt=lab.firstChild.textContent;
  for(const [n,f] of files.entries()){ lab.firstChild.textContent=`Enviando ${n+1} de ${files.length}…`;
    try{ const [b64,nome]=await reduzir(f); if(b64.length>7.1e6) throw new Error(`${f.name}: maior que 5 MB. Tente uma foto menor ou um PDF mais leve.`);
      await api("upload",{doc_codigo:inp.dataset.doc,dependente:inp.dataset.dep??"",nome,base64:b64}); }
    catch(e){ alert(e.message); } }
  lab.firstChild.textContent=txt; await recarregar(); }

async function enviarTudo(){ const b=$("#enviar"); b.disabled=true; b.textContent="Enviando…";
  try{ await salvarJa(); const r=await api("enviar"); if(r.ok===false){ D.pendencias=r.pendencias; render(); return; } await recarregar(); scrollTo(0,0); }
  catch(e){ alert(e.message); b.disabled=false; b.textContent="Enviar para o RH"; } }

async function recarregar(){ D=await api("abrir"); F=D.ficha||{}; Object.keys(F).forEach(k=>F[k]==null&&delete F[k]); if(F.cpf) F.cpf=maskCPF(F.cpf); if(F.telefone) F.telefone=maskTel(F.telefone);
  DEP=Array.isArray(D.dependentes)?D.dependentes:[];
  const pn=String(F.nome||D.nome||"").trim().split(/\s+/)[0]||"";
  $("#tit").textContent=`Olá, ${pn.charAt(0)+pn.slice(1).toLowerCase()}!`;
  $("#sub").textContent=D.editavel?`Que bom ter você na ${D.empresa||"Resilcon"}. Preencha seus dados e envie os documentos para a gente preparar sua admissão. Tudo é salvo enquanto você digita, então dá para parar e voltar depois pelo mesmo link.`:`Sua ficha está com o RH da ${D.empresa||"Resilcon"}.`;
  render(); }

(async()=>{ if(!/^[0-9a-f]{40,64}$/.test(TOKEN)){ fim("Link incompleto","Abra o link exatamente como chegou no e-mail ou no WhatsApp. Se não funcionar, peça um novo ao RH."); return; }
  try{ await recarregar(); }catch(e){ fim("Não foi possível abrir",e.message); } })();
function fim(t,m){ $("#tit").textContent=t; $("#sub").textContent=""; $("#app").innerHTML=`<div class="card vazio"><h2>${esc(t)}</h2><p class="sub">${esc(m)}</p></div>`; }
window.addEventListener("beforeunload",e=>{ if(timer||salvando){ e.preventDefault(); e.returnValue=""; } });
</script>
