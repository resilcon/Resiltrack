<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resiltrack</title>
<meta name="description" content="Painel de qualidade de atendimento da Resilcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f5fa;--surface:#fff;--surface-2:#fafbff;--ink:#1a1b28;--ink-2:#4a4d63;--muted:#83879c;
    --border:#e7e9f2;--border-strong:#d6d9e8;--accent:#6d3bd6;--accent-soft:#efe9fd;--accent-deep:#4c2a95;
    --good:#128a5b;--good-soft:#e3f4ec;--warn:#b7791f;--warn-soft:#fbf1dd;--crit:#cf4257;--crit-soft:#fbe6ea;
    --shadow:0 1px 2px rgba(26,27,40,.04),0 6px 20px rgba(26,27,40,.05);--shadow-lg:0 12px 40px rgba(26,27,40,.18);--radius:14px;
    color-scheme:light;
  }
  /* tema claro unico — sem modo escuro */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Sora",system-ui,sans-serif;margin:0;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px 72px}
  img{max-width:100%}

  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .bar{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
  .logo{width:38px;height:38px;flex:none}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .brand p{margin:0;font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .user-chip{font-size:12px;color:var(--muted)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
  .icon-btn:hover{border-color:var(--border-strong);color:var(--ink)}
  .txt-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
  .txt-btn:hover{border-color:var(--border-strong);color:var(--ink)}

  /* nav */
  nav.tabs{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

  section{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .sec-head .hint{font-size:12px;color:var(--muted)}
  .page-head{margin:26px 0 4px}
  .page-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
  .tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
  .tile .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .val{font-family:"Sora",sans-serif;font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-top:3px}
  .tile .val small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
  .ic.violet{background:var(--accent-soft);color:var(--accent)}.ic.amber{background:var(--warn-soft);color:var(--warn)}
  .ic.green{background:var(--good-soft);color:var(--good)}.ic.red{background:var(--crit-soft);color:var(--crit)}
  .cx{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .cx .tile{padding:15px 18px}.cx .val{font-size:24px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--surface-2)}
  .r-name{font-weight:600}.sub{font-size:12px;color:var(--muted)}.right{text-align:right}.center{text-align:center}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .pill.good{color:var(--good);background:var(--good-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}.pill.crit{color:var(--crit);background:var(--crit-soft)}
  .pill.neutral{color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2)}
  .chip.err{color:var(--crit);background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
  .chip.churn{color:var(--crit);background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent);font-weight:600}
  .canal{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .nota{font-family:"Sora",sans-serif;font-weight:700;font-size:14px;padding:5px 9px;border-radius:8px;display:inline-block;min-width:44px;text-align:center}
  .nota.g{color:var(--good);background:var(--good-soft)}.nota.a{color:var(--warn);background:var(--warn-soft)}.nota.r{color:var(--crit);background:var(--crit-soft)}.nota.n{color:var(--muted);background:var(--surface-2)}
  .score-wrap{display:flex;align-items:center;gap:10px}
  .meter{width:76px;height:7px;border-radius:4px;background:var(--border);overflow:hidden}.meter>span{display:block;height:100%;border-radius:4px}
  .score-num{font-family:"Sora",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
  .view-btn{border:1px solid var(--border);background:var(--surface);color:var(--accent);font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .view-btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .view-btn.ghost{color:var(--ink-2)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{position:relative;flex:1;min-width:200px;max-width:360px}
  .search input,select.inp{width:100%;padding:9px 12px 9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit}
  .search input{padding-left:34px}
  .search input:focus,select.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  select.inp{max-width:260px;cursor:pointer}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .soon{padding:64px 24px;text-align:center;color:var(--muted)}
  .soon svg{color:var(--border-strong);margin-bottom:12px}

  /* cards grid (clientes / colaboradores) */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .1s}
  .ecard:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .ecard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ecard .en{font-weight:600;font-size:14.5px;line-height:1.3}
  .ecard .ecnpj{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .ecard .stats{display:flex;gap:16px;margin-top:14px}
  .ecard .st .n{font-family:"Sora",sans-serif;font-weight:700;font-size:18px}
  .ecard .st .l{font-size:11px;color:var(--muted)}
  .health{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
  .health.fa{color:var(--good);background:var(--good-soft)}.health.sensivel{color:var(--crit);background:var(--crit-soft)}.health.neutro{color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,16,23,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden}
  .modal-head{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
  .modal-head .mh-l{flex:1}.modal-head .m-sub{font-size:12px;opacity:.85}.modal-head h3{font-size:19px;font-weight:700;margin:2px 0 8px}
  .modal-head .m-chips{display:flex;gap:8px;flex-wrap:wrap}.modal-head .m-chip{font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-weight:500}
  .m-score{text-align:center;flex:none}.m-score .big{font-family:"Sora",sans-serif;font-size:34px;font-weight:700;line-height:1}.m-score .of{font-size:12px;opacity:.8}.m-score .tag{font-size:11px;font-weight:600;margin-top:6px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;display:inline-block}
  .modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
  .panel{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .panel h4{font-family:"Sora",sans-serif;font-size:13px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .field .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}.field .v{font-size:13.5px;color:var(--ink);margin-top:1px}
  .prose{font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .axis{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}.axis:last-child{border-bottom:none}
  .axis .ax-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
  .axis .ax-main{flex:1}.axis .ax-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .axis .ax-name{font-weight:600;font-size:13.5px}.axis .ax-note{font-family:"Sora",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
  .axis .ax-just{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  ul.melhorias{margin:0;padding-left:18px}ul.melhorias li{font-size:13px;color:var(--ink-2);margin-bottom:6px;line-height:1.5}
  .close-x{background:rgba(255,255,255,.16);border:none;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none}.close-x:hover{background:rgba(255,255,255,.28)}
  .conversa{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg.at{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:4px}
  .msg.cl{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg .who{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.6;display:block;margin-bottom:2px}
  .msg .who .when{font-weight:400;letter-spacing:0;text-transform:none;opacity:.85;margin-left:6px}
  .mini-list{display:flex;flex-direction:column;gap:2px}
  .mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
  .mini-row:last-child{border-bottom:none}
  .mini-row .mr-l{min-width:0}.mini-row .mr-l .t{font-size:13px;font-weight:500}.mini-row .mr-l .s{font-size:11.5px;color:var(--muted)}
  .btn-primary{border:none;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer}
  .btn-primary:hover{background:var(--accent-deep)}.btn-primary:disabled{opacity:.5;cursor:default}
  .btn-line{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font:inherit;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer}
  textarea.inp{width:100%;min-height:88px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
  textarea.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface-2)}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .opt .ot{font-weight:600;font-size:13px}.opt .os{font-size:11.5px;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 16px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
  .seg button{border:none;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
  select.fsel{font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;max-width:230px}
  select.fsel:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .fdate{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
  .fdate input{border:none;background:none;font:inherit;font-size:12.5px;color:var(--ink);color-scheme:light}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .pager .pg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .pager .pg button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;min-width:32px;height:32px;border-radius:8px;cursor:pointer;padding:0 8px}
  .pager .pg button:hover:not(:disabled){border-color:var(--border-strong);color:var(--ink)}
  .pager .pg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager .pg button:disabled{opacity:.4;cursor:default}
  .link-name{color:var(--ink);font-weight:600;cursor:pointer;border:none;background:none;font:inherit;padding:0;text-align:left}
  .link-name:hover{color:var(--accent);text-decoration:underline}
  td[title],span[title],.chip[title]{cursor:help}
  th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--ink)}
  th.sortable .arw{opacity:.5;font-size:10px;margin-left:3px}

  /* submenu da dashboard */
  .subnav{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:22px 0 4px;box-shadow:var(--shadow)}
  .subnav button{flex:1;min-width:150px;border:none;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .subnav button:hover{color:var(--ink)}
  .subnav button.on{background:var(--accent-soft);color:var(--accent)}

  /* mini kpi (pendências) */
  .mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  .mini-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .mini-kpi .n{font-family:"Sora",sans-serif;font-size:24px;font-weight:700;line-height:1.1}
  .mini-kpi .l{font-size:12px;color:var(--muted);margin-top:3px}

  /* risco / status cliente */
  .risco{font-family:"Sora",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:8px;display:inline-block;min-width:40px;text-align:center;font-size:13px}
  .risco.saudavel{color:var(--good);background:var(--good-soft)}.risco.alerta{color:var(--warn);background:var(--warn-soft)}.risco.critico{color:var(--crit);background:var(--crit-soft)}
  .st-ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px}
  .st-ic.saudavel{color:var(--good);background:var(--good-soft)}.st-ic.alerta{color:var(--warn);background:var(--warn-soft)}.st-ic.critico{color:var(--crit);background:var(--crit-soft)}

  /* card de equipe (análise por setor) */
  .team{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .team.risco{border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:color-mix(in srgb,var(--crit-soft) 55%,var(--surface))}
  .team .th{display:flex;align-items:flex-start;gap:12px}
  .team .rank{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:"Sora",sans-serif;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
  .team .rank.gold{background:#fdf3d6;color:#b7791f}.team .rank.silver{background:#eef0f5;color:#6b7280}.team .rank.bronze{background:#f6e9dd;color:#a9611f}
  .team .tname{font-family:"Sora",sans-serif;font-weight:700;font-size:16px}
  .team .tmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .team .tscores{display:flex;gap:22px;margin-left:auto;text-align:right}
  .team .tscores .sc .v{font-family:"Sora",sans-serif;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
  .team .tscores .sc .k{font-size:11px;color:var(--muted)}
  .team .tclientes{display:flex;gap:14px;font-size:12.5px;flex-wrap:wrap}
  .team .tclientes span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
  .team .tacts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px}

  /* aviso / vazio elegante */
  .notice{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:12px;padding:16px 18px;color:var(--accent-deep);font-size:13px;line-height:1.6}

  /* evolução setor — grade semanal */
  .mesnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}
  .mesnav .navb{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
  .mesnav .navb:hover{border-color:var(--border-strong);color:var(--ink)}

<script>
let ATEND=[], RAW=[], USERS={}, EMPRESAS={}, CONTATOS={}, CONTESTS={}, sb=null, ME="";
let TAB="dashboard";
let DSUB="colab"; // colab | health | setores | servico
let DFIL={preset:"30d",ini:"",fim:"",colab:"",setor:"",sort:"media_desc"};
let TFIL={q:"",colab:"",setor:"",compl:"",desfecho:"",nota:"",sort:"data_desc",page:1};
let HFIL={status:"",q:"",sort:"risco_desc"};
let CFIL={q:"",status:"",servico:"",sort:"atend_desc"};
let CLFIL={q:"",setor:"",sort:"media_desc"};
const PAGE_SIZE=30;

// ---------- helpers ----------
const num = v => (v===null||v===undefined||v==="")?null:Number(v);
const fmt1 = v => v===null||v===undefined||isNaN(v)?"—":Number(v).toFixed(1).replace(".",",");
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => (s??"").toString().replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const asArr = v => Array.isArray(v)?v:(typeof v==="string"?(()=>{try{return JSON.parse(v)}catch{return []}})():[]);
const fmtDate = s => { if(!s) return "—"; const d=new Date(s); return isNaN(d)?"—":d.toLocaleDateString("pt-BR"); };
const fmtTime = s => { if(!s) return ""; const d=new Date(s); return isNaN(d)?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const fmtDateTime = s => { if(!s) return "—"; const d=new Date(s); return isNaN(d)?"—":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const desfechoTxt = {resolvido:"Resolvido",encaminhado:"Encaminhado",sem_retorno_cliente:"Sem retorno do cliente",nao_resolvido:"Não resolvido"};
const notaClass = n => n===null?"n":(n>=8?"g":(n>=6?"a":"r"));
const scoreColor = n => n===null?"var(--muted)":(n>=8?"var(--good)":(n>=6?"var(--warn)":"var(--crit)"));
const cxLabel = {baixa:"Baixa",media:"Média",alta:"Alta",sem_classificacao:"Sem classif."};
const cxColor = {baixa:"var(--good)",media:"var(--warn)",alta:"var(--crit)"};
const satMeta = {positivo:{t:"Positivo",c:"good"},neutro:{t:"Neutro",c:"neutral"},negativo:{t:"Negativo",c:"crit"}};
const escAttr = s => esc(s).replace(/"/g,"&quot;");
const perfStatus = p => p===null?"ausente":(p>=85?"good":(p>=70?"warn":"crit"));
const perfTxt = {good:"Na meta",warn:"Atenção",crit:"Crítico",ausente:"Ausente"};
const desfechoCurto = d => d==="sem_retorno_cliente"?"Sem retorno":(desfechoTxt[d]||d||"—");
const fmtDur = min => (min===null||min===undefined||isNaN(min)||min<=0)?"—":(min<60?Math.round(min)+"min":((min/60)>=10?Math.round(min/60):(min/60).toFixed(1).replace(".",","))+"h");
const fmtDataCurta = ts => ts?new Date(ts).toLocaleDateString("pt-BR"):"—";
function setoresList(){ const s=new Set(); Object.values(USERS).forEach(u=>{ if(u.setor) s.add(u.setor); }); ATEND.forEach(a=>{ if(a.setor&&a.setor!=="—") s.add(a.setor); }); return [...s].sort(); }
function colabsList(){ const m=new Map(); Object.entries(USERS).forEach(([id,u])=>{ if(u.ativo!==false) m.set(id,u.nome); }); ATEND.forEach(a=>{ if(a.atendente_id&&!m.has(a.atendente_id)) m.set(a.atendente_id,a.atendente); }); return [...m.entries()].map(([id,nome])=>({id,nome})).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"")); }
function filtraDash(){ const now=Date.now(); let ini=null,fim=null;
  if(DFIL.preset==="7d") ini=now-7*864e5; else if(DFIL.preset==="30d") ini=now-30*864e5;
  else if(DFIL.preset==="custom"){ if(DFIL.ini) ini=new Date(DFIL.ini+"T00:00:00").getTime(); if(DFIL.fim) fim=new Date(DFIL.fim+"T23:59:59").getTime(); }
  return ATEND.filter(a=>{ if(ini&&a.ts<ini) return false; if(fim&&a.ts>fim) return false;
    if(DFIL.setor&&a.setor!==DFIL.setor) return false;
    if(DFIL.colab&&(a.atendente_id||a.atendente)!==DFIL.colab) return false; return true; });
}
function pagerHTML(total,page,totalP,start,shown){ const from=total?start+1:0,to=start+shown; let btns="";
  const add=(p,lbl,on,dis)=>{ btns+=`<button data-pg="${p}" class="${on?'on':''}" ${dis?'disabled':''}>${lbl}</button>`; };
  add(Math.max(1,page-1),"‹",false,page<=1);
  let s=Math.max(1,page-2),e=Math.min(totalP,s+4); s=Math.max(1,e-4);
  if(s>1){ add(1,"1",false,false); if(s>2) btns+='<span class="sub">…</span>'; }
  for(let p=s;p<=e;p++) add(p,String(p),p===page,false);
  if(e<totalP){ if(e<totalP-1) btns+='<span class="sub">…</span>'; add(totalP,String(totalP),false,false); }
  add(Math.min(totalP,page+1),"›",false,page>=totalP);
  return `<div class="pager"><span>Mostrando ${from}–${to} de ${total}</span><div class="pg">${btns}</div></div>`;
}

// palavras que sugerem risco de troca de contabilidade
const CHURN_KW = ["troca de contab","trocar de contab","migrar de contab","migração de contab","nova contabilidade","contabilidade anterior","transição contábil","transicao contabil","documentos para transição","balancete","balancetes","encerrar o contrato","rescisão de contrato","rescisao de contrato","distrato","cancelar o contrato","sair da resilcon","encerramento da empresa","muito insatisfeit","estou insatisfeit","pessimo atendimento","péssimo atendimento"];
function churnScan(a){
  const blob = ((a.resumo||"")+" "+(a.transcript||"")+" "+a.sinais.join(" ")+" "+a.erros.join(" ")).toLowerCase();
  return CHURN_KW.some(k=>blob.includes(k));
}

// ---------- resolução de cliente (contato -> empresa) ----------
function empresaDoContato(contactId){
  const c = CONTATOS[contactId];
  if(!c || !c.empresa_id) return null;
  return EMPRESAS[c.empresa_id] || null;
}
function clienteNome(a){
  const emp = empresaDoContato(a.contact_id);
  if(emp) return emp.apelido || emp.nome;
  const c = CONTATOS[a.contact_id];
  if(c && c.nome) return c.nome;
  return "—";
}
function empresaIdDe(a){ const c=CONTATOS[a.contact_id]; return c?c.empresa_id:null; }

// ---------- map de uma análise ----------
function mapRow(r){
  const a = {
    id:r.id, ticket_id:r.ticket_id, contact_id:r.contact_id, atendente_id:r.atendente_id,
    data:fmtDate(r.sessao_inicio||r.sessao_fim||r.criado_em), hora:fmtTime(r.sessao_inicio||r.sessao_fim),
    dataHora:fmtDateTime(r.sessao_inicio||r.sessao_fim||r.criado_em),
    ts:new Date(r.sessao_fim||r.sessao_inicio||r.criado_em||0).getTime(),
    atendente:(USERS[r.atendente_id]&&USERS[r.atendente_id].nome)||r.atendente_nome||"Não identificado",
    setor:(USERS[r.atendente_id]&&USERS[r.atendente_id].setor)||r.setor||"—",
    atendenteAtivo:USERS[r.atendente_id]?USERS[r.atendente_id].ativo:null,
    assunto:r.assunto_principal||"—", nota:num(r.nota_final), complexidade:r.complexidade||null,
    canal:r.canal||"whatsapp", tipo:r.tipo_atendimento||null, resumo:r.resumo||"Sem resumo.",
    cx_just:r.complexidade_justificativa||"—",
    r:{v:num(r.nota_resolucao),j:r.nota_resolucao_justificativa||"—"},
    ra:{v:num(r.nota_rapidez),j:r.nota_rapidez_justificativa||"—"},
    s:{v:num(r.nota_satisfacao),j:r.nota_satisfacao_justificativa||"—"},
    erros:asArr(r.erros), sinais:asArr(r.sinais_de_risco),
    oport:r.oportunidade_comercial||null, melhorias:asArr(r.oportunidades_de_melhoria),
    satisfacao:r.satisfacao_cliente||null, transcript:r.transcript||"",
    desfecho:r.desfecho||null, aderencia:{v:num(r.aderencia_jeito_resilcon),j:r.aderencia_justificativa||"—"},
    errosPt:asArr(r.erros_portugues), riscoTroca:r.risco_troca_contabilidade||null, churnMotivo:r.churn_motivo||null,
    docErrado:r.documento_errado===true, docErradoDetalhe:r.documento_errado_detalhe||null,
    servico:r.servico||null,
    durMin:(r.sessao_inicio&&r.sessao_fim)?Math.max(0,(new Date(r.sessao_fim)-new Date(r.sessao_inicio))/60000):null
  };
  a.cliente = clienteNome(a);
  a.empresa_id = empresaIdDe(a);
  a.churn = (a.riscoTroca==="possivel"||a.riscoTroca==="provavel") || churnScan(a);
  return a;
}

// ---------- carregar dados ----------
// Supabase devolve no máximo 1000 linhas por consulta. Buscamos em páginas de 1000
// com .range() até trazer tudo, senão o painel travava em 1000.
async function fetchAllRows(table, columns, orderCol){
  const A="atendimentos", PAGE=1000; let from=0, all=[];
  while(true){
    let q=sb.schema(A).from(table).select(columns).range(from,from+PAGE-1);
    if(orderCol) q=q.order(orderCol,{ascending:false,nullsFirst:false});
    const {data,error}=await q;
    if(error) throw error;
    all=all.concat(data||[]);
    if(!data || data.length<PAGE) break;
    from+=PAGE;
    if(from>500000) break; // trava de segurança
  }
  return all;
}
async function loadData(){
  try{
    const [u,e,c,ct] = await Promise.all([
      fetchAllRows("usuarios","id,nome,setor,ativo"),
      fetchAllRows("empresas","id,nome,apelido,cnpj,status"),
      fetchAllRows("contatos","id,nome,telefone,empresa_id"),
      fetchAllRows("contestacoes","*").catch(()=>[])
    ]);
    USERS={}; u.forEach(x=>USERS[x.id]={nome:x.nome,setor:x.setor,ativo:x.ativo});
    EMPRESAS={}; e.forEach(x=>EMPRESAS[x.id]={nome:x.nome,apelido:x.apelido,cnpj:x.cnpj,status:x.status});
    CONTATOS={}; c.forEach(x=>CONTATOS[x.id]={nome:x.nome,telefone:x.telefone,empresa_id:x.empresa_id});
    CONTESTS={}; (ct||[]).forEach(x=>CONTESTS[x.atendimento_id]=x);
  }catch(err){ console.warn("lookups:",err); }

  try{
    RAW = await fetchAllRows("analises","*","sessao_fim");
  }catch(error){
    document.getElementById("view").innerHTML=`<div class="empty" style="margin-top:40px">Erro ao carregar: ${esc(error.message||error)}</div>`; return;
  }
  ATEND = RAW.map(mapRow);
  render();
}

// ---------- HEALTH SCORE CLIENTES ----------
function reclamacoesEmpresa(empId){ let n=0; ATEND.forEach(a=>{ if(a.empresa_id===empId && CONTESTS[a.id]) n++; }); return n; }
function clienteScore(empId){
  const ag=empresaAgg(empId);
  const cn=ag.list.filter(a=>a.nota!==null);
  const ab=cn.filter(a=>a.nota<7).length, ac=cn.length-ab;
  const ratio=cn.length?ab/cn.length:0;
  const reclam=reclamacoesEmpresa(empId);
  let risco=ag.media!==null?(10-ag.media)/2:2.5;
  if(ag.churn) risco+=1.2;
  risco+=Math.min(1,ratio*2);
  risco+=Math.min(1,reclam*0.5);
  risco=Math.max(1,Math.min(5,risco));
  let status="saudavel";
  if(ag.churn||risco>=3.5||(ag.media!==null&&ag.media<6.5)) status="critico";
  else if(risco>=2.5||ratio>=0.25||reclam>0||(ag.media!==null&&ag.media<7.5)) status="alerta";
  return {...ag,ab,ac,ratio,reclam,risco:Math.round(risco*10)/10,status,notas:cn.length};
}

  critico:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'};

// ---------- ANÁLISE POR SETOR (ranking de equipes) ----------
function setorAgg(setor){
  const list=ATEND.filter(a=>a.setor===setor);
  const cn=list.filter(a=>a.nota!==null);
  const media=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null;
  const satVals=list.map(a=>a.s.v).filter(x=>x!==null&&!isNaN(x));
  const satisf=satVals.length?satVals.reduce((s,n)=>s+n,0)/satVals.length:null;
  const colabs=[...new Set(list.map(a=>a.atendente_id||a.atendente))];
  const empIds=[...new Set(list.map(a=>a.empresa_id).filter(Boolean))];
  let cr=0,al=0,sa=0; empIds.forEach(id=>{ const st=clienteScore(id).status; if(st==="critico")cr++;else if(st==="alerta")al++;else sa++; });
  return {setor,list,qtd:list.length,media,satisf,colabs,empIds,cr,al,sa};
}
function viewSetorAnalise(v){
  const setores=setoresList().filter(s=>s&&s!=="—");
  let teams=setores.map(setorAgg).filter(t=>t.qtd>0).sort((a,b)=>(b.satisf??-1)-(a.satisf??-1));

function empresaAgg(empId){
  const list=ATEND.filter(a=>a.empresa_id===empId);
  const cn=list.filter(a=>a.nota!==null);
  const media=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null;
  const sat={positivo:0,neutro:0,negativo:0};
  list.forEach(a=>{ if(a.satisfacao&&sat[a.satisfacao]!==undefined)sat[a.satisfacao]++; });
  const churn=list.some(a=>a.churn);
  const cols=[...new Set(list.map(a=>a.atendente))];
  let health="neutro";
  if(sat.negativo>0||churn||(media!==null&&media<6)) health="sensivel";
  else if(cn.length&&(media>=8)&&sat.negativo===0) health="fa";
  const tsl=list.map(a=>a.ts).filter(Boolean);
  const ultima=tsl.length?Math.max(...tsl):0, primeira=tsl.length?Math.min(...tsl):0;
  const durMin=list.reduce((s,a)=>s+(a.durMin||0),0);
  const satV=list.map(a=>a.s.v).filter(x=>x!==null&&!isNaN(x)); const satMedia=satV.length?satV.reduce((s,n)=>s+n,0)/satV.length:null;
  const aderV=list.map(a=>a.aderencia.v).filter(x=>x!==null&&!isNaN(x)); const aderMedia=aderV.length?aderV.reduce((s,n)=>s+n,0)/aderV.length:null;
  const servicos={}; list.forEach(a=>{ if(a.servico) servicos[a.servico]=(servicos[a.servico]||0)+1; });
  const desfechos={}; list.forEach(a=>{ if(a.desfecho) desfechos[a.desfecho]=(desfechos[a.desfecho]||0)+1; });
  const colMap=new Map(); list.forEach(a=>{ const k=a.atendente_id||a.atendente; if(!colMap.has(k))colMap.set(k,{key:k,nome:a.atendente,notas:[],n:0}); const g=colMap.get(k); g.n++; if(a.nota!==null)g.notas.push(a.nota); });
  const colabs=[...colMap.values()].map(g=>({key:g.key,nome:g.nome,n:g.n,media:g.notas.length?g.notas.reduce((s,n)=>s+n,0)/g.notas.length:null})).sort((a,b)=>b.n-a.n);
  const notasBaixas=cn.filter(a=>a.nota<7).length, notasAltas=cn.length-notasBaixas;
  const erros={}; list.forEach(a=>a.erros.forEach(e=>erros[e]=(erros[e]||0)+1));
  const melhorias={}; list.forEach(a=>a.melhorias.forEach(m=>melhorias[m]=(melhorias[m]||0)+1));
  const oports=list.filter(a=>a.oport).map(a=>a.oport);
  return {list,media,count:list.length,sat,churn,cols,health,ultima,primeira,durMin,satMedia,aderMedia,servicos,desfechos,colabs,notasBaixas,notasAltas,erros,melhorias,oports};
}

// ---------- EVOLUÇÃO SETOR (grade semanal) ----------
let SFIL={ano:null,mes:null,sel:null,sort:"pct_desc"};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESCURTO=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function mesesComDados(){ const s=new Set(); ATEND.forEach(a=>{ if(!a.ts)return; const d=new Date(a.ts); s.add(d.getFullYear()+"|"+d.getMonth()); });
  return [...s].map(k=>{const[y,m]=k.split("|").map(Number);return{ano:y,mes:m};}).sort((a,b)=>a.ano-b.ano||a.mes-b.mes); }
function semanasDoMes(ano,mes){ const last=new Date(ano,mes+1,0).getDate(); const buckets=new Map();
  for(let d=1;d<=last;d++){ const dt=new Date(ano,mes,d); const dow=(dt.getDay()+6)%7; const monday=new Date(ano,mes,d-dow).getTime();
    if(!buckets.has(monday))buckets.set(monday,[]); buckets.get(monday).push(d); }
  return [...buckets.entries()].sort((a,b)=>a[0]-b[0]).map(([k,dias],i)=>{ const di=dias[0],df=dias[dias.length-1];
    return {n:i+1,ini:new Date(ano,mes,di,0,0,0).getTime(),fim:new Date(ano,mes,df,23,59,59).getTime(),
      label:`${String(di).padStart(2,"0")}–${String(df).padStart(2,"0")}/${String(mes+1).padStart(2,"0")}`}; });
}
function aggList(list){ const cn=list.filter(a=>a.nota!==null); const q=cn.length;
  const media=q?cn.reduce((s,a)=>s+a.nota,0)/q:null; const ac=cn.filter(a=>a.nota>=7).length;
  return {n:list.length,q,media,ac,pctAc:q?ac/q*100:null,pctAb:q?(q-ac)/q*100:null}; }
function atendRange(ini,fim){ return ATEND.filter(a=>a.ts>=ini&&a.ts<=fim); }
function celClass(m){ return m===null?"n":(m>=8.5?"g9":(m>=7?"g":(m>=6?"a":"r"))); }
function celHTML(ag,extra){ if(!ag||!ag.n) return `<div class="gcell n ${extra||''}"><span class="sub">—</span></div>`;
  return `<div class="gcell ${celClass(ag.media)} ${extra||''}"><div class="celm num">${fmt1(ag.media)}</div><div class="cela num">${ag.n} atend.</div><div class="celp">${ag.pctAc===null?"":Math.round(ag.pctAc)+"% acima"}</div></div>`; }
function nivelHTML(list){ const c={baixa:0,media:0,alta:0,sem:0}; list.forEach(a=>{ if(a.complexidade&&c[a.complexidade]!==undefined)c[a.complexidade]++; else c.sem++; });
  const tot=list.length||1; const seg=(n,col)=>`<span style="width:${n/tot*100}%;background:${col}"></span>`;
  return `<div class="nivbar">${seg(c.baixa,"var(--good)")}${seg(c.media,"var(--warn)")}${seg(c.alta,"var(--crit)")}${seg(c.sem,"var(--border-strong)")}</div>
    <div class="nivleg"><span>${c.baixa} N1</span><span>${c.media} N2</span><span>${c.alta} N3</span>${c.sem?`<span>${c.sem} s/cl</span>`:""}</div>`; }

function viewSetor(v){
  const meses=mesesComDados();
  if(SFIL.ano===null){ const ult=meses[meses.length-1]||{ano:new Date().getFullYear(),mes:new Date().getMonth()}; SFIL.ano=ult.ano; SFIL.mes=ult.mes; }
  const ano=SFIL.ano, mes=SFIL.mes;
  const mIni=new Date(ano,mes,1).getTime(), mFim=new Date(ano,mes+1,0,23,59,59).getTime();
  const pAno=mes===0?ano-1:ano, pMes=mes===0?11:mes-1;
  const pIni=new Date(pAno,pMes,1).getTime(), pFim=new Date(pAno,pMes+1,0,23,59,59).getTime();
  const yIni=new Date(ano,0,1).getTime();
  const semanas=semanasDoMes(ano,mes);
  const setores=[...new Set(ATEND.filter(a=>a.ts>=mIni&&a.ts<=mFim).map(a=>a.setor||"—"))];
  // agrega por setor
  let rows=setores.map(setor=>{ const inSetor=t=>t.filter(a=>(a.setor||"—")===setor);
    const mesList=inSetor(atendRange(mIni,mFim));
    const prevList=inSetor(atendRange(pIni,pFim));
    const sem=semanas.map(s=>({...s,ag:aggList(inSetor(atendRange(s.ini,s.fim))),list:inSetor(atendRange(s.ini,s.fim))}));
    return {setor,mesList,mesAg:aggList(mesList),prevAg:aggList(prevList),sem}; })
    .filter(r=>r.mesAg.n>0);
  const srt=SFIL.sort;
  rows.sort((a,b)=> srt==="nome"?a.setor.localeCompare(b.setor)
    : srt==="media_desc"?((b.mesAg.media??-1)-(a.mesAg.media??-1))
    : srt==="qtd_desc"?(b.mesAg.n-a.mesAg.n)
    : ((b.mesAg.pctAc??-1)-(a.mesAg.pctAc??-1)) );
  // kpis do mês e do ano
  const mesAll=aggList(atendRange(mIni,mFim)), yearAll=aggList(atendRange(yIni,mFim));
  const barHTML=ag=>{ const ac=ag.pctAc??0,ab=ag.pctAb??0; return `<div class="bar"><span style="width:${ac}%;background:var(--good)"></span><span style="width:${ab}%;background:var(--crit)"></span></div>
    <div class="barleg"><span><span class="dot" style="background:var(--good)"></span>${Math.round(ac)}% acima de 7</span><span><span class="dot" style="background:var(--crit)"></span>${Math.round(ab)}% abaixo de 7</span></div>`; };
  // navegação de mês
  const idx=meses.findIndex(x=>x.ano===ano&&x.mes===mes);
  const anosDisp=[...new Set(meses.map(x=>x.ano))];
  v.innerHTML=`
  <div class="page-head"><h2>Evolução por Setor</h2><p>desempenho semanal por setor, ordenado por % de notas ≥ 7</p></div>
  <div class="mesnav">
    <button class="navb" id="mPrev" ${idx<=0?"disabled":""}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <select class="fsel" id="mSel">${MESES.map((m,i)=>`<option value="${i}" ${i===mes?"selected":""}>${m}</option>`).join("")}</select>
    <select class="fsel" id="aSel" style="max-width:110px">${anosDisp.map(y=>`<option value="${y}" ${y===ano?"selected":""}>${y}</option>`).join("")}</select>
    <button class="navb" id="mNext" ${idx>=meses.length-1?"disabled":""}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="hoje" id="mHoje">Mês atual</button>
    <select class="fsel" id="sSort" style="margin-left:auto">
      <option value="pct_desc" ${srt==="pct_desc"?"selected":""}>Ordenar: maior % ≥ 7</option>
      <option value="media_desc" ${srt==="media_desc"?"selected":""}>Ordenar: maior média</option>
      <option value="qtd_desc" ${srt==="qtd_desc"?"selected":""}>Ordenar: mais atendimentos</option>
      <option value="nome" ${srt==="nome"?"selected":""}>Ordenar: setor (A-Z)</option>
    </select>
  </div>
  <section><div class="kpi-big">
    <div class="box"><div class="cap">${MESES[mes]} ${ano}</div><div class="big num" style="color:${scoreColor(mesAll.media)}">${fmt1(mesAll.media)}</div><div class="sub2 num">${mesAll.n} atendimento(s)</div>${barHTML(mesAll)}</div>
    <div class="box"><div class="cap">Acumulado ${ano} (jan–${MESCURTO[mes].toLowerCase()})</div><div class="big num" style="color:${scoreColor(yearAll.media)}">${fmt1(yearAll.media)}</div><div class="sub2 num">${yearAll.n} atendimento(s)</div>${barHTML(yearAll)}</div>
  </div></section>
  <div class="notice" style="margin-top:16px;background:var(--surface-2);color:var(--ink-2);border-color:var(--border)">Semanas de segunda a domingo. Clique numa semana ou na coluna do mês, em qualquer setor, para ver o top 3 de colaboradores e clientes daquele período, com os apontamentos e sugestões.</div>
  <section><div class="card grid-setor"><table><thead><tr>
    <th class="setor-c">Setor</th>
    ${semanas.map(s=>`<th class="center">SEM ${s.n}<div class="sub" style="font-weight:400">${s.label}</div></th>`).join("")}
    <th class="center">${MESCURTO[mes]}<div class="sub" style="font-weight:400">mês</div></th>
    <th class="center">Nível</th>
    <th class="center">${MESCURTO[pMes]}<div class="sub" style="font-weight:400">mês ant.</div></th>
  </tr></thead><tbody>${
    rows.length?rows.map(r=>`<tr>
      <td class="setor-c">${esc(r.setor)}<div class="sub" style="font-weight:400">${r.mesAg.n} atend. no mês</div></td>
      ${r.sem.map((s,i)=>{ const isSel=SFIL.sel&&SFIL.sel.setor===r.setor&&SFIL.sel.tipo==="sem"&&SFIL.sel.i===i;

  }</tbody></table></div>
  <div class="sub" style="margin-top:8px">Nível: N1 baixa complexidade, N2 média, N3 alta, s/cl sem classificação.</div>
  </section>
  <div id="drill"></div>`;
  // navegação
  const goto=(i)=>{ if(i<0||i>=meses.length)return; SFIL.ano=meses[i].ano; SFIL.mes=meses[i].mes; SFIL.sel=null; viewSetor(v); };

  v.querySelector("#aSel").onchange=e=>{ SFIL.ano=+e.target.value; SFIL.sel=null; viewSetor(v); };
  v.querySelector("#sSort").onchange=e=>{ SFIL.sort=e.target.value; viewSetor(v); };
  v.querySelectorAll("[data-sel]").forEach(td=>td.onclick=()=>{ const[setor,tipo,i]=td.dataset.sel.split("|"); SFIL.sel={setor,tipo,i:+i}; renderDrill(v); });
  if(SFIL.sel) renderDrill(v);
}
function renderDrill(v){
  const d=v.querySelector("#drill"); if(!d)return; const sel=SFIL.sel;
  const ano=SFIL.ano,mes=SFIL.mes;
  let ini,fim,titulo;
  if(sel.tipo==="mes"){ ini=new Date(ano,mes,1).getTime(); fim=new Date(ano,mes+1,0,23,59,59).getTime(); titulo=`${MESES[mes]} ${ano}`; }
  else { const s=semanasDoMes(ano,mes)[sel.i]; ini=s.ini; fim=s.fim; titulo=`Semana ${s.n} · ${s.label}`; }
  const list=ATEND.filter(a=>(a.setor||"—")===sel.setor && a.ts>=ini && a.ts<=fim);
  const baixas=list.filter(a=>a.nota!==null&&a.nota<7);
  const totAb=baixas.length||1;
  // top colaboradores por impacto em notas < 7
  const mc=new Map(); list.forEach(a=>{ const k=a.atendente_id||a.atendente; if(!mc.has(k))mc.set(k,{key:k,nome:a.atendente,list:[]}); mc.get(k).list.push(a); });
  const cols=[...mc.values()].map(g=>{ const cn=g.list.filter(a=>a.nota!==null); const m=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null; const ab=cn.filter(a=>a.nota<7).length;
    return {key:g.key,nome:g.nome,total:g.list.length,media:m,ab,contrib:ab/totAb*100}; }).filter(c=>c.ab>0).sort((a,b)=>b.ab-a.ab).slice(0,3);
  // top clientes por menor média
  const me=new Map(); list.forEach(a=>{ if(!a.empresa_id)return; if(!me.has(a.empresa_id))me.set(a.empresa_id,[]); me.get(a.empresa_id).push(a); });
  const clis=[...me.entries()].map(([id,l])=>{ const cn=l.filter(a=>a.nota!==null); const m=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null; const ab=cn.filter(a=>a.nota<7).length;
    return {nome:(EMPRESAS[id]&&(EMPRESAS[id].apelido||EMPRESAS[id].nome))||"—",total:l.length,media:m,ab}; }).filter(c=>c.media!==null).sort((a,b)=>a.media-b.media).slice(0,3);
  // apontamentos (erros) e sugestões (melhorias)
  const cErr=new Map(); list.forEach(a=>a.erros.forEach(e=>cErr.set(e,(cErr.get(e)||0)+1)));
  const topErr=[...cErr.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
  const cMel=new Map(); list.forEach(a=>a.melhorias.forEach(m=>cMel.set(m,(cMel.get(m)||0)+1)));
  const topMel=[...cMel.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
  const ag=aggList(list);
  d.innerHTML=`
  <section><div class="sec-head"><h2>${esc(sel.setor)} · ${titulo}</h2><span class="hint">${ag.n} atendimento(s) · média ${fmt1(ag.media)} · ${baixas.length} nota(s) &lt; 7</span></div>
  <div class="drill">
    <div class="card"><div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:Sora;font-weight:600;font-size:13px">Top 3 colaboradores · maior impacto em notas &lt; 7</div>
      <table><thead><tr><th>Colaborador</th><th class="center">Total</th><th class="center">Média</th><th class="center">Notas &lt; 7</th><th class="center">Contrib.</th></tr></thead><tbody>${
        cols.length?cols.map(c=>`<tr><td class="r-name"><button class="link-name" data-col="${escAttr(String(c.key))}">${esc(c.nome)}</button></td><td class="center num">${c.total}</td><td class="center"><span class="nota ${notaClass(c.media)} num" style="min-width:auto;padding:2px 8px">${fmt1(c.media)}</span></td><td class="center num" style="color:var(--crit);font-weight:600">${c.ab}</td><td class="center num">${Math.round(c.contrib)}%</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Nenhuma nota abaixo de 7 no período. Ótimo sinal.</td></tr>`
      }</tbody></table></div>
    <div class="card"><div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:Sora;font-weight:600;font-size:13px">Top 3 clientes · notas mais baixas</div>
      <table><thead><tr><th>Cliente</th><th class="center">Total</th><th class="center">Média</th><th class="center">Notas &lt; 7</th></tr></thead><tbody>${
        clis.length?clis.map(c=>`<tr><td class="r-name">${esc(c.nome)}</td><td class="center num">${c.total}</td><td class="center"><span class="nota ${notaClass(c.media)} num" style="min-width:auto;padding:2px 8px">${fmt1(c.media)}</span></td><td class="center num">${c.ab?`<span style="color:var(--crit);font-weight:600">${c.ab}</span>`:'<span class="sub">0</span>'}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Sem clientes vinculados no período.</td></tr>`
      }</tbody></table></div>
  </div>
  <div class="drill">
    <div class="card" style="padding:16px 18px"><div style="font-family:Sora;font-weight:600;font-size:13px;margin-bottom:10px">Apontamentos do período</div>${
      topErr.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${topErr.map(([e,n])=>`<span class="chip err">${esc(e)}${n>1?` <span class="sub">×${n}</span>`:""}</span>`).join("")}</div>`:'<div class="sub">Nenhum erro apontado no período.</div>'
    }</div>
    <div class="card" style="padding:16px 18px"><div style="font-family:Sora;font-weight:600;font-size:13px;margin-bottom:10px">Sugestões de melhoria</div>${
      topMel.length?`<ul class="melhorias">${topMel.map(([m,n])=>`<li>${esc(m)}${n>1?` <span class="sub">(${n}×)</span>`:""}</li>`).join("")}</ul>`:'<div class="sub">Sem sugestões registradas no período.</div>'
    }</div>
  </div></section>`;
  d.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>openColaborador(b.dataset.col));
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function transcriptHTML(t,nomeAt,nomeCl){ if(!t) return '<div class="sub">Sem transcrição.</div>';

    if(!m) return `<div class="msg cl">${esc(l)}</div>`;
    const who=m[2]==="ATENDENTE"?"at":"cl"; const when=m[1]?`<span class="when">${esc(m[1])}</span>`:"";
    const nome=m[2]==="ATENDENTE"?(nomeAt||"Atendente"):(nomeCl&&nomeCl!=="—"?nomeCl:"Cliente");
    return `<div class="msg ${who}"><span class="who">${esc(nome)}${when}</span>${esc(m[3])}</div>`; }).join("");
}

function colaboradorReport(key){
  const list=ATEND.filter(a=>(a.atendente_id||a.atendente)===key);
  if(!list.length) return null;
  const nome=list[0].atendente, setor=list[0].setor;
  const ms=[...new Set(list.map(a=>{const d=new Date(a.ts);return d.getFullYear()+"|"+d.getMonth();}))].map(k=>{const[y,m]=k.split("|").map(Number);return{ano:y,mes:m};}).sort((a,b)=>a.ano-b.ano||a.mes-b.mes);
  const per=ms[ms.length-1]||{ano:new Date().getFullYear(),mes:new Date().getMonth()};
  const mIni=new Date(per.ano,per.mes,1).getTime(), mFim=new Date(per.ano,per.mes+1,0,23,59,59).getTime();
  const mesList=list.filter(a=>a.ts>=mIni&&a.ts<=mFim);
  const semanas=semanasDoMes(per.ano,per.mes).map(s=>{ const wl=mesList.filter(a=>a.ts>=s.ini&&a.ts<=s.fim); return {...s,list:wl,ag:aggList(wl)}; }).filter(s=>s.ag.n>0);
  semanas.forEach((s,i)=>{ if(i===0){s.trend="flat";} else { const prev=semanas[i-1].ag.media, cur=s.ag.media; s.trend=(prev===null||cur===null)?"flat":(cur>prev+0.1?"up":(cur<prev-0.1?"down":"flat")); } });
  const comData=semanas.filter(s=>s.ag.media!==null);
  let evol=null;
  if(comData.length>=2){ const a0=comData[0].ag.media, a1=comData[comData.length-1].ag.media; const delta=a1-a0;
    evol={de:a0,para:a1,delta,pct:a0?delta/a0*100:0,dir:delta>0.05?"up":(delta<-0.05?"down":"flat")}; }
  const st=aggList(mesList);
  const teamList=ATEND.filter(a=>(a.setor||"—")===setor && a.ts>=mIni && a.ts<=mFim);
  const teamAg=aggList(teamList);
  const teamColabs=new Set(teamList.map(a=>a.atendente_id||a.atendente)).size;
  const partic=teamAg.n?st.n/teamAg.n*100:0;
  const difMedia=(st.media!==null&&teamAg.media!==null)?st.media-teamAg.media:null;
  const difPct=(st.pctAc!==null&&teamAg.pctAc!==null)?st.pctAc-teamAg.pctAc:null;
  const rM=avg(mesList.map(a=>a.r.v)), raM=avg(mesList.map(a=>a.ra.v)), sM=avg(mesList.map(a=>a.s.v)), adM=avg(mesList.map(a=>a.aderencia.v));
  const forcas=[];
  if(rM!==null&&rM>=8.5) forcas.push(`Excelência na resolução, com média ${fmt1(rM)} nesse eixo.`);
  if(raM!==null&&raM>=8.5) forcas.push(`Respostas rápidas e dentro do prazo, média ${fmt1(raM)} em rapidez.`);
  if(sM!==null&&sM>=8.5) forcas.push(`Clientes satisfeitos ao final, média ${fmt1(sM)} em satisfação.`);
  if(adM!==null&&adM>=8) forcas.push(`Forte aderência ao jeito Resilcon de atender, média ${fmt1(adM)}.`);
  if(st.pctAc!==null&&st.pctAc>=85) forcas.push(`Consistência: ${Math.round(st.pctAc)}% das notas ficaram acima de 7.`);
  if(!forcas.length){ const eixos=[["resolução",rM],["rapidez",raM],["satisfação",sM]].filter(e=>e[1]!==null).sort((a,b)=>b[1]-a[1]);
    if(eixos[0]) forcas.push(`Melhor desempenho em ${eixos[0][0]}, média ${fmt1(eixos[0][1])}.`); else forcas.push("Sem destaque de desempenho no período."); }
  const melMap=new Map(); mesList.forEach(a=>a.melhorias.forEach(m=>{ if(!melMap.has(m))melMap.set(m,a.ticket_id); }));
  const melhorias=[...melMap.entries()].slice(0,4).map(([m,tk])=>({texto:m,ticket:tk}));
  const baixas=mesList.filter(a=>a.nota!==null&&a.nota<7).sort((a,b)=>a.nota-b.nota).slice(0,3)
    .map(a=>({cliente:a.cliente,motivo:(a.erros[0]||a.melhorias[0]||a.assunto||"atendimento abaixo do esperado"),ticket:a.ticket_id,nota:a.nota}));
  const errMap=new Map(); mesList.forEach(a=>a.erros.forEach(e=>errMap.set(e,(errMap.get(e)||0)+1)));
  const topErr=[...errMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  const analise=`${nome} teve média ${fmt1(st.media)} em ${st.n} atendimento(s), com ${st.pctAc===null?"—":Math.round(st.pctAc)+"%"} das avaliações acima de 7.${(st.pctAb&&st.pctAb>0)?` ${Math.round(st.pctAb)}% ficaram abaixo de 7${topErr.length?", com atenção em "+topErr.join(" e "):""}.`:""}`;
  const plano=[]; melhorias.slice(0,3).forEach(m=>plano.push(m.texto));
  if(evol&&evol.dir==="down") plano.push("Acompanhar de perto a queda entre as semanas e retomar o padrão das primeiras.");
  if(!plano.length) plano.push("Manter o padrão de atendimento e acompanhar os indicadores semana a semana.");
  return {key,nome,setor,per,mIni,mFim,mesList,semanas,evol,st,teamAg,teamColabs,partic,difMedia,difPct,rM,raM,sM,adM,forcas,melhorias,baixas,analise,plano};
}

        <div class="tile"><div><div class="lbl">Notas ≥ 7</div><div class="val num" style="color:var(--good)">${R.st.ac} <small>${R.st.pctAc===null?"":Math.round(R.st.pctAc)+"%"}</small></div></div></div>
      </div></div>
      <div class="panel"><h4>Comparativo com a equipe (${esc(R.setor)})</h4><div class="grid2" style="grid-template-columns:repeat(3,1fr)">
        ${cmp("Atendimentos",R.st.n,R.teamAg.n,null)}
        ${cmp("Média de nota",fmt1(R.st.media),fmt1(R.teamAg.media),R.difMedia==null?null:(R.difMedia).toFixed(2).replace(".",","))}
        ${cmp("Notas ≥ 7 (%)",(R.st.pctAc===null?"—":Math.round(R.st.pctAc)+"%"),(R.teamAg.pctAc===null?"—":Math.round(R.teamAg.pctAc)+"%"),R.difPct==null?null:Math.round(R.difPct)+" pts")}
      </div><div class="sub" style="margin-top:8px">Equipe composta por ${R.teamColabs} colaborador(es) · sua participação: ${R.partic.toFixed(1).replace(".",",")}%</div>
      ${(R.difMedia!=null&&R.difMedia<0)?`<div class="notice" style="margin-top:10px;background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)">Oportunidade de desenvolvimento: está ${Math.abs(R.difMedia).toFixed(2).replace(".",",")} pontos abaixo da média da equipe.</div>`:(R.difMedia!=null?`<div class="notice" style="margin-top:10px;background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent);color:var(--good)">Acima da média da equipe em ${R.difMedia.toFixed(2).replace(".",",")} pontos.</div>`:"")}</div>
      <div class="panel"><h4>Principais forças</h4><ul class="melhorias">${R.forcas.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
      ${R.melhorias.length?`<div class="panel"><h4>Pontos de melhoria</h4><ul class="melhorias">${R.melhorias.map(m=>`<li>${esc(m.texto)}${m.ticket?` <span class="sub">(#${esc(m.ticket)})</span>`:""}</li>`).join("")}</ul></div>`:""}
      <div class="panel"><h4>Análise de performance</h4><div class="prose">${esc(R.analise)}</div></div>
      ${R.baixas.length?`<div class="panel"><h4>Clientes mais afetados</h4><div class="mini-list">${R.baixas.map(b=>`<div class="mini-row"><div class="mr-l"><div class="t">${esc(b.cliente)}</div><div class="s">${esc(b.motivo)}${b.ticket?` · #${esc(b.ticket)}`:""}</div></div><span class="nota ${notaClass(b.nota)} num" style="min-width:auto;padding:2px 8px">${fmt1(b.nota)}</span></div>`).join("")}</div></div>`:""}
      <div class="panel"><h4>Plano de ação</h4><ul class="melhorias">${R.plano.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
      <div class="panel"><h4>Atendimentos do período (${list.length})</h4><div class="mini-list">${list.map(a=>{ const i=ATEND.indexOf(a);
        return `<div class="mini-row"><div class="mr-l"><div class="t">${esc(a.assunto)}</div><div class="s">${a.data} · ${esc(a.cliente)}</div></div><button class="view-btn" data-eval2="${i}"><span class="nota ${notaClass(a.nota)} num" style="min-width:auto;padding:2px 8px">${fmt1(a.nota)}</span></button></div>`;
      }).join("")}</div></div>
    </div>`);
  modal.querySelectorAll("[data-eval2]").forEach(b=>b.onclick=()=>openAvaliacao(+b.dataset.eval2));
  const cb=modal.querySelector("[data-colpdf]"); if(cb) cb.onclick=()=>baixarColaboradorPDF(key,cb);
}
function baixarColaboradorPDF(key,btn){
  const R=colaboradorReport(key); if(!R)return;
  if(typeof html2pdf==="undefined"){ alert("Gerador de PDF ainda carregando. Tente de novo em instantes."); return; }
  if(btn){ btn.disabled=true; btn.style.opacity=".5"; }
  const H="#1a1b28",M="#83879c",B="#e7e9f2",AC="#6d3bd6",GD="#128a5b",WN="#b7791f",CR="#cf4257";
  const cor=n=>n===null?M:(n>=8?GD:(n>=6?WN:CR));
  const perLbl=`${new Date(R.mIni).toLocaleDateString("pt-BR")} a ${new Date(R.mFim).toLocaleDateString("pt-BR")}`;
  const box=(t,c)=>`<div style="border:1px solid ${B};border-radius:10px;padding:12px 14px;margin-top:10px"><div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:${AC};margin-bottom:8px">${esc(t)}</div>${c}</div>`;
  const lista=arr=>`<ul style="margin:0;padding-left:16px;font-size:12.5px;color:#4a4d63;line-height:1.6">${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  const semTable=`<table style="width:100%;font-size:11.5px;border-collapse:collapse"><tr style="color:${M}"><td>Semana</td><td>Período</td><td style="text-align:center">Qtd</td><td style="text-align:center">Média</td><td style="text-align:center">&lt;7</td><td style="text-align:center">≥7</td></tr>${R.semanas.map(s=>`<tr><td style="padding:2px 0">SEM ${s.n}</td><td>${s.label}</td><td style="text-align:center">${s.ag.n}</td><td style="text-align:center;color:${cor(s.ag.media)};font-weight:600">${fmt1(s.ag.media)}</td><td style="text-align:center;color:${CR}">${s.ag.q-s.ag.ac}</td><td style="text-align:center;color:${GD}">${s.ag.ac}</td></tr>`).join("")}</table>`;
  const evolTxt=R.evol?`<div style="font-size:12.5px;color:${R.evol.dir==='down'?CR:(R.evol.dir==='up'?GD:H)}"><strong>${R.evol.dir==='down'?'Piorou':(R.evol.dir==='up'?'Melhorou':'Estável')} ${Math.abs(R.evol.pct).toFixed(1)}%</strong> entre a primeira e a última semana. Média ${fmt1(R.evol.de)} → ${fmt1(R.evol.para)}.</div>`:'';
  const html=`<div style="font-family:'IBM Plex Sans',Arial,sans-serif;color:${H};padding:26px 28px;width:720px;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid ${AC};padding-bottom:14px;margin-bottom:14px">
      <div><div style="font-size:11px;color:${M};font-weight:600">RESILTRACK · Relatório individual</div>
      <div style="font-size:20px;font-weight:700;margin-top:4px">${esc(R.nome)}</div>
      <div style="font-size:12px;color:${M};margin-top:4px">${esc(R.setor)} · ${perLbl} · gerado em ${new Date().toLocaleDateString("pt-BR")}</div></div>
      <div style="text-align:center;min-width:80px"><div style="font-size:34px;font-weight:700;line-height:1;color:${cor(R.st.media)}">${fmt1(R.st.media)}</div><div style="font-size:11px;color:${M}">média /10</div></div>
    </div>
    ${box("Evolução semanal",evolTxt+semTable)}
    ${box("Estatísticas do período",`<table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr><td style="color:${M}">Total</td><td style="font-weight:600">${R.st.n}</td><td style="color:${M}">Média</td><td style="font-weight:600;color:${cor(R.st.media)}">${fmt1(R.st.media)}</td></tr><tr><td style="color:${M}">Notas abaixo de 7</td><td style="font-weight:600;color:${CR}">${R.st.q-R.st.ac} (${R.st.pctAb===null?"—":Math.round(R.st.pctAb)+"%"})</td><td style="color:${M}">Notas 7 ou mais</td><td style="font-weight:600;color:${GD}">${R.st.ac} (${R.st.pctAc===null?"—":Math.round(R.st.pctAc)+"%"})</td></tr></table>`)}
    ${box("Comparativo com a equipe ("+esc(R.setor)+")",`<table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr style="color:${M}"><td></td><td style="text-align:center">Você</td><td style="text-align:center">Equipe</td><td style="text-align:center">Diferença</td></tr>
      <tr><td>Atendimentos</td><td style="text-align:center">${R.st.n}</td><td style="text-align:center">${R.teamAg.n}</td><td style="text-align:center">${R.partic.toFixed(1).replace(".",",")}%</td></tr>
      <tr><td>Média de nota</td><td style="text-align:center">${fmt1(R.st.media)}</td><td style="text-align:center">${fmt1(R.teamAg.media)}</td><td style="text-align:center;color:${R.difMedia>=0?GD:CR}">${R.difMedia==null?"—":(R.difMedia>=0?"+":"")+R.difMedia.toFixed(2).replace(".",",")}</td></tr>
      <tr><td>Notas ≥ 7 (%)</td><td style="text-align:center">${R.st.pctAc===null?"—":Math.round(R.st.pctAc)+"%"}</td><td style="text-align:center">${R.teamAg.pctAc===null?"—":Math.round(R.teamAg.pctAc)+"%"}</td><td style="text-align:center;color:${R.difPct>=0?GD:CR}">${R.difPct==null?"—":(R.difPct>=0?"+":"")+Math.round(R.difPct)+" pts"}</td></tr></table>
      <div style="font-size:11.5px;color:${M};margin-top:6px">Equipe composta por ${R.teamColabs} colaborador(es).</div>`)}
    ${box("Principais forças",lista(R.forcas.map(esc)))}
    ${R.melhorias.length?box("Pontos de melhoria",lista(R.melhorias.map(m=>esc(m.texto)+(m.ticket?` (#${esc(m.ticket)})`:"")))):""}
    ${box("Análise de performance",`<div style="font-size:12.5px;color:#4a4d63;line-height:1.6">${esc(R.analise)}</div>`)}
    ${R.baixas.length?box("Clientes mais afetados",lista(R.baixas.map(b=>esc(b.cliente)+" — "+esc(b.motivo)+(b.ticket?` (#${esc(b.ticket)})`:"")))):""}
    ${box("Plano de ação",lista(R.plano.map(esc)))}
    <div style="margin-top:16px;font-size:10.5px;color:${M};text-align:center;border-top:1px solid ${B};padding-top:10px">Gerado pela Resiltrack · ${new Date().toLocaleString("pt-BR")}</div>
  </div>`;
  const cont=document.createElement("div"); cont.innerHTML=html; document.body.appendChild(cont);
  const nomeArq=("relatorio_"+(R.nome||"colaborador")).replace(/[^\p{L}\p{N}]+/gu,"_").replace(/_+/g,"_").replace(/^_|_$/g,"").toLowerCase()+".pdf";
  html2pdf().set({margin:[8,8,8,8],filename:nomeArq,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}})
    .from(cont.firstElementChild).save().then(()=>{ cont.remove(); if(btn){ btn.disabled=false; btn.style.opacity="1"; } })
    .catch(()=>{ cont.remove(); if(btn){ btn.disabled=false; btn.style.opacity="1"; } alert("Não consegui gerar o PDF agora. Tente de novo."); });
}
function avg(arr){ const v=arr.filter(x=>x!==null&&!isNaN(x)); return v.length?v.reduce((s,n)=>s+n,0)/v.length:null; }

// ---- vincular contato -> empresa (grava no supabase) ----
function openVincular(contactId){
  const c=CONTATOS[contactId]||{};
  const opts=Object.entries(EMPRESAS).map(([id,e])=>({id,nome:e.apelido||e.nome,cnpj:e.cnpj}))
    .sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
  openModal(`
    <div class="modal-head"><div class="mh-l"><div class="m-sub num">${esc(c.telefone||"")}</div><h3>Vincular ${esc(c.nome||contactId)}</h3><div class="m-chips"><span class="m-chip">contato do WhatsApp → empresa</span></div></div>
      <button class="close-x" data-close><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body">
      <div class="panel"><h4>Escolha a empresa (CNPJ)</h4>
        <input id="empSearch" class="inp" style="width:100%;padding-left:12px;margin-bottom:8px" placeholder="Buscar empresa ou CNPJ...">
        <select id="empSel" class="inp" size="8" style="width:100%;max-width:none">${opts.map(o=>`<option value="${o.id}">${esc(o.nome)} — ${esc(fmtCnpj(o.cnpj))}</option>`).join("")}</select>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-line" data-close>Cancelar</button><button class="btn-primary" id="salvarVinc">Vincular</button></div>
      <div class="sub" id="vincMsg" style="text-align:right"></div>
    </div>`);
  const sel=modal.querySelector("#empSel"), search=modal.querySelector("#empSearch");
  search.oninput=()=>{ const f=search.value.trim().toLowerCase();
    [...sel.options].forEach(o=>{ o.hidden=f&&!o.text.toLowerCase().includes(f); }); };
  modal.querySelector("#salvarVinc").onclick=async()=>{
    const empId=sel.value; if(!empId){ modal.querySelector("#vincMsg").textContent="Selecione uma empresa."; return; }
    const btn=modal.querySelector("#salvarVinc"); btn.disabled=true; btn.textContent="Salvando...";
    const { error } = await sb.schema("atendimentos").from("contatos").update({empresa_id:empId}).eq("id",contactId);
    if(error){ modal.querySelector("#vincMsg").textContent="Erro: "+error.message; btn.disabled=false; btn.textContent="Vincular"; return; }
    CONTATOS[contactId].empresa_id=empId; ATEND=RAW.map(mapRow); closeModal(); render();
  };
}

// ---- contestar avaliação (grava no supabase) ----
let contestMotivo=null;
function openContestar(i){
  const a=ATEND[i]; contestMotivo=null;
  openModal(`
    <div class="modal-head"><div class="mh-l"><div class="m-sub num">${a.data} · ${esc(a.cliente)}</div><h3>Contestar avaliação</h3><div class="m-chips"><span class="m-chip">${esc(a.assunto)}</span><span class="m-chip">Nota ${fmt1(a.nota)}</span></div></div>
      <button class="close-x" data-close><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body">
      <div class="panel"><h4>Motivo da contestação</h4><div class="opt-grid">
        <div class="opt" data-m="erro_cliente"><div class="ot">O erro foi do cliente</div><div class="os">O cliente causou o problema apontado</div></div>
        <div class="opt" data-m="ia_errou"><div class="ot">A IA avaliou errado</div><div class="os">A análise não condiz com o atendimento</div></div>
      </div></div>
      <div class="panel"><h4>Explicação</h4><textarea class="inp" id="ctText" placeholder="Explique o que aconteceu e por que a nota deve ser revista..."></textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-line" data-close>Cancelar</button><button class="btn-primary" id="ctSend">Enviar contestação</button></div>
      <div class="sub" id="ctMsg" style="text-align:right"></div>
    </div>`);
  modal.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ modal.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); contestMotivo=o.dataset.m; });
  modal.querySelector("#ctSend").onclick=async()=>{
    const texto=modal.querySelector("#ctText").value.trim();
    if(!contestMotivo){ modal.querySelector("#ctMsg").textContent="Escolha o motivo."; return; }
    if(!texto){ modal.querySelector("#ctMsg").textContent="Escreva a explicação."; return; }
    const btn=modal.querySelector("#ctSend"); btn.disabled=true; btn.textContent="Enviando...";
    const row={ atendimento_id:a.id, ticket_id:a.ticket_id, atendente_id:a.atendente_id, motivo:contestMotivo, texto, status:"pendente", criado_por:ME };
    const { data, error } = await sb.schema("atendimentos").from("contestacoes").insert(row).select();
    if(error){ modal.querySelector("#ctMsg").textContent="Erro: "+error.message; btn.disabled=false; btn.textContent="Enviar contestação"; return; }
    CONTESTS[a.id]=(data&&data[0])||row; closeModal(); render();
  };
}

// ---------- auth ----------
function showApp(session){ document.getElementById("login").classList.add("hidden"); document.getElementById("app").classList.remove("hidden");
  ME=session?.user?.email||""; document.getElementById("userChip").textContent=ME; loadData(); }
function showLogin(){ document.getElementById("app").classList.add("hidden"); document.getElementById("login").classList.remove("hidden"); }
document.getElementById("loginForm").addEventListener("submit",async e=>{ e.preventDefault();
  const btn=document.getElementById("loginBtn"),err=document.getElementById("loginErr");
  err.textContent="";btn.disabled=true;btn.textContent="Entrando...";
  const { data, error }=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("senha").value});
  btn.disabled=false;btn.textContent="Entrar";
  if(error){ err.textContent="E-mail ou senha inválidos."; return; } showApp(data.session); });
document.getElementById("outBtn").addEventListener("click",async()=>{ await sb.auth.signOut(); showLogin(); });

(async function init(){
  if(!window.supabase){ document.getElementById("loginErr").textContent="Falha ao carregar Supabase."; return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const { data }=await sb.auth.getSession();
  if(data.session) showApp(data.session); else showLogin();
})();
</script>
