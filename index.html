<style>
  :root{
    --bg:#f4f5fa;--surface:#fff;--surface-2:#fafbff;--ink:#1a1b28;--ink-2:#4a4d63;--muted:#83879c;

    --shadow:0 1px 2px rgba(26,27,40,.04),0 6px 20px rgba(26,27,40,.05);--shadow-lg:0 12px 40px rgba(26,27,40,.18);--radius:14px;
    color-scheme:light;

  .wrap{max-width:1200px;margin:0 auto;padding:0 24px 72px}
  img{max-width:100%}

  .logo{width:38px;height:38px;flex:none}
  .logo-img{background:var(--logo) no-repeat left center/contain;aspect-ratio:1658/223;display:block;flex:none}
  header .logo-img{height:30px}
  .login-card .logo-img{width:220px;margin:0 auto 14px;background-position:center}
  #siderail .srl-brand .logo-img{width:150px}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .brand p{margin:0;font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .user-chip{font-size:12px;color:var(--muted)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
  .icon-btn:hover{border-color:var(--border-strong);color:var(--ink)}
  .txt-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
  .txt-btn:hover{border-color:var(--border-strong);color:var(--ink)}

  /* nav */
  nav.tabs{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

  section{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .sec-head .hint{font-size:12px;color:var(--muted)}
  .page-head{margin:26px 0 4px}
  .page-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
  .tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
  .tile .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .val{font-family:"Urbanist",sans-serif;font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-top:3px}
  .tile .val small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}

  .wb-back{margin-left:auto;border:1px solid #2a2f3c;background:none;color:#9aa0b4;font:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer}
  .wb-back:hover{color:#fff;border-color:#3a4155}
  .wb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
  .wb-tile{background:#1c2029;border:1px solid #2a2f3c;border-radius:14px;padding:16px 16px 14px;position:relative;overflow:hidden}
  .wb-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .wb-tile.c-accent::before{background:var(--accent)}
  .wb-tile.c-crit::before{background:var(--crit)}
  .wb-tile.c-warn::before{background:var(--warn)}
  .wb-tile.c-good::before{background:var(--good)}
  .wb-tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#9aa0b4;font-weight:700}
  .wb-tile .v{font-family:"Urbanist",sans-serif;font-size:34px;font-weight:700;line-height:1.15;margin-top:6px}
  .wb-tile.c-crit .v{color:#ff6b7f}
  .wb-tile.c-warn .v{color:#ffb648}
  .wb-tile.c-good .v{color:#3ddc97}
  .wb-tile.c-accent .v{color:#5ad1f0}
  .wb-tile .s{font-size:11px;color:#9aa0b4;margin-top:2px}
  .wb-mid{display:grid;grid-template-columns:auto 1fr;gap:22px;margin-top:18px;align-items:center}
  .wb-gauge{display:flex;flex-direction:column;align-items:center;gap:8px}
  .wb-gauge .ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative}
  .wb-gauge .ring .hole{width:88px;height:88px;border-radius:50%;background:#12151d;display:grid;place-items:center;flex-direction:column}
  .wb-gauge .ring .hole b{font-family:"Urbanist",sans-serif;font-size:22px;font-weight:700}
  .wb-gauge .ring .hole small{font-size:9.5px;color:#9aa0b4;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
  .wb-gauge .lbl{font-size:11.5px;font-weight:600;color:#c7cbdb;text-align:center}
  .wb-rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px}
  .wb-ring-item{display:flex;flex-direction:column;align-items:center;gap:7px}
  .wb-ring-item .ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center}
  .wb-ring-item .ring .hole{width:58px;height:58px;border-radius:50%;background:#12151d;display:grid;place-items:center}
  .wb-ring-item .ring .hole b{font-family:"Urbanist",sans-serif;font-size:15px;font-weight:700}
  .wb-ring-item .lbl{font-size:10.5px;font-weight:600;color:#9aa0b4;text-align:center;text-transform:uppercase;letter-spacing:.03em}
  .wb-list-h{font-size:11.5px;font-weight:700;color:#c7cbdb;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 10px}
  .wb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #232733}
  .wb-row:first-child{border-top:none}
  .wb-row .rn{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#eef0f6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;display:flex;align-items:center}
  .wb-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}
  .wb-row .rn:hover{color:var(--accent)}
  .wb-row .rbar{flex:none;width:120px;height:6px;border-radius:4px;background:#2a2f3c;overflow:hidden}
  .wb-row .rbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb648,#ff6b7f)}
  .wb-row .rc{flex:none;font-size:11.5px;font-weight:700;color:#c7cbdb;min-width:70px;text-align:right}
  .wb-row .rc b{color:#ff6b7f}
  .wb-empty{padding:22px 0;text-align:center;color:#9aa0b4;font-size:12.5px}
  @media(max-width:640px){ .wb-mid{grid-template-columns:1fr} .wb-gauge{flex-direction:row;justify-content:center} }

  /* =================================================================
     LAYOUT NOVO (W3Admin + paleta Resilcon) — camada aplicada por cima
     Moldura com menu lateral, painel claro de cantos arredondados,
     tema da moldura claro (padrão) ou escuro (botão no cabeçalho).
     ================================================================= */
  :root{
    --bg:#F3F6F7;--surface:#FFFFFF;--surface-2:#F7FAFB;--ink:#1C1C1C;--ink-2:#3D4B50;--muted:#66777E;
    --border:#DCE5E8;--border-strong:#C3D4D9;--accent:#066789;--accent-soft:#DCEAEF;--accent-deep:#044B64;
    --accent-2:#269A9E;--grad:linear-gradient(135deg,#006789 0%,#269A9E 100%);
    --good:#2E8B57;--good-soft:#DDF1E1;--warn:#B7791F;--warn-soft:#F8ECCB;--crit:#B4553A;--crit-soft:#F6DED5;
    --p-teal:#D3EEEC;--p-blue:#DCEAEF;--p-sand:#F5EACB;--p-mint:#DDF1E1;--edge:#1C1C1C;
    --shadow:none;--shadow-lg:0 18px 50px rgba(5,48,61,.18);--radius:20px;
    --frame:#FFFFFF;--frame-2:#EAF3F5;--frame-hover:#D6E9EE;--frame-ink:#3D4B50;--frame-ink-2:#7E9198;--frame-strong:#05303D;--frame-line:#DCE5E8;
    --main-edge:0 0 0 1px #DCE5E8;--side-w:268px;
  }
  :root[data-shell="escuro"]{
    --frame:#05303D;--frame-2:#0A3C4B;--frame-hover:#0F4B5C;--frame-ink:#B7D1D9;--frame-ink-2:#7FA3AE;--frame-strong:#FFFFFF;--frame-line:transparent;--main-edge:none;
  }
  body{background:var(--frame);font-size:14.5px}
  h1,h2,h3,h4{letter-spacing:-.01em}

  /* menu lateral */
  #siderail{width:var(--side-w);background:var(--frame);border-right:0;padding:22px 16px 28px max(16px,env(safe-area-inset-left,0px));gap:3px}
  #siderail .srl-brand{padding:4px 6px 20px}
  #siderail .srl-brand .logo-img{width:170px}
  :root[data-shell="escuro"] #siderail .logo-img{filter:brightness(0) invert(1)}
  .srl-title{color:var(--frame-ink-2);font-size:11px;letter-spacing:.12em;padding:16px 10px 8px}
  .srl-item{gap:12px;padding:6px 8px;border:0;border-radius:14px;color:var(--frame-ink);font-weight:500;font-size:14.5px}
  .srl-item svg{width:38px;height:38px;padding:10px;border-radius:50%;background:var(--frame-2);transition:background .2s,box-shadow .2s}
  .srl-item:hover{background:transparent;color:var(--frame-strong)}
  .srl-item:hover svg{background:var(--frame-hover)}
  .srl-item.on{background:transparent;color:var(--frame-strong);font-weight:700;border:0}
  .srl-item.on svg{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(38,154,158,.35)}
  .srl-sub{border-left:1px solid var(--frame-line);margin:4px 0 6px 26px}
  :root[data-shell="escuro"] .srl-sub{border-left-color:rgba(255,255,255,.12)}
  .srl-sub button{color:var(--frame-ink-2)}
  .srl-sub button:hover{color:var(--frame-strong);background:var(--frame-2)}

  /* painel principal */
  #app.appwrap{padding-left:0;margin-left:var(--side-w);background:var(--bg);border-radius:28px 0 0 28px;box-shadow:var(--main-edge);min-height:100vh}
  header{background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--border);border-top-left-radius:28px}
  .bar{max-width:none;padding:16px 28px}
  header .logo-img{display:none}
  .brand p{font-size:13px;color:var(--muted)}
  nav.tabs{max-width:none;padding:0 28px 12px;gap:6px}
  nav.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--border)}
  nav.tabs button:hover{color:var(--ink);border-color:var(--accent-2)}
  nav.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
  .wrap{max-width:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 72px 28px}
  .page-head h2{font-size:30px;font-weight:800}
  .sec-head h2{font-size:17px;font-weight:700}

  /* botões do cabeçalho */
  .icon-btn{width:42px;height:42px;border-radius:12px}
  .txt-btn{border-radius:10px;padding:9px 14px}
  #shellBtn svg{width:18px;height:18px}

  /* cartões de números: estilo pastel com contorno */
  .kpis .tile,.cx .tile{border:1px solid var(--edge);border-radius:22px;box-shadow:none}
  .kpis .tile:nth-child(4n+1){background:var(--p-teal)}
  .kpis .tile:nth-child(4n+2){background:var(--p-blue)}
  .kpis .tile:nth-child(4n+3){background:var(--p-sand)}
  .kpis .tile:nth-child(4n+4){background:var(--p-mint)}
  .tile .ic{background:var(--surface)!important;border-radius:50%;border:1px solid var(--edge)}
  .tile .lbl{color:var(--ink-2)}
  .tile .val{font-size:32px;font-weight:800}

  /* cartões, tabelas e componentes */
  .card,.ecard,.modal,.login-card{border-radius:22px;box-shadow:none;border-color:var(--border)}
  .ecard:hover{border-color:var(--accent-2)}
  thead th{background:var(--surface-2)}
  .view-btn{border-radius:10px}
  .view-btn:hover{border-color:var(--accent-2)}
  .search input,select.inp{border-radius:12px}
  .modal-head{background:var(--grad)}
  .prodhead{background:var(--grad)}
  footer{opacity:.8}

  /* login */
  #login{background:var(--frame)}
  :root[data-shell="escuro"] #login .login-card{border-color:transparent}
  .login-card button[type="submit"],#loginBtn{background:var(--grad)!important;border:0;border-radius:12px}

  @media (max-width:900px){
    #app.appwrap{margin-left:0;border-radius:0}
    header{border-top-left-radius:0}
    #siderail{width:auto;padding:8px 12px}
    .srl-item svg{width:32px;height:32px;padding:7px}
    .bar,nav.tabs{padding-left:16px;padding-right:16px}
    .wrap{padding-left:16px;padding-right:16px}
  }
  @media (prefers-reduced-motion:reduce){.srl-item svg,.ecard{transition:none}}

  /* ===== Central de E-mails ===== */
  .ce-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .ce-aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:13.5px}
  .ce-aviso svg,.ce-note svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--warn)}
  .ce-g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin:16px 0}
  .ce-pad{padding:18px 20px}
  .ce-ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .ce-ch h3{font-size:16px;font-weight:700;margin:0}
  .ce-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
  .ce-row:last-child{border-bottom:0}
  .ce-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ce-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
  .ce-tabs button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 13px;font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  .ce-tabs button .num{opacity:.65;margin-left:4px}
  .ce-tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
  .ce-regua{display:flex;flex-direction:column;gap:10px}
  .ce-desc{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
  .ce-note{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:13px}
  .ce-note svg{color:var(--accent-2)}
  .ce-note.crit{background:var(--crit-soft);border-color:transparent}.ce-note.crit svg{color:var(--crit)}
  .ce-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ce-nums div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
  .ce-nums b{font-size:18px}.ce-nums span{font-size:11.5px;color:var(--muted)}
  .view-btn.ce-pri{background:var(--grad);color:#fff;border-color:transparent}
  .view-btn[disabled]{opacity:.45;cursor:not-allowed}
  .ce-passos{margin:0;padding:0;list-style:none;border-top:1px solid var(--border)}
  .ce-passos li{display:flex;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--border)}
  .ce-passos li .num{min-width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
  .ce-kanban{display:grid;gap:12px}
  .ce-col{background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .ce-op{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
  .ce-op .view-btn{align-self:flex-start;margin-top:4px}
  .ce-op-det{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13px}
  .ce-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:9999;box-shadow:var(--shadow-lg)}
  @media (max-width:600px){.ce-g2{grid-template-columns:1fr}.ce-nums{grid-template-columns:repeat(2,1fr)}}

  /* ===== CRM de vendas ===== */
  .srl-sub button.on{color:var(--frame-strong);font-weight:700}
  .crm-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .txt-btn.crm-pri{background:var(--grad);color:#fff;border-color:transparent}
  .txt-btn.crm-pri:disabled{opacity:.6}
  .crm-amp{display:flex;gap:6px;align-items:center;margin:2px 0 16px;overflow-x:auto;padding-bottom:4px}
  .crm-seg{flex:1 1 0;min-width:112px;height:var(--h);border:0;cursor:pointer;color:#fff;background:var(--c);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;opacity:.5;font:inherit;transition:opacity .15s,transform .15s}
  .crm-seg:hover{opacity:.8}.crm-seg.on{opacity:1}
  .crm-seg b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
  .crm-seg span{font-size:24px;font-weight:800;line-height:1.1}.crm-seg small{font-size:11px;opacity:.92}
  .crm-bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .crm-card{border-left:3px solid var(--c)}.crm-card.drag{opacity:.45}
  .crm-ind{font-size:11.5px;font-weight:600;color:#A8325A;background:#FBE3EB;border-radius:999px;padding:2px 9px;display:inline-block;margin-top:5px;align-self:flex-start}
  .crm-parado{color:var(--warn);font-weight:700}
  .crm-col-soma{padding:6px 6px 0;font-size:12px}
  .crm-vazio{padding:16px 8px;text-align:center;font-size:12.5px}
  .crm-fim .kcol-body{min-height:96px;border:1px dashed var(--border-strong);border-radius:12px;padding:8px}
  .crm-etq{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
  .crm-tr{cursor:pointer}.crm-tr:hover td{background:var(--surface-2)}
  .crm-click{cursor:pointer}.crm-click:hover span:first-child{color:var(--accent)}
  .crm-dica{margin:0 0 12px}
  .crm-etapas,.crm-fases{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .crm-et{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .crm-et:hover{border-color:var(--c)}.crm-et.on{background:var(--c);border-color:var(--c);color:#fff}
  .view-btn.crm-ganho{background:var(--good);color:#fff;border-color:transparent}
  .crm-2col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
  .crm-colform{display:flex;flex-direction:column;gap:14px}
  .panel h4,.crm-h4{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--ink)}
  .crm-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .crm-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
  .crm-f .inp{font-weight:400;color:var(--ink);max-width:none;width:100%}
  input.inp:not([type=checkbox]):not([type=radio]){padding:9px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;min-width:0}
  input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid color-mix(in srgb,var(--accent-2) 45%,transparent);outline-offset:1px}
  .crm-w2{grid-column:1/-1}
  .crm-chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13.5px}
  .crm-par{display:flex;gap:6px}
  .crm-novo-c summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;margin-bottom:8px}
  .crm-form[hidden],.crm-f[hidden]{display:none!important}
  .crm-nav-mob{display:none;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
  .crm-nav-mob button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
  .crm-nav-mob button.on{background:var(--grad);color:#fff;border-color:transparent}
  @media (max-width:900px){.crm-nav-mob{display:flex}}
  .crm-itens{width:100%;border-collapse:collapse}.crm-itens .inp{padding:7px 9px!important;font-size:13px!important}.crm-itens th{font-size:11px;text-align:left;padding:4px;background:none}.crm-itens td{padding:4px;border:0}
  .crm-tot{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}
  .crm-pe{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .txt-btn.crm-perigo{color:var(--crit)}
  .crm-x{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12.5px;padding:2px 7px;border-radius:7px}
  .crm-x:hover,.crm-x.on{color:var(--crit);background:var(--crit-soft)}
  .crm-comp{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .crm-comp textarea.inp{min-height:70px;background:var(--surface)}
  .crm-comp .seg{flex-wrap:wrap}
  .crm-comp-pe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crm-anexo{cursor:pointer}
  .crm-ul{list-style:none;margin:16px 0 0 6px;padding:0 0 0 16px;border-left:2px solid var(--border)}
  .crm-li{position:relative;padding:0 0 16px 4px}
  .crm-dot{position:absolute;left:-24px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-2)}
  .crm-li.t-ganho .crm-dot{border-color:var(--good);background:var(--good)}.crm-li.t-perda .crm-dot{border-color:var(--crit)}
  .crm-li.t-email .crm-dot{border-color:#7B5BA6}.crm-li.t-etapa .crm-dot,.crm-li.t-criacao .crm-dot,.crm-li.t-fase .crm-dot{border-color:#EE8A2E}.crm-li.t-indicacao .crm-dot{border-color:#E2557A;background:#E2557A}
  .crm-li-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}.crm-li-h .crm-x{margin-left:auto}
  .crm-li-t{font-size:13.5px;margin-top:3px;white-space:pre-wrap;line-height:1.45;color:var(--ink)}
  .crm-li .view-btn{margin-top:6px}
  .crm-imp{margin-bottom:16px}.crm-imp h3{margin:0 0 6px;font-size:16px}
  .crm-drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--border-strong);border-radius:18px;padding:36px 16px;cursor:pointer;margin-top:12px;background:var(--surface-2);text-align:center}
  .crm-drop.on,.crm-drop:hover{border-color:var(--accent-2)}

function pagerHTML(total,page,totalP,start,shown){ const from=total?start+1:0,to=start+shown; let btns="";

    cx_just:r.complexidade_justificativa||"—",
    r:{v:num(r.nota_resolucao),j:r.nota_resolucao_justificativa||"—"},
    ra:{v:num(r.nota_rapidez),j:r.nota_rapidez_justificativa||"—"},
    s:{v:num(r.nota_satisfacao),j:r.nota_satisfacao_justificativa||"—"},
    erros:asArr(r.erros), sinais:asArr(r.sinais_de_risco),

    satisfacao:r.satisfacao_cliente||null, transcript:TRANSCRIPTS[r.id]||r.transcript||"",
    desfecho:r.desfecho||null, aderencia:{v:num(r.aderencia_jeito_resilcon),j:r.aderencia_justificativa||"—"},
    errosPt:asArr(r.erros_portugues), riscoTroca:r.risco_troca_contabilidade||null, churnMotivo:r.churn_motivo||null,
    docErrado:r.documento_errado===true, docErradoDetalhe:r.documento_errado_detalhe||null,
    servico:r.servico||null,
    computavel:(r.computar_nota!==false),
    durMin:(r.sessao_inicio&&r.sessao_fim)?Math.max(0,(new Date(r.sessao_fim)-new Date(r.sessao_inicio))/60000):null
  };
  a.cliente = clienteNome(a);
  a.empresa_id = empresaIdDe(a);
  a.churn = (a.riscoTroca==="possivel"||a.riscoTroca==="provavel") || churnScan(a) || CHURN_IDS.has(r.id);
  // contestação aprovada ajusta a nota do atendimento
  const _ct = CONTESTS[a.id];
  if(_ct && _ct.status==="aprovada"){
    if(_ct.nova_nota!=null && !isNaN(Number(_ct.nova_nota))){ a.notaIA=a.nota; a.nota=Number(_ct.nova_nota); a.notaAjustada=true; a.computavel=true; }
    else { a.notaIA=a.nota; a.computavel=false; a.notaAjustada=true; }
  }
  return a;
}

// Supabase devolve no máximo 1000 linhas por consulta. Buscamos em páginas de 1000
// com .range() até trazer tudo, senão o painel travava em 1000.
async function fetchAllRows(table, columns, orderCol, filtro){
  const A="atendimentos", PAGE=1000;
  const pagina=(from,comContagem)=>{
    let q=sb.schema(A).from(table).select(columns,comContagem?{count:"exact"}:undefined).range(from,from+PAGE-1);
    if(filtro) q=filtro(q);
    if(orderCol) q=q.order(orderCol,{ascending:false,nullsFirst:false});
    return q;
  };
  // 1a pagina traz o total; as demais saem em paralelo (lotes de 6), mantendo a ordem
  const prim=await pagina(0,true);
  if(prim.error) throw prim.error;
  let all=(prim.data||[]).slice();
  const total=(typeof prim.count==="number")?prim.count:all.length;
  if(all.length>=PAGE && total>PAGE){
    const offs=[]; for(let f=PAGE; f<total && f<=500000; f+=PAGE) offs.push(f);
    for(let i=0;i<offs.length;i+=6){
      const lote=await Promise.all(offs.slice(i,i+6).map(f=>pagina(f,false)));
      for(const r of lote){ if(r.error) throw r.error; all=all.concat(r.data||[]); }
    }
    if(all.length && all[0] && all[0].id!==undefined){ const vistos=new Set(); all=all.filter(r=>{ if(vistos.has(r.id)) return false; vistos.add(r.id); return true; }); }
  }
  return all;
}

const ANALISES_COLS="id,ticket_id,contact_id,atendente_id,atendente_nome,setor,canal,sessao_inicio,sessao_fim,criado_em,assunto_principal,resumo,tipo_atendimento,complexidade,nota_resolucao,nota_rapidez,nota_satisfacao,nota_final,satisfacao_cliente,erros,sinais_de_risco,oportunidade_comercial,oportunidades_de_melhoria,desfecho,aderencia_jeito_resilcon,erros_portugues,risco_troca_contabilidade,churn_motivo,documento_errado,documento_errado_detalhe,computar_nota";
const TRANSCRIPTS={};
const CHURN_IDS=new Set();
async function carregarChurnTexto(filtro){
  try{
    const filtro_kw=CHURN_KW.map(k=>`transcript.ilike.*${k}*`).join(",");
    let from=0;
    for(;;){
      let q=sb.schema("atendimentos").from("analises").select("id").or(filtro_kw).range(from,from+999); if(filtro) q=filtro(q);
      const {data,error}=await q;
      if(error) throw error;
      (data||[]).forEach(r=>CHURN_IDS.add(r.id));
      if(!data||data.length<1000) break; from+=1000;
    }
  }catch(e){ console.warn("varredura de troca no texto:",e); }
}
const DET_COLS="transcript,complexidade_justificativa,nota_resolucao_justificativa,nota_rapidez_justificativa,nota_satisfacao_justificativa,aderencia_justificativa";
async function ensureTranscript(a){
  if(a._det) return a.transcript;
  try{
    const {data,error}=await sb.schema("atendimentos").from("analises").select(DET_COLS).eq("id",a.id).limit(1);
    if(error) throw error;
    const d=(data&&data[0])||{};
    const t=d.transcript||"";
    TRANSCRIPTS[a.id]=t; a.transcript=t;
    a.cx_just=d.complexidade_justificativa||"—";
    a.r.j=d.nota_resolucao_justificativa||"—"; a.ra.j=d.nota_rapidez_justificativa||"—"; a.s.j=d.nota_satisfacao_justificativa||"—";
    a.aderencia.j=d.aderencia_justificativa||"—";
    a._det=true; return t;
  }catch(e){ console.warn("detalhes:",e); return null; }
}

const PERIODO_DIAS=30;
let HISTORICO_COMPLETO=false;
function filtroPeriodo(){
  if(HISTORICO_COMPLETO) return null;
  const d=new Date(Date.now()-PERIODO_DIAS*864e5).toISOString();
  return q=>q.gte("sessao_fim",d);
}
function atualizarChipPeriodo(){
  const el=document.getElementById("periodoChip"); if(!el) return;
  if(HISTORICO_COMPLETO){ el.innerHTML='<span class="user-chip">Histórico completo</span>'; return; }
  el.innerHTML=`<span class="user-chip">Últimos ${PERIODO_DIAS} dias</span> <button class="txt-btn" id="histBtn">Carregar histórico completo</button>`;
  const b=document.getElementById("histBtn");
  if(b) b.onclick=async()=>{ b.disabled=true; b.textContent="Carregando..."; HISTORICO_COMPLETO=true;
    try{ await carregarAnalises(); render(); }catch(e){ HISTORICO_COMPLETO=false; b.disabled=false; b.textContent="Carregar histórico completo"; alert("Não consegui carregar o histórico agora. Tente de novo."); } };
}
async function carregarAnalises(){
  const f=filtroPeriodo();
  CHURN_IDS.clear();
  [RAW] = await Promise.all([fetchAllRows("analises",ANALISES_COLS,"sessao_fim",f), carregarChurnTexto(f)]);
  ATEND = RAW.map(mapRow).filter(a=>!semAtendente(a)); // fora do horário / sem retorno do cliente: ninguém atendeu, não avalia nem mostra
  if(ACCESS && ACCESS.nivel!=="admin"){

    else ATEND=[]; // colaborador não vê atendimentos por aqui
  }
  atualizarChipPeriodo();
}

function saveKpiVals(){ try{localStorage.setItem("resiltrack_kpi",JSON.stringify(KPIVAL));}catch(e){} }
function kpiAuto(id){
  const com=comNota(ATEND), total=ATEND.length;
  if(id==="cobertura") return total? (com.length/total*100):null;
  if(id==="nota_media") return com.length? (com.reduce((s,a)=>s+a.nota,0)/com.length):null;
  if(id==="tempo_resol"){ const ds=ATEND.map(a=>a.durMin).filter(x=>typeof x==="number"&&x>0); return ds.length? (ds.reduce((s,x)=>s+x,0)/ds.length):null; }
  return null;
}
function kpiRender(k){
  let disp="";
  if(k.tipo==="auto"){
    const val=kpiAuto(k.id);
    if(val==null){ disp=`<span class="kv todo">sem dados</span>`; }
    else if(k.id==="nota_media"){ const cls=val>=8?"good":(val>=6?"warn":"crit"); disp=`<span class="kv ${cls}">${val.toFixed(1)}<span class="un">/10</span></span>`; }
    else if(k.id==="cobertura"){ const cls=val>=90?"good":(val>=70?"warn":"crit"); disp=`<span class="kv ${cls}">${Math.round(val)}<span class="un">%</span></span>`; }
    else if(k.id==="tempo_resol"){ disp=`<span class="kv">${val.toFixed(0)}<span class="un">min</span></span>`; }
  } else {
    const raw=KPIVAL[k.id];
    if(raw==null||raw===""){ disp=`<span class="kv todo">a configurar</span>`; }
    else if(k.unid==="R$"){ disp=`<span class="kv">R$ ${esc(String(raw))}</span>`; }
    else if(k.unid&&k.unid!=="nota"){ disp=`<span class="kv">${esc(String(raw))}<span class="un">${esc(k.unid)}</span></span>`; }
    else { disp=`<span class="kv">${esc(String(raw))}</span>`; }
  }
  const badge=k.tipo==="auto"?`<span class="kpi-badge auto">auto</span>`:`<span class="kpi-badge man">manual</span>`;
  const edit=(k.tipo==="manual"&&podePainelGestor())?`<button class="kpi-edit" data-kpi="${esc(k.id)}" title="Definir valor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`:"";
  return `<div class="kpi-card">${badge}<div class="kn">${esc(k.nome)}</div><div class="km">${esc(k.mede)}</div>${disp}<div class="kf">Como medir: ${esc(k.medir)}</div>${edit}</div>`;
}
function wallboardHTML(){
  return `<div class="gsec-h" style="margin-top:8px"><h3>Wallboard de KPIs</h3><span>indicadores do supervisor de inovação</span></div>`

  const k=GEST_KPIS.find(x=>x.id===id); if(!k) return;
  const cur=KPIVAL[id]!=null?KPIVAL[id]:"";
  openModal(`<div class="modal-head"><div><div style="font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.05em">Definir KPI</div><h3 style="margin:2px 0 0;font-size:18px">${esc(k.nome)}</h3></div><div class="spacer" style="flex:1"></div><button class="icon-btn" data-close style="background:rgba(255,255,255,.16);border:none;color:#fff">✕</button></div>

    <p style="font-size:11px;color:var(--muted);margin:10px 0 0">Salvo neste navegador por enquanto. Quando quiser esse número compartilhado entre os gestores, a gente liga no banco.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn-line" data-close>Cancelar</button>
      <button class="btn-primary" id="kpiSave">Salvar</button>
    </div>
  </div>`);
  document.getElementById("kpiSave").onclick=()=>{ const val=document.getElementById("kpiIn").value.trim(); if(val==="") delete KPIVAL[id]; else KPIVAL[id]=val; saveKpiVals(); closeModal(); render(); };
}

function _depTok(d){
  let s=(d||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.replace(/^departamento\s+(de\s+)?/,"").trim();
  // o G-Click e o Resiltrack às vezes nomeiam o mesmo departamento de formas diferentes
  // (ex.: G-Click manda "Contabilidade" e aqui está cadastrado "Departamento Contábil").
  // Agrupa pela raiz da palavra pra casar essas variantes.
  const raizes=["contab","fiscal","pessoal","financeir","comercial","societar","tribut","juridic","regulator","sucesso"];
  for(const r of raizes){ if(s.includes(r)) return r; }
  return s;
}

let GTAREFAS=null, GTLOADING=false, GTERR="";
function _primeiroDiaMes(){ const d=new Date(); const o=new Date(d.getTime()-3*3600*1000); return o.toISOString().slice(0,7)+"-01"; }
async function loadGTarefas(){
  try{
    const A="atendimentos", PAGE=1000; let from=0, all=[];
    const cols="tarefa_id,categoria,departamento,obrigacao,cliente,status,status_desc,data_meta,data_vencimento,data_conclusao,pendente,atrasada";
    while(true){
      const {data,error}=await sb.schema(A).from("gclick_tarefas").select(cols)
        .or(`pendente.eq.true,data_conclusao.gte.${_primeiroDiaMes()}`).range(from,from+PAGE-1);
      if(error) throw error;
      all=all.concat(data||[]);
      if(!data||data.length<PAGE) break; from+=PAGE; if(from>200000) break;
    }
    GTAREFAS=all;
  }catch(e){ console.warn("gclick:",e); GTAREFAS=[]; GTERR=e.message||String(e); }
  GTLOADING=false;
  if(MODE==="gestor") render();
}
function fmtVenc(s){ if(!s) return "—"; const p=String(s).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s; }
function _gclickDeps(){
  const m={}; (GTAREFAS||[]).forEach(t=>{ const d=t.departamento||"Sem departamento"; if(!m[d])m[d]={dep:d,total:0,pend:0,atr:0,hoje:0}; m[d].total++; if(t.pendente)m[d].pend++; if(t.atrasada)m[d].atr++; if(t.data_conclusao===_todayStr())m[d].hoje++; });
  return Object.values(m).sort((a,b)=>b.atr-a.atr||b.pend-a.pend);
}
function _gclickDepsPermitidos(){
  const todas=_gclickDeps();
  if(isAdmin()) return todas;
  const toks=new Set((ACCESS.departamentos||[]).map(_depTok));
  const f=todas.filter(d=>toks.has(_depTok(d.dep)));
  return f.length?f:todas;
}
const _MESES_PT=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const _DIAS_PT=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function _curMonthStr(){ const d=new Date(); const o=new Date(d.getTime()-3*3600*1000); return o.toISOString().slice(0,7); }
function _addMonths(ym,delta){ const [y,m]=ym.split("-").map(Number); const dt=new Date(y,m-1+delta,1); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); }
function _monthLabel(ym){ const [y,m]=ym.split("-").map(Number); const nome=_MESES_PT[m-1]; return `${nome.charAt(0).toUpperCase()}${nome.slice(1)} de ${y}`; }
function _ring(pct,cor,size){
  const p=Math.max(0,Math.min(100,pct||0));
  return `<div class="ring" style="width:${size}px;height:${size}px;background:conic-gradient(${cor} ${p*3.6}deg, #262b37 0)"><div class="hole" style="width:${size-20}px;height:${size-20}px"><b>${Math.round(p)}%</b></div></div>`;
}
function _mesBounds(ym){ const [y,m]=ym.split("-").map(Number); const ini=new Date(y,m-1,1,0,0,0,0).getTime(); const fim=new Date(y,m,1,0,0,0,0).getTime()-1; return {ini,fim}; }
// colaboradores do departamento (visão da Revisão Diária): qualidade de atendimento real (ATEND),
// já que o G-Click não traz responsável por tarefa — G-Click entra só como contexto do departamento.
function _colabsDoDepartamento(dep,mes){
  const {ini,fim}=_mesBounds(mes);
  const tok=_depTok(dep);
  const map=new Map();
  ATEND.forEach(a=>{
    if(semAtendente(a)) return;
    const depAt=deptDoAtendente(a.atendente_id,a.setor)||a.setor||"Sem departamento";
    if(_depTok(depAt)!==tok) return;
    const key=a.atendente_id||a.atendente;
    if(!map.has(key)) map.set(key,{key,nome:a.atendente,list:[]});
    if(a.ts>=ini && a.ts<=fim) map.get(key).list.push(a);
  });
  return [...map.values()].map(g=>{
    const cn=g.list.filter(a=>okNota(a));
    const media=cn.length? cn.reduce((s,a)=>s+a.nota,0)/cn.length : null;
    const ab=cn.filter(a=>a.nota<7).length, ac=cn.length-ab, pct=cn.length? ac/cn.length*100 : null;
    const durTot=g.list.reduce((s,a)=>s+(a.durMin||0),0);
    return {key:g.key,nome:g.nome,qtd:g.list.length,media,ab,ac,pct,status:perfStatus(pct),durTot};
  }).sort((a,b)=>{
    const peso=s=>s==='crit'?0:(s==='warn'?1:(s==='ausente'?2:3));
    return peso(a.status)-peso(b.status) || b.qtd-a.qtd;
  });
}
function revisaoHTML(){

    return `<div class="gsec" id="g-revisao"><div class="gsec-h"><h3>Revisão diária</h3><span>carregando do G-Click...</span></div><div class="sub" style="padding:14px 0">Buscando as demandas e prazos por departamento...</div></div>`;
  }
  const deps=_gclickDepsPermitidos();
  if(!deps.length){
    return `<div class="gsec" id="g-revisao"><div class="gsec-h"><h3>Revisão diária</h3><span>sem dados</span></div><div class="sub" style="padding:14px 0">Nenhuma tarefa do G-Click encontrada${GTERR?" ("+esc(GTERR)+")":""}. Rode o coletor do G-Click para popular a tabela.</div></div>`;
  }
  const dep = (REVDEP && deps.find(d=>d.dep===REVDEP)) ? REVDEP : deps[0].dep;
  const mes = REVMES || (REVMES=_curMonthStr());
  const ehMesAtual = mes===_curMonthStr();
  const hoje=_todayStr();
  const agora=new Date();

  const selDep=`<select id="revDepSel" class="wb-depsel">`+
    deps.map(d=>`<option value="${esc(d.dep)}" ${d.dep===dep?"selected":""}>${esc(d.dep)} · ${d.atr} atrasada(s)</option>`).join("")+`</select>`;
  const nav=`<div class="wb-monthnav">
    <button data-mnav="-1" title="Mês anterior"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="m">${esc(_monthLabel(mes))}</span>
    <button data-mnav="1" title="Próximo mês"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>`;
  const voltarHoje = !ehMesAtual ? `<button class="wb-back" id="revVoltarHoje">voltar para o mês atual</button>` : "";

  const doDep=(GTAREFAS||[]).filter(t=>(t.departamento||"Sem departamento")===dep);
  const pendTotal=doDep.filter(t=>t.pendente).length;
  const atrTotal=doDep.filter(t=>t.atrasada).length;
  const doMes=doDep.filter(t=>t.pendente && String(t.data_vencimento||"").slice(0,7)===mes);
  const pendMes=doMes.length;
  const atrMes=doMes.filter(t=>t.atrasada).length;
  const venceHoje=ehMesAtual? doDep.filter(t=>t.pendente && t.data_vencimento===hoje).length : null;
  const conclMes=doDep.filter(t=>t.data_conclusao && t.data_conclusao.slice(0,7)===mes).length;

  const tiles=`<div class="wb-tiles">
    <div class="wb-tile c-accent"><div class="l">Pendentes no mês</div><div class="v">${pendMes}</div><div class="s">vencimento em ${esc(_monthLabel(mes))}</div></div>
    <div class="wb-tile c-crit"><div class="l">Atrasadas no mês</div><div class="v">${atrMes}</div><div class="s">${atrTotal} atrasada(s) ao todo no departamento</div></div>
    ${ehMesAtual?`<div class="wb-tile c-warn"><div class="l">Vencem hoje</div><div class="v">${venceHoje}</div><div class="s">${esc(fmtVenc(hoje))}</div></div>`:""}
    <div class="wb-tile c-good"><div class="l">Concluídas no mês</div><div class="v">${conclMes}</div><div class="s">${ehMesAtual?"até agora":"registradas neste mês"}</div></div>
  </div>`;

  const pctEmDia = pendMes? Math.round(((pendMes-atrMes)/pendMes)*100) : 100;
  const pctConcl = (conclMes+pendMes)? Math.round((conclMes/(conclMes+pendMes))*100) : 0;
  const pctAtrGeral = pendTotal? Math.round((atrTotal/pendTotal)*100) : 0;
  const corGauge = pctEmDia>=80?"var(--good)":(pctEmDia>=50?"var(--warn)":"var(--crit)");

  const mid=`<div class="wb-mid">
    <div class="wb-gauge">
      <div class="ring" style="width:118px;height:118px;background:conic-gradient(${corGauge} ${pctEmDia*3.6}deg, #262b37 0)"><div class="hole"><b>${pctEmDia}%</b><small>em dia</small></div></div>
      <div class="lbl">Pendências do mês<br>dentro do prazo</div>
    </div>
    <div class="wb-rings">
      <div class="wb-ring-item">${_ring(pctConcl,"var(--good)",78)}<div class="lbl">Taxa de<br>conclusão no mês</div></div>
      <div class="wb-ring-item">${_ring(atrMes&&pendMes? Math.round(atrMes/pendMes*100):0,"var(--crit)",78)}<div class="lbl">Taxa de atraso<br>no mês</div></div>
      <div class="wb-ring-item">${_ring(pctAtrGeral,"var(--warn)",78)}<div class="lbl">Taxa de atraso<br>geral (departamento)</div></div>
    </div>
  </div>`;
  const colabs=_colabsDoDepartamento(dep,mes);
  const linhasColab=colabs.map(c=>{
    const pctShow=c.pct==null?0:Math.round(c.pct);
    const corBar=c.status==='crit'?'#ff6b7f':(c.status==='warn'?'#ffb648':(c.status==='good'?'#3ddc97':'#4a5063'));
    const corDot=c.status==='crit'?'var(--crit)':(c.status==='warn'?'var(--warn)':(c.status==='good'?'var(--good)':'#5a6072'));
    return `<div class="wb-row">
      <div class="rn" data-colab="${escAttr(String(c.key))}" title="${esc(c.nome)} — ver relatório completo"><span class="wb-dot" style="background:${corDot}"></span>${esc(c.nome)}</div>
      <div class="rbar"><i style="width:${pctShow}%;background:${corBar}"></i></div>
      <div class="rc">${c.qtd} atend. · nota ${fmt1(c.media)}${c.durTot?` · ${fmtDur(c.durTot)}`:""}</div>
    </div>`;
  }).join("");
  const listaHTML = colabs.length
    ? `<div class="wb-list-h">Colaboradores · ${esc(dep)}</div><div>${linhasColab}</div>`
    : `<div class="wb-empty">Nenhum colaborador vinculado a este departamento ainda. Configure em Admin → Departamento por atendente.</div>`;

  const diaSemana=_DIAS_PT[agora.getDay()]; const diaSemanaCap=diaSemana.charAt(0).toUpperCase()+diaSemana.slice(1);
  const relogio=`<div class="wb-clock"><div class="t">${agora.toTimeString().slice(0,5)}</div><div class="d">${esc(fmtVenc(hoje))} · ${esc(diaSemanaCap)}</div></div>`;

  return `<div class="gsec" id="g-revisao">
    <div class="wb">
      <div class="wb-head">
        <div class="wb-title">Revisão diária<span>demandas e prazos do G-Click · ${esc(dep)}</span></div>
        ${relogio}
      </div>
      <div class="wb-controls">${nav}${selDep}${voltarHoje}</div>
      ${tiles}
      ${mid}
      ${listaHTML}
    </div>
  </div>`;
}

async function atualizarFinanceiro(manual){

function _finLinha(snaps,campo,cor){

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline fill="none" stroke="${cor}" stroke-width="2.2" points="${pts}"/>
    ${vs.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${cor}"><title>${fmtD(snaps[i].data)}: ${campo==="valor"?brl(v):v}</title></circle>`).join("")}
    <text x="${P}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtD(snaps[0].data)}</text><text x="${W-P}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtD(snaps[snaps.length-1].data)}</text></svg>`;

// ---------- HEALTH SCORE CLIENTES ----------
function reclamacoesEmpresa(empId){ let n=0; ATEND.forEach(a=>{ if(a.empresa_id===empId && CONTESTS[a.id]) n++; }); return n; }
function clienteScore(empId){
  const ag=empresaAgg(empId);
  const cn=ag.list.filter(a=>okNota(a));
  const ab=cn.filter(a=>a.nota<7).length, ac=cn.length-ab;
  const ratio=cn.length?ab/cn.length:0;
  const reclam=reclamacoesEmpresa(empId);
  let risco=ag.media!==null?(10-ag.media)/2:2.5;
  if(ag.churn) risco+=1.2;
  risco+=Math.min(1,ratio*2);
  risco+=Math.min(1,reclam*0.5);
  risco=Math.max(1,Math.min(5,risco));
  let status="saudavel";
  if(ag.churn||risco>=3.5||(ag.media!==null&&ag.media<6.5)) status="critico";
  else if(risco>=2.5||ratio>=0.25||reclam>0||(ag.media!==null&&ag.media<7.5)) status="alerta";
  return {...ag,ab,ac,ratio,reclam,risco:Math.round(risco*10)/10,status,notas:cn.length};
}

const stIcon={saudavel:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  alerta:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  critico:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'};

  ];

// ---------- ANÁLISE POR SETOR (ranking de equipes) ----------
function setorAgg(setor){
  const list=ATEND.filter(a=>a.setor===setor);
  const cn=list.filter(a=>okNota(a));
  const media=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null;
  const satVals=list.map(a=>a.s.v).filter(x=>x!==null&&!isNaN(x));
  const satisf=satVals.length?satVals.reduce((s,n)=>s+n,0)/satVals.length:null;
  const colabs=[...new Set(list.filter(a=>!semAtendente(a)).map(a=>a.atendente_id||a.atendente))];
  const empIds=[...new Set(list.map(a=>a.empresa_id).filter(Boolean))];
  let cr=0,al=0,sa=0; empIds.forEach(id=>{ const st=clienteScore(id).status; if(st==="critico")cr++;else if(st==="alerta")al++;else sa++; });
  return {setor,list,qtd:list.length,media,satisf,colabs,empIds,cr,al,sa};
}

function empresaAgg(empId){
  const list=ATEND.filter(a=>a.empresa_id===empId);
  const cn=list.filter(a=>okNota(a));
  const media=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null;
  const sat={positivo:0,neutro:0,negativo:0};
  list.forEach(a=>{ if(a.satisfacao&&sat[a.satisfacao]!==undefined)sat[a.satisfacao]++; });
  const churn=list.some(a=>a.churn);
  const cols=[...new Set(list.map(a=>a.atendente))];
  let health="neutro";
  if(sat.negativo>0||churn||(media!==null&&media<6)) health="sensivel";
  else if(cn.length&&(media>=8)&&sat.negativo===0) health="fa";
  const tsl=list.map(a=>a.ts).filter(Boolean);
  const ultima=tsl.length?Math.max(...tsl):0, primeira=tsl.length?Math.min(...tsl):0;
  const durMin=list.reduce((s,a)=>s+(a.durMin||0),0);
  const satV=list.filter(okNota).map(a=>a.s.v).filter(x=>x!==null&&!isNaN(x)); const satMedia=satV.length?satV.reduce((s,n)=>s+n,0)/satV.length:null;
  const aderV=list.filter(okNota).map(a=>a.aderencia.v).filter(x=>x!==null&&!isNaN(x)); const aderMedia=aderV.length?aderV.reduce((s,n)=>s+n,0)/aderV.length:null;
  const servicos={}; list.forEach(a=>{ if(a.servico) servicos[a.servico]=(servicos[a.servico]||0)+1; });
  const desfechos={}; list.forEach(a=>{ if(a.desfecho) desfechos[a.desfecho]=(desfechos[a.desfecho]||0)+1; });
  const colMap=new Map(); list.forEach(a=>{ if(semAtendente(a))return; const k=a.atendente_id||a.atendente; if(!colMap.has(k))colMap.set(k,{key:k,nome:a.atendente,notas:[],n:0}); const g=colMap.get(k); g.n++; if(okNota(a))g.notas.push(a.nota); });
  const colabs=[...colMap.values()].map(g=>({key:g.key,nome:g.nome,n:g.n,media:g.notas.length?g.notas.reduce((s,n)=>s+n,0)/g.notas.length:null})).sort((a,b)=>b.n-a.n);
  const notasBaixas=cn.filter(a=>a.nota<7).length, notasAltas=cn.length-notasBaixas;
  const erros={}; list.forEach(a=>a.erros.forEach(e=>erros[e]=(erros[e]||0)+1));
  const melhorias={}; list.forEach(a=>a.melhorias.forEach(m=>melhorias[m]=(melhorias[m]||0)+1));
  const oports=list.filter(a=>a.oport).map(a=>a.oport);
  return {list,media,count:list.length,sat,churn,cols,health,ultima,primeira,durMin,satMedia,aderMedia,servicos,desfechos,colabs,notasBaixas,notasAltas,erros,melhorias,oports};
}

// vincula o colaborador do Resiltrack ao do Dashboard Gestores: nome exato, senão primeiro + último nome (ex.: "Tracy Campos" = "TRACY LIMA CAMPOS")
function _wmDe(nome){
  if(!WM||!WM.por) return null;
  const k=_semAcento(nome); const ex=WM.por[k];
  const _ign=new Set(["de","da","do","das","dos","e"]);
  const tk=s=>_semAcento(s).split(" ").filter(t=>t&&!_ign.has(t));
  const t=tk(nome);
  if(ex&&ex.dias>0) return ex;
  if(t.length<2) return ex||null;
  // casa se o primeiro nome é igual e os demais nomes aparecem, na mesma ordem, dentro do nome completo do Dashboard
  const _sub=(u)=>{ if(u[0]!==t[0]) return false; let i=1; for(let j=1;j<u.length&&i<t.length;j++){ if(u[j]===t[i]) i++; } return i===t.length; };
  const cands=Object.values(WM.por).filter(a=>_sub(tk(a.nome)));
  const comDados=cands.filter(a=>a.dias>0);
  if(comDados.length===1) return comDados[0];
  return ex||(cands.length===1?cands[0]:null);
}

let RDATE=null;
function ymdShift(dateStr,delta){ const [y,m,d]=dateStr.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+(delta||0)); return dt.toISOString().slice(0,10); }
function ymdBR(offset){ const now=new Date(Date.now()-3*3600e3); return ymdShift(now.toISOString().slice(0,10),offset||0); }
function diaBounds(dateStr){ return {ini:new Date(dateStr+"T00:00:00-03:00").getTime(), fim:new Date(dateStr+"T23:59:59.999-03:00").getTime()}; }
function fmtDataBR(dateStr){ const [y,m,d]=dateStr.split("-"); return `${d}/${m}/${y}`; }
const DOW=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function relatorioDados(dateStr){
  const {ini,fim}=diaBounds(dateStr);
  const dia=ATEND.filter(a=>a.ts>=ini&&a.ts<=fim);
  const ag=aggList(dia);
  const prev=ymdShift(dateStr,-1); const pb=diaBounds(prev); const agPrev=aggList(ATEND.filter(a=>a.ts>=pb.ini&&a.ts<=pb.fim));
  const dur=dia.reduce((s,a)=>s+(a.durMin||0),0);
  const naoComp=dia.filter(a=>a.computavel===false).length;
  const atendentes=new Set(dia.filter(a=>!semAtendente(a)).map(a=>a.atendente_id||a.atendente)).size;
  const riscos=dia.filter(a=>a.churn||a.docErrado||a.satisfacao==='negativo'||(okNota(a)&&a.nota<6)||(a.sinais&&a.sinais.length));
  const piores=dia.filter(okNota).sort((a,b)=>a.nota-b.nota).slice(0,5);
  const melhores=dia.filter(okNota).sort((a,b)=>b.nota-a.nota).slice(0,5);
  const melMap=new Map(); dia.forEach(a=>(a.melhorias||[]).forEach(m=>melMap.set(m,(melMap.get(m)||0)+1)));

  const oportsAll=dia.filter(a=>a.oport);

  const scorePerda=a=>{ let s=0; if(a.churn||a.riscoTroca==='possivel'||a.riscoTroca==='provavel')s+=3; const emp=a.empresa_id&&EMPRESAS[a.empresa_id]; if(emp&&String(emp.status||'').toLowerCase().includes('ativ'))s+=2; if(a.satisfacao==='negativo')s+=1; if(a.desfecho==='sem_retorno_cliente')s+=2; else if(a.desfecho==='nao_resolvido')s+=1; if(okNota(a)&&a.nota<6)s+=1; return s; };
  const oportsPerdidas=oportsAll.filter(ehPerdida).map(a=>({id:a.id,cliente:a.cliente,atendente:a.atendente,oport:a.oport,nota:a.nota,motivo:motivoPerda(a),score:scorePerda(a)})).sort((x,y)=>y.score-x.score).slice(0,5);

function motivoPerda(a){ const r=[]; if(a.churn||a.riscoTroca==='possivel'||a.riscoTroca==='provavel')r.push('cliente em risco de troca'); if(a.desfecho==='sem_retorno_cliente')r.push('cliente não retornou'); if(a.desfecho==='nao_resolvido')r.push('não resolvido'); if(a.satisfacao==='negativo')r.push('cliente insatisfeito'); if(okNota(a)&&a.nota<6)r.push('atendimento nota baixa'); return r.join(' · ')||'sem encaminhamento comercial'; }
function motivoRisco(a){ const r=[]; if(a.churn)r.push('possível troca de contabilidade'); if(a.docErrado)r.push('documento errado ao cliente'); if(a.satisfacao==='negativo')r.push('cliente insatisfeito'); if(okNota(a)&&a.nota<6)r.push('nota crítica'); if(a.sinais&&a.sinais.length)r.push(a.sinais[0]); return r.join(' · ')||'atenção'; }

let SFIL={ano:null,mes:null,sel:null,sort:"pct_desc"};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESCURTO=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function mesesComDados(){ const s=new Set(); ATEND.forEach(a=>{ if(!a.ts)return; const d=new Date(a.ts); s.add(d.getFullYear()+"|"+d.getMonth()); });
  return [...s].map(k=>{const[y,m]=k.split("|").map(Number);return{ano:y,mes:m};}).sort((a,b)=>a.ano-b.ano||a.mes-b.mes); }
function semanasDoMes(ano,mes){ const last=new Date(ano,mes+1,0).getDate(); const buckets=new Map();
  for(let d=1;d<=last;d++){ const dt=new Date(ano,mes,d); const dow=(dt.getDay()+6)%7; const monday=new Date(ano,mes,d-dow).getTime();
    if(!buckets.has(monday))buckets.set(monday,[]); buckets.get(monday).push(d); }
  return [...buckets.entries()].sort((a,b)=>a[0]-b[0]).map(([k,dias],i)=>{ const di=dias[0],df=dias[dias.length-1];
    return {n:i+1,ini:new Date(ano,mes,di,0,0,0).getTime(),fim:new Date(ano,mes,df,23,59,59).getTime(),
      label:`${String(di).padStart(2,"0")}–${String(df).padStart(2,"0")}/${String(mes+1).padStart(2,"0")}`}; });
}
function aggList(list){ const cn=list.filter(a=>okNota(a)); const q=cn.length;
  const media=q?cn.reduce((s,a)=>s+a.nota,0)/q:null; const ac=cn.filter(a=>a.nota>=7).length;
  return {n:list.length,q,media,ac,pctAc:q?ac/q*100:null,pctAb:q?(q-ac)/q*100:null}; }
function atendRange(ini,fim){ return ATEND.filter(a=>a.ts>=ini&&a.ts<=fim); }
function celClass(m){ return m===null?"n":(m>=8.5?"g9":(m>=7?"g":(m>=6?"a":"r"))); }
function celHTML(ag,extra){ if(!ag||!ag.n) return `<div class="gcell n ${extra||''}"><span class="sub">—</span></div>`;
  return `<div class="gcell ${celClass(ag.media)} ${extra||''}"><div class="celm num">${fmt1(ag.media)}</div><div class="cela num">${ag.n} atend.</div><div class="celp">${ag.pctAc===null?"":Math.round(ag.pctAc)+"% acima"}</div></div>`; }
function nivelHTML(list){ const c={baixa:0,media:0,alta:0,sem:0}; list.forEach(a=>{ if(a.complexidade&&c[a.complexidade]!==undefined)c[a.complexidade]++; else c.sem++; });
  const tot=list.length||1; const seg=(n,col)=>`<span style="width:${n/tot*100}%;background:${col}"></span>`;
  return `<div class="nivbar">${seg(c.baixa,"var(--good)")}${seg(c.media,"var(--warn)")}${seg(c.alta,"var(--crit)")}${seg(c.sem,"var(--border-strong)")}</div>
    <div class="nivleg"><span>${c.baixa} N1</span><span>${c.media} N2</span><span>${c.alta} N3</span>${c.sem?`<span>${c.sem} s/cl</span>`:""}</div>`; }

function viewSetor(v){
  const meses=mesesComDados();
  if(SFIL.ano===null){ const ult=meses[meses.length-1]||{ano:new Date().getFullYear(),mes:new Date().getMonth()}; SFIL.ano=ult.ano; SFIL.mes=ult.mes; }
  const ano=SFIL.ano, mes=SFIL.mes;
  const mIni=new Date(ano,mes,1).getTime(), mFim=new Date(ano,mes+1,0,23,59,59).getTime();
  const pAno=mes===0?ano-1:ano, pMes=mes===0?11:mes-1;
  const pIni=new Date(pAno,pMes,1).getTime(), pFim=new Date(pAno,pMes+1,0,23,59,59).getTime();
  const yIni=new Date(ano,0,1).getTime();
  const semanas=semanasDoMes(ano,mes);
  const setores=[...new Set(ATEND.filter(a=>a.ts>=mIni&&a.ts<=mFim).map(a=>a.setor||"—"))];
  // agrega por setor
  let rows=setores.map(setor=>{ const inSetor=t=>t.filter(a=>(a.setor||"—")===setor);
    const mesList=inSetor(atendRange(mIni,mFim));
    const prevList=inSetor(atendRange(pIni,pFim));
    const sem=semanas.map(s=>({...s,ag:aggList(inSetor(atendRange(s.ini,s.fim))),list:inSetor(atendRange(s.ini,s.fim))}));
    return {setor,mesList,mesAg:aggList(mesList),prevAg:aggList(prevList),sem}; })
    .filter(r=>r.mesAg.n>0);
  const srt=SFIL.sort;

  // kpis do mês e do ano

  <section><div class="kpi-big">
    <div class="box"><div class="cap">${MESES[mes]} ${ano}</div><div class="big num" style="color:${scoreColor(mesAll.media)}">${fmt1(mesAll.media)}</div><div class="sub2 num">${mesAll.n} atendimento(s)</div>${barHTML(mesAll)}</div>
    <div class="box"><div class="cap">Acumulado ${ano} (jan–${MESCURTO[mes].toLowerCase()})</div><div class="big num" style="color:${scoreColor(yearAll.media)}">${fmt1(yearAll.media)}</div><div class="sub2 num">${yearAll.n} atendimento(s)</div>${barHTML(yearAll)}</div>

  if(SFIL.sel) renderDrill(v);

function renderDrill(v){
  const d=v.querySelector("#drill"); if(!d)return; const sel=SFIL.sel;
  const ano=SFIL.ano,mes=SFIL.mes;
  let ini,fim,titulo;
  if(sel.tipo==="mes"){ ini=new Date(ano,mes,1).getTime(); fim=new Date(ano,mes+1,0,23,59,59).getTime(); titulo=`${MESES[mes]} ${ano}`; }
  else { const s=semanasDoMes(ano,mes)[sel.i]; ini=s.ini; fim=s.fim; titulo=`Semana ${s.n} · ${s.label}`; }
  const list=ATEND.filter(a=>(a.setor||"—")===sel.setor && a.ts>=ini && a.ts<=fim);
  const baixas=list.filter(a=>okNota(a)&&a.nota<7);
  const totAb=baixas.length||1;
  // top colaboradores por impacto em notas < 7
  const mc=new Map(); list.forEach(a=>{ if(semAtendente(a))return; const k=a.atendente_id||a.atendente; if(!mc.has(k))mc.set(k,{key:k,nome:a.atendente,list:[]}); mc.get(k).list.push(a); });
  const cols=[...mc.values()].map(g=>{ const cn=g.list.filter(a=>okNota(a)); const m=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null; const ab=cn.filter(a=>a.nota<7).length;
    return {key:g.key,nome:g.nome,total:g.list.length,media:m,ab,contrib:ab/totAb*100}; }).filter(c=>c.ab>0).sort((a,b)=>b.ab-a.ab).slice(0,3);
  // top clientes por menor média
  const me=new Map(); list.forEach(a=>{ if(!a.empresa_id)return; if(!me.has(a.empresa_id))me.set(a.empresa_id,[]); me.get(a.empresa_id).push(a); });
  const clis=[...me.entries()].map(([id,l])=>{ const cn=l.filter(a=>okNota(a)); const m=cn.length?cn.reduce((s,a)=>s+a.nota,0)/cn.length:null; const ab=cn.filter(a=>a.nota<7).length;
    return {nome:(EMPRESAS[id]&&(EMPRESAS[id].apelido||EMPRESAS[id].nome))||"—",total:l.length,media:m,ab}; }).filter(c=>c.media!==null).sort((a,b)=>a.media-b.media).slice(0,3);
  // apontamentos (erros) e sugestões (melhorias)
  const cErr=new Map(); list.forEach(a=>a.erros.forEach(e=>cErr.set(e,(cErr.get(e)||0)+1)));
  const topErr=[...cErr.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
  const cMel=new Map(); list.forEach(a=>a.melhorias.forEach(m=>cMel.set(m,(cMel.get(m)||0)+1)));
  const topMel=[...cMel.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
  const ag=aggList(list);
  d.innerHTML=`
  <section><div class="sec-head"><h2>${esc(sel.setor)} · ${titulo}</h2><span class="hint">${ag.n} atendimento(s) · média ${fmt1(ag.media)} · ${baixas.length} nota(s) &lt; 7</span></div>
  <div class="drill">
    <div class="card"><div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:Urbanist,"DM Sans",sans-serif;font-weight:600;font-size:13px">Top 3 colaboradores · maior impacto em notas &lt; 7</div>
      <table><thead><tr><th>Colaborador</th><th class="center">Total</th><th class="center">Média</th><th class="center">Notas &lt; 7</th><th class="center">Contrib.</th></tr></thead><tbody>${
        cols.length?cols.map(c=>`<tr><td class="r-name"><button class="link-name" data-col="${escAttr(String(c.key))}">${esc(c.nome)}</button></td><td class="center num">${c.total}</td><td class="center"><span class="nota ${notaClass(c.media)} num" style="min-width:auto;padding:2px 8px">${fmt1(c.media)}</span></td><td class="center num" style="color:var(--crit);font-weight:600">${c.ab}</td><td class="center num">${Math.round(c.contrib)}%</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Nenhuma nota abaixo de 7 no período. Ótimo sinal.</td></tr>`
      }</tbody></table></div>
    <div class="card"><div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:Urbanist,"DM Sans",sans-serif;font-weight:600;font-size:13px">Top 3 clientes · notas mais baixas</div>
      <table><thead><tr><th>Cliente</th><th class="center">Total</th><th class="center">Média</th><th class="center">Notas &lt; 7</th></tr></thead><tbody>${
        clis.length?clis.map(c=>`<tr><td class="r-name">${esc(c.nome)}</td><td class="center num">${c.total}</td><td class="center"><span class="nota ${notaClass(c.media)} num" style="min-width:auto;padding:2px 8px">${fmt1(c.media)}</span></td><td class="center num">${c.ab?`<span style="color:var(--crit);font-weight:600">${c.ab}</span>`:'<span class="sub">0</span>'}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Sem clientes vinculados no período.</td></tr>`
      }</tbody></table></div>
  </div>
  <div class="drill">
    <div class="card" style="padding:16px 18px"><div style="font-family:Urbanist,"DM Sans",sans-serif;font-weight:600;font-size:13px;margin-bottom:10px">Apontamentos do período</div>${
      topErr.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${topErr.map(([e,n])=>`<span class="chip err">${esc(e)}${n>1?` <span class="sub">×${n}</span>`:""}</span>`).join("")}</div>`:'<div class="sub">Nenhum erro apontado no período.</div>'
    }</div>
    <div class="card" style="padding:16px 18px"><div style="font-family:Urbanist,"DM Sans",sans-serif;font-weight:600;font-size:13px;margin-bottom:10px">Sugestões de melhoria</div>${
      topMel.length?`<ul class="melhorias">${topMel.map(([m,n])=>`<li>${esc(m)}${n>1?` <span class="sub">(${n}×)</span>`:""}</li>`).join("")}</ul>`:'<div class="sub">Sem sugestões registradas no período.</div>'
    }</div>
  </div></section>`;
  d.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>openColaborador(b.dataset.col));
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

const tipoTxt={dialogo:"Diálogo",documentos:"Envio de documentos",transferencia:"Transferência",outro:"Outro"};
function transcriptHTML(t,nomeAt,nomeCl){ if(!t) return '<div class="sub">Sem transcrição.</div>';
  const msgs=[];
  t.split("\n").forEach(l=>{
    const m=l.match(/^(?:\[([^\]]+)\]\s*)?(ATENDENTE|CLIENTE):\s?([\s\S]*)$/);
    if(m){ const who=m[2]==="ATENDENTE"?"at":"cl";
      const nome=m[2]==="ATENDENTE"?(nomeAt||"Atendente"):(nomeCl&&nomeCl!=="—"?nomeCl:"Cliente");
      msgs.push({who,when:m[1]||"",nome,texto:m[3]});
    } else if(l.trim()){
      // linha sem prefixo = continuação da mensagem anterior (mesmo remetente)
      if(msgs.length) msgs[msgs.length-1].texto += "\n"+l;
      else msgs.push({who:"cl",when:"",nome:(nomeCl&&nomeCl!=="—"?nomeCl:"Cliente"),texto:l});
    }
  });
  return msgs.map(mo=>{ const when=mo.when?`<span class="when">${esc(mo.when)}</span>`:"";
    return `<div class="msg ${mo.who}"><span class="who">${esc(mo.nome)}${when}</span>${esc(mo.texto)}</div>`; }).join("");
}

// ---------- PDF da avaliação ----------
async function baixarAvaliacaoPDF(i,btn){
  const a=ATEND[i];
  if(typeof html2pdf==="undefined"){ alert("Gerador de PDF ainda carregando. Tente de novo em instantes."); return; }
  if(btn){ btn.disabled=true; btn.style.opacity=".5"; }
  await ensureTranscript(a);
  const H="#1a1b28", M="#83879c", B="#e7e9f2", AC="#006789", GD="#128a5b", WN="#b7791f", CR="#cf4257";
  const notaCor = n => n===null?M:(n>=8?GD:(n>=6?WN:CR));

function colaboradorReport(key){
  const list=ATEND.filter(a=>(a.atendente_id||a.atendente)===key);
  if(!list.length) return null;
  const nome=list[0].atendente, setor=list[0].setor;
  const ms=[...new Set(list.map(a=>{const d=new Date(a.ts);return d.getFullYear()+"|"+d.getMonth();}))].map(k=>{const[y,m]=k.split("|").map(Number);return{ano:y,mes:m};}).sort((a,b)=>a.ano-b.ano||a.mes-b.mes);
  const per=ms[ms.length-1]||{ano:new Date().getFullYear(),mes:new Date().getMonth()};
  const mIni=new Date(per.ano,per.mes,1).getTime(), mFim=new Date(per.ano,per.mes+1,0,23,59,59).getTime();
  const mesList=list.filter(a=>a.ts>=mIni&&a.ts<=mFim);
  const semanas=semanasDoMes(per.ano,per.mes).map(s=>{ const wl=mesList.filter(a=>a.ts>=s.ini&&a.ts<=s.fim); return {...s,list:wl,ag:aggList(wl)}; }).filter(s=>s.ag.n>0);
  semanas.forEach((s,i)=>{ if(i===0){s.trend="flat";} else { const prev=semanas[i-1].ag.media, cur=s.ag.media; s.trend=(prev===null||cur===null)?"flat":(cur>prev+0.1?"up":(cur<prev-0.1?"down":"flat")); } });
  const comData=semanas.filter(s=>s.ag.media!==null);
  let evol=null;
  if(comData.length>=2){ const a0=comData[0].ag.media, a1=comData[comData.length-1].ag.media; const delta=a1-a0;
    evol={de:a0,para:a1,delta,pct:a0?delta/a0*100:0,dir:delta>0.05?"up":(delta<-0.05?"down":"flat")}; }
  const st=aggList(mesList);
  const teamList=ATEND.filter(a=>(a.setor||"—")===setor && a.ts>=mIni && a.ts<=mFim);
  const teamAg=aggList(teamList);
  const teamColabs=new Set(teamList.filter(a=>!semAtendente(a)).map(a=>a.atendente_id||a.atendente)).size;
  const partic=teamAg.n?st.n/teamAg.n*100:0;
  const difMedia=(st.media!==null&&teamAg.media!==null)?st.media-teamAg.media:null;
  const difPct=(st.pctAc!==null&&teamAg.pctAc!==null)?st.pctAc-teamAg.pctAc:null;
  const mesComp=mesList.filter(okNota); const rM=avg(mesComp.map(a=>a.r.v)), raM=avg(mesComp.map(a=>a.ra.v)), sM=avg(mesComp.map(a=>a.s.v)), adM=avg(mesComp.map(a=>a.aderencia.v));
  const forcas=[];
  if(rM!==null&&rM>=8.5) forcas.push(`Excelência na resolução, com média ${fmt1(rM)} nesse eixo.`);
  if(raM!==null&&raM>=8.5) forcas.push(`Respostas rápidas e dentro do prazo, média ${fmt1(raM)} em rapidez.`);
  if(sM!==null&&sM>=8.5) forcas.push(`Clientes satisfeitos ao final, média ${fmt1(sM)} em satisfação.`);
  if(adM!==null&&adM>=8) forcas.push(`Forte aderência ao jeito Resilcon de atender, média ${fmt1(adM)}.`);
  if(st.pctAc!==null&&st.pctAc>=85) forcas.push(`Consistência: ${Math.round(st.pctAc)}% das notas ficaram acima de 7.`);
  if(!forcas.length){ const eixos=[["resolução",rM],["rapidez",raM],["satisfação",sM]].filter(e=>e[1]!==null).sort((a,b)=>b[1]-a[1]);
    if(eixos[0]) forcas.push(`Melhor desempenho em ${eixos[0][0]}, média ${fmt1(eixos[0][1])}.`); else forcas.push("Sem destaque de desempenho no período."); }
  const melMap=new Map(); mesList.forEach(a=>a.melhorias.forEach(m=>{ if(!melMap.has(m))melMap.set(m,a.ticket_id); }));
  const melhorias=[...melMap.entries()].slice(0,4).map(([m,tk])=>({texto:m,ticket:tk}));
  const baixas=mesList.filter(a=>okNota(a)&&a.nota<7).sort((a,b)=>a.nota-b.nota).slice(0,3)
    .map(a=>({cliente:a.cliente,motivo:(a.erros[0]||a.melhorias[0]||a.assunto||"atendimento abaixo do esperado"),ticket:a.ticket_id,nota:a.nota}));
  const errMap=new Map(); mesList.forEach(a=>a.erros.forEach(e=>errMap.set(e,(errMap.get(e)||0)+1)));
  const topErr=[...errMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  const analise=`${nome} teve média ${fmt1(st.media)} em ${st.n} atendimento(s), com ${st.pctAc===null?"—":Math.round(st.pctAc)+"%"} das avaliações acima de 7.${(st.pctAb&&st.pctAb>0)?` ${Math.round(st.pctAb)}% ficaram abaixo de 7${topErr.length?", com atenção em "+topErr.join(" e "):""}.`:""}`;
  const plano=[]; melhorias.slice(0,3).forEach(m=>plano.push(m.texto));
  if(evol&&evol.dir==="down") plano.push("Acompanhar de perto a queda entre as semanas e retomar o padrão das primeiras.");
  if(!plano.length) plano.push("Manter o padrão de atendimento e acompanhar os indicadores semana a semana.");
  return {key,nome,setor,per,mIni,mFim,mesList,semanas,evol,st,teamAg,teamColabs,partic,difMedia,difPct,rM,raM,sM,adM,forcas,melhorias,baixas,analise,plano};
}

function avg(arr){ const v=arr.filter(x=>x!==null&&!isNaN(x)); return v.length?v.reduce((s,n)=>s+n,0)/v.length:null; }

        <select id="empSel" class="inp" size="8" style="width:100%;max-width:none">${opts.map(o=>`<option value="${o.id}">${esc(o.nome)} — ${esc(fmtCnpj(o.cnpj))}</option>`).join("")}</select>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-line" data-close>Cancelar</button><button class="btn-primary" id="salvarVinc">Vincular</button></div>
      <div class="sub" id="vincMsg" style="text-align:right"></div>
    </div>`);
  const sel=modal.querySelector("#empSel"), search=modal.querySelector("#empSearch");
  search.oninput=()=>{ const f=search.value.trim().toLowerCase();
    [...sel.options].forEach(o=>{ o.hidden=f&&!o.text.toLowerCase().includes(f); }); };
  modal.querySelector("#salvarVinc").onclick=async()=>{
    const empId=sel.value; if(!empId){ modal.querySelector("#vincMsg").textContent="Selecione uma empresa."; return; }

  };
}

let contestMotivo=null;
function openContestar(i){
  const a=ATEND[i]; contestMotivo=null;
  openModal(`
    <div class="modal-head"><div class="mh-l"><div class="m-sub num">${a.data} · ${esc(a.cliente)}</div><h3>Contestar avaliação</h3><div class="m-chips"><span class="m-chip">${esc(a.assunto)}</span><span class="m-chip">Nota ${fmt1(a.nota)}</span></div></div>
      <button class="close-x" data-close><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body">
      <div class="panel"><h4>Motivo da contestação</h4><div class="opt-grid">
        <div class="opt" data-m="erro_cliente"><div class="ot">O erro foi do cliente</div><div class="os">O cliente causou o problema apontado</div></div>
        <div class="opt" data-m="ia_errou"><div class="ot">A IA avaliou errado</div><div class="os">A análise não condiz com o atendimento</div></div>
      </div></div>
      <div class="panel"><h4>Explicação</h4><textarea class="inp" id="ctText" placeholder="Explique o que aconteceu e por que a nota deve ser revista..."></textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-line" data-close>Cancelar</button><button class="btn-primary" id="ctSend">Enviar contestação</button></div>
      <div class="sub" id="ctMsg" style="text-align:right"></div>
    </div>`);
  modal.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ modal.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); contestMotivo=o.dataset.m; });
  modal.querySelector("#ctSend").onclick=async()=>{
    const texto=modal.querySelector("#ctText").value.trim();
    if(!contestMotivo){ modal.querySelector("#ctMsg").textContent="Escolha o motivo."; return; }
    if(!texto){ modal.querySelector("#ctMsg").textContent="Escreva a explicação."; return; }
    const btn=modal.querySelector("#ctSend"); btn.disabled=true; btn.textContent="Enviando...";
    const row={ atendimento_id:a.id, ticket_id:a.ticket_id, atendente_id:a.atendente_id, motivo:contestMotivo, texto, status:"pendente", criado_por:ME };
    const { data, error } = await sb.schema("atendimentos").from("contestacoes").insert(row).select();
    if(error){ modal.querySelector("#ctMsg").textContent="Erro: "+error.message; btn.disabled=false; btn.textContent="Enviar contestação"; return; }
    CONTESTS[a.id]=(data&&data[0])||row; closeModal(); render();
  };
}

async function removeDepSetor(dep,setor){ try{ await sb.schema("atendimentos").from("departamento_setores").delete().eq("departamento",dep).eq("setor",setor); return true; }catch(e){ alert("Não consegui remover: "+(e.message||e)); return false; } }

async function salvarAtdDep(atId,dep){ try{
  if(!dep){ await sb.schema("atendimentos").from("atendente_departamento").delete().eq("atendente_id",String(atId)); delete ATDMAP[String(atId)]; ATDDEP=ATDDEP.filter(x=>String(x.atendente_id)!==String(atId)); }
  else{ await sb.schema("atendimentos").from("atendente_departamento").upsert({atendente_id:String(atId),departamento:dep},{onConflict:"atendente_id"}); ATDMAP[String(atId)]=dep; const e=ATDDEP.find(x=>String(x.atendente_id)===String(atId)); if(e)e.departamento=dep; else ATDDEP.push({atendente_id:String(atId),departamento:dep}); }
  return true;
}catch(e){ console.warn(e); alert("Não consegui salvar. Rodou o SQL de atendente_departamento no Supabase?"); return false; } }
async function setGestorDep(dep,email){
  email=(email||"").trim().toLowerCase();
  const t=email?ACESSOS.find(a=>(a.email||"").toLowerCase()===email):null;
  if(t&&t.nivel==="admin"){ alert("Esse e-mail é admin e já enxerga tudo. Escolha outra pessoa como gestor."); return false; }
  // tira o departamento dos gestores atuais (um gestor por departamento)
  for(const a of ACESSOS){ if(a.nivel==="gestor" && (a.departamentos||[]).includes(dep) && (a.email||"").toLowerCase()!==email){
    const nd=(a.departamentos||[]).filter(d=>d!==dep);
    if(!(await salvarAcesso({email:a.email,nivel:"gestor",departamentos:nd,permissoes:a.permissoes||[]}))) return false;
    a.departamentos=nd; } }
  if(email){ const nd=[...new Set([...((t&&t.departamentos)||[]),dep])];
    if(!(await salvarAcesso({email,nivel:"gestor",departamentos:nd,permissoes:(t&&t.permissoes)||[]}))) return false;
    if(t){ t.nivel="gestor"; t.departamentos=nd; } else ACESSOS.push({email,nivel:"gestor",departamentos:nd,permissoes:[]});
    if(email===(ME||"").toLowerCase()) ACCESS={email,nivel:"gestor",departamentos:nd,permissoes:(t&&t.permissoes)||[]};
  }
  return true;
}

function openAcessoModal(ac){
  const novo=!ac; ac=ac||{email:"",nivel:"gestor",departamentos:[],permissoes:[]};
  const deps=new Set(ac.departamentos||[]); const perms=new Set(ac.permissoes||[]);
  openModal(`
    <div class="modal-head"><div class="mh-l"><div class="m-sub">CONTROLE DE ACESSO</div><h3>${novo?"Novo acesso":"Editar acesso"}</h3></div>
      <button class="close-x" data-close><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

        <div class="seg" id="acNivel"><button data-n="admin" class="${ac.nivel==='admin'?'on':''}">Admin</button><button data-n="gestor" class="${ac.nivel==='gestor'?'on':''}">Gestor</button><button data-n="colaborador" class="${ac.nivel==='colaborador'?'on':''}">Colaborador</button></div>
        <div class="sub" style="margin-top:6px">Admin vê tudo e controla os acessos. Gestor vê só os departamentos marcados abaixo. Colaborador não usa este painel.</div></div>
      <div class="panel" id="acDepsPanel"><h4>Departamentos que enxerga (gestor)</h4><div class="tag-pick">${DEPARTAMENTOS.map(d=>`<button class="tag-opt ${deps.has(d)?'on':''}" data-dep="${escAttr(d)}">${esc(d)}</button>`).join("")}</div></div>
      <div class="panel"><h4>Módulos extras</h4><div class="tag-pick">${MODULOS.map(m=>`<button class="tag-opt ${perms.has(m[0])?'on':''}" data-perm="${escAttr(m[0])}">${esc(m[1])}</button>`).join("")}</div>
        <div class="sub" style="margin-top:6px">Libera abas específicas por e-mail, tipo Financeiro pra Luana e Comercial pra Camila.</div></div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-line" data-close>Cancelar</button><button class="btn-primary" id="acSalvar">Salvar</button></div>
    </div>`);
  let nivel=ac.nivel;
  const syncDeps=()=>{ const p=modal.querySelector("#acDepsPanel"); if(p) p.style.opacity=(nivel==="gestor")?"1":".45"; };
  syncDeps();
  modal.querySelectorAll("#acNivel [data-n]").forEach(b=>b.onclick=()=>{ nivel=b.dataset.n; modal.querySelectorAll("#acNivel [data-n]").forEach(x=>x.classList.toggle("on",x===b)); syncDeps(); });
  modal.querySelectorAll("[data-dep]").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
  modal.querySelectorAll("[data-perm]").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
  modal.querySelector("#acSalvar").onclick=async()=>{
    const email=modal.querySelector("#acEmail").value.trim().toLowerCase();
    if(!email){ alert("Informe o e-mail."); return; }
    const departamentos=[...modal.querySelectorAll("[data-dep].on")].map(x=>x.dataset.dep);
    const permissoes=[...modal.querySelectorAll("[data-perm].on")].map(x=>x.dataset.perm);
    const row={email,nivel,departamentos:(nivel==="gestor"?departamentos:[]),permissoes};
    if(await salvarAcesso(row)){
      const i=ACESSOS.findIndex(a=>(a.email||"").toLowerCase()===email);
      if(i>=0) ACESSOS[i]={...ACESSOS[i],...row}; else ACESSOS.push(row);
      if(email===(ME||"").toLowerCase()){ ACCESS={email,nivel:row.nivel,departamentos:row.departamentos,permissoes:row.permissoes}; }
      closeModal(); viewAdmin(document.getElementById("view"));
    }
  };
}

  const F = "font-family:'Open Sans',Arial,Helvetica,sans-serif;";
