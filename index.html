  const logo = (tipo, largura) => `<img src="${LOGO}${tipo}" width="${largura}" height="${Math.round(largura * 155 / 600)}" alt="Resilcon Contabilidade Consultiva" style="display:block;border:0;outline:none;width:${largura}px;max-width:100%;height:auto;${F}font-size:16px;font-weight:800;letter-spacing:3px;color:${tipo === 'branco' ? '#FFFFFF' : AZUL};">`;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const preencher = (t, d) => String(t ?? '').replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => (d[k] === undefined || d[k] === null ? '' : String(d[k])));
  const rico = (t, cor) => esc(t).replace(/\*\*(.+?)\*\*/g, `<strong style="color:${cor || PRETO};">$1</strong>`).replace(/\n/g, '<br>');
  const temLink = (l) => /^https?:\/\//.test(String(l || '').trim());

  function botao(txt, link, tipo) {
    if (!txt || !temLink(link)) return '';
    const cheio = tipo !== 'contorno' && tipo !== 'contorno_branco';
    const cor = tipo === 'contorno_branco' ? '#FFFFFF' : (cheio ? '#FFFFFF' : PRETO);
    const borda = tipo === 'contorno_branco' ? '#FFFFFF' : (cheio ? AZUL : PRETO);
    return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:6px auto 0;"><tr>`
      + `<td align="center" bgcolor="${cheio ? AZUL : ''}" style="${cheio ? `background:${AZUL};` : ''}border:2px solid ${borda};border-radius:4px;">`
      + `<a href="${esc(link)}" target="_blank" style="display:inline-block;padding:13px 28px;${F}font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:${cor};text-decoration:none;">${esc(txt)}</a>`
      + `</td></tr></table>`;
  }
  const divisor = (cor) => `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:16px auto 22px;"><tr><td width="70" height="2" style="background:${cor || AZUL};font-size:0;line-height:0;">&nbsp;</td></tr></table>`;
  const titulo = (t, cor) => t ? `<h2 style="margin:0;${F}font-size:24px;line-height:32px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:${cor || PRETO};text-align:center;">${esc(t)}</h2>${divisor(cor === '#FFFFFF' ? '#FFFFFF' : AZUL)}` : '';
  const paragrafos = (t, cor, alinhar) => String(t || '').split(/\n\s*\n/).filter((p) => p.trim())
    .map((p) => `<p style="margin:0 0 14px;${F}font-size:15px;line-height:25px;color:${cor || TEXTO};text-align:${alinhar || 'left'};">${rico(p.trim(), cor === '#FFFFFF' ? '#FFFFFF' : PRETO)}</p>`).join('');
  const secao = (fundo, conteudo, pad) => `<tr><td bgcolor="${fundo}" style="background:${fundo};padding:${pad || '44px 40px'};" class="pad">${conteudo}</td></tr>`;

  function bloco(b, f) {
    const tx = (k) => f(b[k]);
    switch (b.tipo) {
      case 'texto': return secao(b.fundo === 'claro' ? CLARO : '#FFFFFF', titulo(tx('titulo')) + paragrafos(tx('texto'), TEXTO, b.centro ? 'center' : 'left') + botao(tx('botao_texto'), tx('botao_link'), b.botao_estilo));
      case 'faixa': return secao(AZUL, titulo(tx('titulo'), '#FFFFFF') + paragrafos(tx('texto'), '#FFFFFF', 'center') + botao(tx('botao_texto'), tx('botao_link'), 'contorno_branco'));
      case 'citacao': return `<tr><td bgcolor="${AZUL}" style="background:${AZUL};height:6px;font-size:0;line-height:0;">&nbsp;</td></tr>`
        + secao(GRAFITE, `<p style="margin:0;${F}font-size:22px;line-height:32px;font-weight:700;color:#FFFFFF;text-align:center;">&ldquo;${rico(tx('texto'), '#FFFFFF')}&rdquo;</p>`
          + (b.autor ? `<p style="margin:14px 0 0;${F}font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#9FC6D3;text-align:center;">${esc(tx('autor'))}</p>` : ''));
      case 'cards': {
        const itens = (b.itens || []).map((it) => `<div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:${(b.itens || []).length >= 3 ? 170 : 255}px;margin:0 8px 18px;text-align:left;">`
          + `<div style="${F}font-size:28px;font-weight:800;color:${AZUL};line-height:30px;margin-bottom:8px;">${esc(f(it.icone || ''))}</div>`
          + `<div style="${F}font-size:16px;line-height:22px;font-weight:700;color:${PRETO};margin-bottom:6px;">${esc(f(it.titulo))}</div>`
          + `<div style="${F}font-size:14px;line-height:22px;color:${CINZA};">${rico(f(it.texto), PRETO)}</div></div>`).join('');
        return secao(b.fundo === 'claro' ? CLARO : '#FFFFFF', titulo(tx('titulo')) + (b.texto ? paragrafos(tx('texto'), CINZA, 'center') : '') + `<div style="text-align:center;font-size:0;">${itens}</div>` + botao(tx('botao_texto'), tx('botao_link'), b.botao_estilo));
      }
      case 'numeros': {
        const itens = (b.itens || []).map((it) => `<div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:170px;margin:0 8px 16px;text-align:center;">`
          + `<div style="${F}font-size:30px;line-height:36px;font-weight:800;color:${AZUL};">${esc(f(it.valor))}</div>`
          + `<div style="${F}font-size:13px;line-height:19px;color:${CINZA};">${esc(f(it.legenda))}</div></div>`).join('');
        return secao(b.fundo === 'claro' ? CLARO : '#FFFFFF', titulo(tx('titulo')) + `<div style="text-align:center;font-size:0;">${itens}</div>` + (b.texto ? paragrafos(tx('texto'), CINZA, 'center') : ''));
      }
      case 'passos': {
        const itens = (b.itens || []).map((it, i) => `<tr><td width="44" valign="top" style="padding:0 14px 18px 0;"><div style="width:34px;height:34px;line-height:34px;border-radius:50%;background:${AZUL};${F}font-size:15px;font-weight:800;color:#FFFFFF;text-align:center;">${i + 1}</div></td>`
          + `<td valign="top" style="padding:0 0 18px;"><div style="${F}font-size:16px;line-height:22px;font-weight:700;color:${PRETO};">${esc(f(it.titulo))}</div><div style="${F}font-size:14px;line-height:22px;color:${CINZA};margin-top:3px;">${rico(f(it.texto), PRETO)}</div></td></tr>`).join('');
        return secao(b.fundo === 'claro' ? CLARO : '#FFFFFF', titulo(tx('titulo')) + `<table role="presentation" width="100%" cellpadding="0" cellspacing="0">${itens}</table>` + botao(tx('botao_texto'), tx('botao_link'), b.botao_estilo));
      }
      case 'destaque': return secao('#FFFFFF', `<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-left:4px solid ${AZUL};background:${CLARO};padding:18px 22px;${F}font-size:15px;line-height:24px;color:${TEXTO};">${rico(tx('texto'))}</td></tr></table>`, '0 40px 30px');
      default: return '';
    }
  }

  function cabecalho(hero, f) {
    const kicker = f(hero.kicker), t1 = f(hero.titulo_azul), t2 = f(hero.titulo), sub = f(hero.subtitulo);
    return `<tr><td bgcolor="${PRETO}" style="background:${PRETO};padding:34px 40px 46px;text-align:center;" class="pad">`
      + `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td align="center">${logo('branco', 200)}</td></tr></table>`
      + `<div style="height:38px;line-height:38px;font-size:0;">&nbsp;</div>`
      + (kicker ? `<div style="display:inline-block;border:2px solid #FFFFFF;padding:8px 16px;${F}font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FFFFFF;margin-bottom:22px;">${esc(kicker)}</div>` : '')
      + `<h1 style="margin:0;${F}font-size:34px;line-height:42px;font-weight:300;letter-spacing:.5px;color:#FFFFFF;">${t1 ? `<span style="color:#3FA9C9;font-weight:300;">${esc(t1)}</span> ` : ''}<strong style="font-weight:800;">${esc(t2)}</strong></h1>`
      + (sub ? `<p style="margin:18px auto 0;max-width:480px;${F}font-size:16px;line-height:25px;color:#C9D2D4;">${rico(sub, '#FFFFFF')}</p>` : '')
      + (hero.botao_texto ? `<div style="height:26px;font-size:0;">&nbsp;</div>` + botao(f(hero.botao_texto), f(hero.botao_link)) : '')
      + `</td></tr>`;
  }

  // m: modelo; d: dados já mesclados; opcoes: { link_descadastro }
  function montar(m, dadosIn, opcoes) {
    const d = Object.assign({}, m.padroes || {});
    for (const [k, v] of Object.entries(dadosIn || {})) if (v !== null && v !== undefined && v !== '') d[k] = v;
    const f = (t) => preencher(t, d);
    const estilo = m.estilo || (m.layout === 'sistema' ? 'sistema' : 'marketing');
    const linkSair = (opcoes && opcoes.link_descadastro) || '';
    const previa = f(m.previa).trim();
    const saud = m.saudacao !== undefined ? f(m.saudacao) : (d.nome ? `Olá, ${d.nome}!` : 'Olá!');
    let corpo = '';

    if (estilo === 'carta') {
      const assinatura = f(m.assinatura || '{{consultor}}\nResilcon Contabilidade Consultiva\nWhatsApp (11) 97414-4223');
      const [nomeAss, ...resto] = assinatura.split('\n');
      corpo = `<tr><td style="padding:26px 40px 18px;border-bottom:3px solid ${AZUL};" class="pad">${logo('cor', 170)}</td></tr>`
        + `<tr><td style="padding:30px 40px 10px;" class="pad">`
        + (saud ? `<p style="margin:0 0 16px;${F}font-size:15px;line-height:25px;color:${TEXTO};">${esc(saud)}</p>` : '')
        + paragrafos(f(m.texto), TEXTO)
        + (m.destaque ? `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:4px 0 18px;"><tr><td style="border-left:4px solid ${AZUL};background:${CLARO};padding:14px 18px;${F}font-size:15px;line-height:24px;color:${TEXTO};">${rico(f(m.destaque))}</td></tr></table>` : '')
        + (m.botao && temLink(f(m.botao[1])) ? `<p style="margin:6px 0 20px;"><a href="${esc(f(m.botao[1]))}" target="_blank" style="display:inline-block;background:${AZUL};border-radius:4px;padding:12px 24px;${F}font-size:14px;font-weight:700;color:#FFFFFF;text-decoration:none;">${esc(f(m.botao[0]))}</a></p>` : '')
        + `<p style="margin:18px 0 0;${F}font-size:15px;line-height:23px;color:${TEXTO};">${esc(f(m.despedida || 'Um abraço,'))}</p>`
        + `<p style="margin:6px 0 28px;${F}font-size:14px;line-height:21px;color:${CINZA};"><strong style="color:${PRETO};font-size:15px;">${esc(nomeAss)}</strong>${resto.length ? '<br>' + resto.map(esc).join('<br>') : ''}</p>`
        + `</td></tr>`;
    } else if (estilo === 'sistema') {
      corpo = `<tr><td bgcolor="${PRETO}" style="background:${PRETO};padding:20px 40px;" class="pad">${logo('branco', 150)}</td></tr>`
        + `<tr><td style="padding:30px 40px 24px;" class="pad">`
        + (m.etiqueta ? `<div style="${F}font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${AZUL};margin-bottom:8px;">${esc(f(m.etiqueta))}</div>` : '')
        + `<h1 style="margin:0 0 16px;${F}font-size:22px;line-height:30px;font-weight:800;color:${PRETO};">${esc(f(m.titulo))}</h1>`
        + paragrafos(f(m.texto), TEXTO)
        + (m.destaque ? `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:4px 0 16px;"><tr><td style="border-left:4px solid ${AZUL};background:${CLARO};padding:14px 18px;${F}font-size:15px;line-height:24px;color:${TEXTO};">${rico(f(m.destaque))}</td></tr></table>` : '')
        + (m.botao ? botao(f(m.botao[0]), f(m.botao[1])) : '') + `</td></tr>`;
    } else {
      const hero = m.hero || { kicker: m.etiqueta, titulo: m.titulo };
      corpo = cabecalho(hero, f);
      if (m.secoes && m.secoes.length) {
        const abertura = saud ? `<p style="margin:0 0 14px;${F}font-size:16px;line-height:25px;font-weight:700;color:${PRETO};">${esc(saud)}</p>` : '';
        let primeira = true;
        for (const b of m.secoes) {
          if (b.se && !d[b.se]) continue;
          if (b.se_nao && d[b.se_nao]) continue;
          if (primeira && b.tipo === 'texto') { corpo += secao(b.fundo === 'claro' ? CLARO : '#FFFFFF', titulo(f(b.titulo)) + abertura + paragrafos(f(b.texto)) + botao(f(b.botao_texto), f(b.botao_link), b.botao_estilo)); primeira = false; continue; }
          primeira = false; corpo += bloco(b, f);
        }
      } else {
        // modelos antigos (texto, destaque, botao) no visual novo
        corpo += secao('#FFFFFF', `<p style="margin:0 0 14px;${F}font-size:16px;line-height:25px;font-weight:700;color:${PRETO};">${esc(saud)}</p>` + paragrafos(f(m.texto))
          + (m.destaque ? `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:4px 0 18px;"><tr><td style="border-left:4px solid ${AZUL};background:${CLARO};padding:14px 18px;${F}font-size:15px;line-height:24px;color:${TEXTO};">${rico(f(m.destaque))}</td></tr></table>` : '')
          + (m.botao ? botao(f(m.botao[0]), f(m.botao[1])) : ''));
      }
      corpo += `<tr><td style="padding:28px 40px 36px;" class="pad"><p style="margin:0;${F}font-size:14px;line-height:22px;color:${CINZA};">Um abraço,<br><strong style="color:${PRETO};">${esc(f(m.assinatura_mkt || 'Equipe Resilcon'))}</strong></p></td></tr>`;
    }

    const rodape = estilo === 'sistema'
      ? `Aviso automático da Central de E-mails Resilcon.`
      : `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 12px;"><tr><td align="center">${logo('branco', 140)}</td></tr></table>Contabilidade consultiva em São Paulo<br><a href="https://wa.me/5511974144223" style="color:#9FC6D3;text-decoration:none;">WhatsApp (11) 97414-4223</a> &nbsp;·&nbsp; <a href="https://resilcon.com.br" style="color:#9FC6D3;text-decoration:none;">resilcon.com.br</a>`
        + (linkSair ? `<br><br><span style="color:#8C9799;">Você recebe este e-mail porque tem relacionamento com a Resilcon ou se cadastrou para receber nossos conteúdos.</span> <a href="${esc(linkSair)}" style="color:#FFFFFF;text-decoration:underline;">Não quero mais receber</a>` : '');
    const tituloDoc = esc(f(m.assunto));
    const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="x-apple-disable-message-reformatting">`
      + `<title>${tituloDoc}</title><link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700,800" rel="stylesheet">`
      + `<style>body{margin:0;padding:0}a{text-decoration:none}@media only screen and (max-width:620px){.pad{padding-left:22px!important;padding-right:22px!important}.col{max-width:100%!important;margin:0 0 18px!important}h1{font-size:27px!important;line-height:34px!important}}</style></head>`
      + `<body style="margin:0;padding:0;background:#EDEFF0;">`
      + (previa ? `<div style="display:none;max-height:0;overflow:hidden;opacity:0;">${esc(previa)}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>` : '')
      + `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EDEFF0" style="background:#EDEFF0;"><tr><td align="center" style="padding:24px 10px;">`
      + `<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;background:#FFFFFF;">`
      + corpo
      + `<tr><td bgcolor="${PRETO}" style="background:${PRETO};padding:28px 40px;text-align:center;${F}font-size:12px;line-height:20px;color:#AEB7B9;" class="pad">${rodape}</td></tr>`
      + `</table></td></tr></table></body></html>`;
    return { assunto: f(m.assunto).replace(/\s+/g, ' ').trim(), html, estilo };
  }
  return { montar, esc };
})();

// Envio de teste de uma régua: manda os e-mails na hora para um endereço, sem inscrever ninguém
function ceTesteModal(chave){
 const lista=(CE_CACHE.reguas&&CE_CACHE.reguas.lista)||CE_CACHE.reguas||[];
 const r=(Array.isArray(lista)?lista:[]).find(x=>x.chave===chave)||{chave,nome:chave,passos:[]};
 const mods=(r.passos||[]).filter(p=>p.t==="email").map(p=>(p.c||{}).modelo).filter(Boolean);
 const tit=m=>(CE_ASSUNTOS[m]||m).replace(/\{\{\s*(\w+)\s*\}\}/g,(_,k)=>"["+k.replace(/_/g," ")+"]");
 const m=crmModal("Central de E-mails · teste","Enviar teste: "+r.nome,"",`
  <div class="ce-note">${CE_ICO.alert}<span>O teste sai na hora, sem esperar os intervalos da régua e sem inscrever ninguém. Enquanto a conta da Amazon estiver em modo de teste, o endereço precisa estar verificado no SES.</span></div>
  <div class="crm-form" style="margin-top:12px">
   <label class="crm-f"><span>E-mail que vai receber</span><input class="inp" id="ceTeEmail" type="email" value="${escAttr(typeof ME==="string"?ME:"")}"></label>
   <label class="crm-f"><span>Nome para preencher o e-mail (opcional)</span><input class="inp" id="ceTeNome" placeholder="Usa o nome do cadastro, se houver"></label>
   <label class="crm-f"><span>Quais e-mails</span><select class="inp" id="ceTeMod"><option value="">Todos os ${mods.length} e-mails da régua</option>${mods.map((x,i)=>`<option value="${escAttr(x)}">${i+1}. ${esc(tit(x))}</option>`).join("")}</select></label>
  </div>
  <div class="crm-pe" style="margin-top:12px"><span style="flex:1"></span><button class="view-btn ce-pri" id="ceTeOk">Enviar teste</button></div>`);
 m.querySelector("#ceTeOk").onclick=async ev=>{ const b=ev.currentTarget; const email=m.querySelector("#ceTeEmail").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ ceAviso2("Informe um e-mail válido."); return; }
  b.disabled=true; b.textContent="Enviando…";
  const {data,error}=await sb.rpc("ce_enviar_teste",{p_chave:chave,p_email:email,p_nome:m.querySelector("#ceTeNome").value.trim()||null,p_modelo:m.querySelector("#ceTeMod").value||null});
  if(error){ b.disabled=false; b.textContent="Enviar teste"; ceAviso2(ceErroTxt(error)); return; }
  closeModal(); ceAviso2(`${data} e-mail${data===1?"":"s"} de teste a caminho de ${email}. Acompanhe em Envios.`); delete CE_CACHE.envios; };
}

function crmLigarLinha(root,recarregar){
 const c=root.querySelector(".crm-comp"); if(!c) return; let tipo="nota", arquivo=null;

 c.querySelector("[data-registrar]").onclick=async ev=>{ const b=ev.currentTarget; const texto=c.querySelector("textarea").value.trim(); if(!texto&&!arquivo){ crmToast("Escreva o registro ou anexe um arquivo."); return; }
  b.disabled=true; b.textContent="Salvando…";
  try{ const alvo=JSON.parse(c.dataset.alvo); let path=null;
   if(arquivo){ if(arquivo.size>20*1024*1024) throw new Error("O arquivo passa de 20 MB.");
    path=`${new Date().getFullYear()}/${Date.now()}-${arquivo.name.normalize("NFD").replace(/[^\w.\-]+/g,"_")}`;
    const {error}=await sb.storage.from("crm-arquivos").upload(path,arquivo); if(error) throw error; }
   await crmRpc("crm_atividade",{p:{...alvo,tipo:(arquivo&&!texto)?"arquivo":tipo,texto,arquivo_path:path,arquivo_nome:arquivo?arquivo.name:null}});
   crmToast("Registrado"); recarregar();
  }catch(e){ crmToast(crmErro(e)); b.disabled=false; b.textContent="Registrar"; } };
 root.querySelectorAll("[data-arq]").forEach(b=>b.onclick=async()=>{ const {data,error}=await sb.storage.from("crm-arquivos").createSignedUrl(b.dataset.arq,120); if(error){ crmToast("Não consegui abrir o arquivo."); return; } window.open(data.signedUrl,"_blank","noopener"); });
 root.querySelectorAll("[data-apagar-ativ]").forEach(b=>b.onclick=async()=>{ if(b.dataset.ok!=="1"){ b.dataset.ok="1"; b.textContent="Apagar?"; b.classList.add("on"); setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=""; b.textContent="✕"; b.classList.remove("on"); } },3500); return; }
  try{ await crmRpc("crm_excluir",{p_tipo:"atividade",p_id:b.dataset.apagarAtiv}); recarregar(); }catch(e){ crmToast(crmErro(e)); } });
}

  f=r[0]; tars=r[1]||[]; ks=r[2]||[]; }catch(e){ crmToast(crmErro(e)); return; }
 const fase=(f.fase&&f.fase.fase)||"retencao";
 const m=crmModal(`Cliente G-Click · ${esc(fmtCnpj(emp.cnpj))}`,emp.apelido||emp.nome||"Cliente",crmChip(CRM_FASE_TXT[fase])+((f.indicacoes||[]).length?crmChip(`${f.indicacoes.length} indicação(ões)`):""),`<div class="crm-2col"><div class="crm-colform">${crmContratosPainel(ks,{gclick_empresa_id:gid,cnpj:emp.cnpj,cliente_nome:emp.apelido||emp.nome})}

 ["cnpj","CNPJ",/cnpj/i],["cargo","Cargo",/(cargo|fun[cç][aã]o|title)/i],["segmento","Segmento",/(segmento|ramo|setor|atividade)/i],["cidade","Cidade",/(cidade|munic|city)/i],["uf","UF",/^(uf|estado)$/i],["obs","Observações",/(obs|nota|coment)/i]];
function crmCsv(txt){ txt=txt.replace(/^﻿/,""); const pl=txt.split(/\r?\n/)[0]||""; const sep=(pl.match(/;/g)||[]).length>(pl.match(/,/g)||[]).length?";":(pl.includes("\t")?"\t":",");
 const rows=[]; let row=[],cur="",q=false;
 for(let i=0;i<txt.length;i++){ const ch=txt[i];
  if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
  else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&txt[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=ch; }
 if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>String(c).trim())); }
function crmXlsxLib(){ if(window.XLSX) return Promise.resolve(); return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=ok; s.onerror=()=>err(new Error("Não consegui carregar o leitor de Excel. Salve a planilha como CSV e tente de novo.")); document.head.appendChild(s); }); }

 const montar=()=>CRMIMP.linhas.map(r=>{ const o={}; Object.entries(CRMIMP.mapa).forEach(([k,i])=>{ if(i!==""&&i!=null) o[k]=String(r[i]??"").trim(); }); return o; });
 const passo2=()=>{ const I=CRMIMP; const amostra=montar().slice(0,5); const usados=CRM_IMP_CAMPOS.filter(([k])=>I.mapa[k]!=null&&I.mapa[k]!=="");

function crmReguasPainel(rg,c){

  ${bloq?`<p class="sub" style="margin:8px 0 0">${bloq}.</p>`:`<div class="crm-pe" style="margin-top:8px"><select class="fsel" id="rgSel" aria-label="Régua">${crmOpt((rg.reguas||[]).map(r=>[r.chave,r.nome+(r.status!=="ativa"?" (ainda não ativa)":"")]),"","Incluir em uma régua…")}</select><button class="view-btn" id="rgIncl">Incluir</button></div>`}</div>`;
}

const crmHojeISO=()=>new Date().toLocaleDateString("sv-SE");
const crmDiaDe=s=>s?new Date(s).toLocaleDateString("sv-SE"):null;
function crmQuandoTxt(s){ if(!s) return "Sem data"; const d=crmDiaDe(s), h=crmHojeISO(); const am=new Date(Date.now()+864e5).toLocaleDateString("sv-SE");
 const hr=new Date(s).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); const hrTxt=hr==="18:00"?"":" "+hr;
 if(d===h) return "Hoje"+hrTxt; if(d===am) return "Amanhã"+hrTxt; return new Date(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+hrTxt; }
const crmAtrasada=t=>t.status==="pendente"&&t.vence_em&&crmDiaDe(t.vence_em)<crmHojeISO();

function crmSituacaoContrato(lista){
 const hoje=crmHojeISO(), lim=new Date(Date.now()+60*864e5).toLocaleDateString("sv-SE");
 const val=(lista||[]).filter(c=>c.status!=="cancelado");
 const ativo=val.filter(c=>c.status==="assinado"&&(!c.fim||c.fim>=hoje)).sort((a,b)=>(b.assinado_em||"").localeCompare(a.assinado_em||""))[0];
 if(ativo) return {sit:ativo.fim&&ativo.fim<=lim?"vence":"assinado",c:ativo};
 const env=val.find(c=>c.status==="enviado"); if(env) return {sit:"aguardando",c:env};
 const venc=val.find(c=>c.status==="assinado"); if(venc) return {sit:"vencido",c:venc};
 const rasc=val.find(c=>c.status==="rascunho"); if(rasc) return {sit:"preparo",c:rasc};
 return {sit:"sem",c:null};
}
function crmContratosPorCliente(contratos){
 const porG={}, porC={};
 (contratos||[]).forEach(c=>{ if(c.gclick_empresa_id)(porG[c.gclick_empresa_id]=porG[c.gclick_empresa_id]||[]).push(c); const d=dig(c.cnpj); if(d)(porC[d]=porC[d]||[]).push(c); });
 return (gid,cnpj)=>{ const a=[...(porG[gid]||[]),...((dig(cnpj)&&porC[dig(cnpj)])||[])]; return [...new Map(a.map(x=>[x.id,x])).values()]; };
}

const CRM_PROB_PADRAO={atracao:.05,nutricao:.1,conversao:.3,decisao:.55};
function crmPrioridades(neg,tarPorNeg,soMeus){
 const eu=(CRMB.eu||{}).email, hoje=crmHojeISO(), em7=new Date(Date.now()+7*864e5).toLocaleDateString("sv-SE");
 return (neg||[]).filter(o=>!["ganha","perdida"].includes(o.etapa)&&(!soMeus||!o.responsavel_email||o.responsavel_email===eu)).map(o=>{
  const val=(+o.valor_mensal||0)*12+(+o.valor_unico||0), prob=CRM_PROB_PADRAO[o.etapa]??.1, tp=tarPorNeg[o.id], mot=[]; let s=Math.min(40,prob*val/500);
  if(tp&&crmAtrasada(tp)){ s+=30; mot.push("tarefa atrasada"); } else if(!tp){ s+=15; mot.push("sem próxima tarefa"); } else if(crmDiaDe(tp.vence_em)===hoje){ s+=12; mot.push("tarefa para hoje"); }
  if(o.previsao_fechamento&&o.previsao_fechamento<=em7){ s+=25; mot.push(o.previsao_fechamento<hoje?"previsão de fechamento passou":"fecha nesta semana"); }
  const dp=crmDias(o.etapa_desde); if(dp>=10){ s+=10; mot.push(`${dp} dias parado`); }
  const uc=o.ultimo_contato?crmDias(o.ultimo_contato):null; if(uc===null||uc>7){ s+=8; mot.push(uc===null?"nenhum contato registrado":`${uc} dias sem contato`); }
  if(o.etapa==="decisao"){ s+=15; mot.push("em Decisão"); }
  if(o.origem==="indicacao"){ s+=8; mot.push("veio por indicação"); }
  if(val) mot.unshift(brl(o.valor_mensal||o.valor_unico)+(o.valor_mensal?"/mês":""));
  return {o,s,mot}; }).sort((a,b)=>b.s-a.s);
}
function crmPrioridadesHTML(lista){ if(!lista.length) return "";
 return `<div class="card ce-pad crm-prior"><div class="ce-ch"><h3>Prioridades de hoje</h3><span class="sub">negócios com mais chance e mais urgência</span></div>
  ${lista.slice(0,6).map((x,i)=>`<div class="ce-row crm-click" data-neg="${x.o.id}"><div style="min-width:0;display:flex;gap:12px;align-items:center"><span class="crm-rank">${i+1}</span><div style="min-width:0"><b>${esc(x.o.titulo)}</b>

const PRECO_CHAVES_PLANO=["Básico","Intermediário","Avançado"];
function precoNum(s){ s=String(s==null?"":s).trim().replace(/[^\d.,-]/g,""); if(!s) return 0;
 if(s.includes(",")) return Number(s.replace(/\./g,"").replace(",","."))||0;
 if(/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g,""))||0;
 return Number(s)||0; }
// "15.000,01 a 30000" | "2.500.000,01 ou mais" | "1 a 3" | "até 10" | "SIM"
function precoFaixa(nome){ const t=String(nome||"").toLowerCase().trim(); let m;
 if(m=t.match(/^(.+?)\s+a\s+(.+)$/)) return {lo:precoNum(m[1]),hi:precoNum(m[2])};
 if(m=t.match(/^(.+?)\s+ou\s+mais$/)) return {lo:precoNum(m[1]),hi:Infinity};
 if(m=t.match(/^(acima de|mais de)\s+(.+)$/)) return {lo:precoNum(m[2]),hi:Infinity};
 if(m=t.match(/^at[eé]\s+(.+)$/)) return {lo:0,hi:precoNum(m[1])};
 if(/^[\d.,]+$/.test(t)) { const v=precoNum(t); return {lo:v,hi:v}; }
 return null; }
function precoAchaFaixa(faixas,x){ x=Number(x)||0; const fx=faixas.map(f=>({f,r:precoFaixa(f.nome)})).filter(o=>o.r);
 let hit=fx.find(o=>x>=o.r.lo&&x<=o.r.hi); if(hit) return {faixa:hit.f,fora:false};
 // buracos entre faixas (ex.: 15.000,00 e 15.000,01): usa a maior faixa que começa antes do valor
 const antes=fx.filter(o=>o.r.lo<=x).sort((a,b)=>b.r.lo-a.r.lo);
 if(antes.length) return {faixa:antes[0].f,fora:x>Math.max(...fx.map(o=>o.r.hi))};
 return fx.length?{faixa:fx[0].f,fora:true}:{faixa:null,fora:true}; }

// Converte os campos brutos da ferramenta (pares [nome, valor, valorCheckbox]) no modelo usado pelo CRM
function precoNormalizar(bruto){
 const pares=(bruto&&bruto.pares)||[]; const P={planos:[],atividades:[],criterios:[],extras:[],nichos:(bruto&&bruto.nichos)||[],percentual:false};
 const pl={}, ord=[], at={}, atOrd=[], cr={}, crOrd=[], ex={}, exOrd=[];
 const plano=id=>{ if(!pl[id]){ pl[id]={id,nome:"",valor:0,percentual:false,desativado:false,cor:"",sug:{},sel:"1"}; ord.push(id);} return pl[id]; };
 const ativ=k=>{ if(!at[k]){ at[k]={chave:k,nome:k,ativa:true,planos:{},trib:{},_t:null,_f:null}; atOrd.push(k);} return at[k]; };
 const crit=id=>{ if(!cr[id]){ cr[id]={id,nome:"",tipo:"",acao:"",descricao:"",planos:{},faixas:[]}; crOrd.push(id);} return cr[id]; };
 for(const [nome,valor,vcb] of pares){ const n=String(nome).replace(/^[^\[]*\[steps\]\[[^\]]*\]/,""); const v=valor; let m;
  if(m=n.match(/^\[plan\]\[([^\]]+)\]\[(name|value|disabled|value_is_percent|color)\]$/)){ const p=plano(m[1]);
   if(m[2]==="name") p.nome=v; else if(m[2]==="value") p.valor=precoNum(v); else if(m[2]==="disabled") p.desativado=v==="1"; else if(m[2]==="value_is_percent") p.percentual=v==="1"; else if(!p.cor) p.cor=v; continue; }
  if(m=n.match(/^\[plan\]\[([^\]]+)\]\[(suggestion\d+)\]\[([^\]]+)\]\[(name|value)\]$/)){ const s=(plano(m[1]).sug[m[2].replace("suggestion","")]=plano(m[1]).sug[m[2].replace("suggestion","")]||[]);
   if(m[4]==="name") s.push({nome:v,valor:0}); else if(s.length) s[s.length-1].valor=precoNum(v); continue; }
  if(m=n.match(/^\[plan_suggestion_selected\]\[([^\]]+)\]$/)){ if(v==="1") plano(m[1]).sel=String(vcb||"1"); continue; }
  if(n==="[value_is_percent_global]"){ P.percentual=v==="1"; continue; }
  if(m=n.match(/^\[enabled_activities\]\[(\w+)\]$/)){ ativ(m[1]).ativa=v==="1"; continue; }
  if(m=n.match(/^\[activities\]\[(\w+)\]\[plans\]\[(.+)\]$/)){ ativ(m[1]).planos[m[2]]=v==="1"; continue; }
  if(m=n.match(/^\[activities\]\[(\w+)\]\[name\]$/)){ ativ(m[1]).nome=v; continue; }
  if(m=n.match(/^\[activities\]\[(\w+)\]\[taxations\]\[[^\]]+\]\[name\]$/)){ const a=ativ(m[1]); a._t=v; a.trib[v]=a.trib[v]||[]; continue; }
  if(m=n.match(/^\[activities\]\[(\w+)\]\[taxations\]\[[^\]]+\]\[ranges\]\[[^\]]+\]\[(name|value)\]$/)){ const a=ativ(m[1]); const l=a.trib[a._t]=a.trib[a._t]||[];
   if(m[2]==="name") l.push({nome:v,valor:0}); else if(l.length) l[l.length-1].valor=precoNum(v); continue; }
  if(m=n.match(/^\[criterions\]\[([^\]]+)\]\[(type|action|description|name)\]$/)){ const c=crit(m[1]); c[{type:"tipo",action:"acao",description:"descricao",name:"nome"}[m[2]]]=v; continue; }
  if(m=n.match(/^\[criterions\]\[([^\]]+)\]\[plans\]\[(.+)\]$/)){ crit(m[1]).planos[m[2]]=v==="1"; continue; }
  if(m=n.match(/^\[criterions\]\[([^\]]+)\]\[ranges\]\[[^\]]+\]\[(name|value)\]$/)){ const c=crit(m[1]); if(m[2]==="name") c.faixas.push({nome:v,valor:0}); else if(c.faixas.length) c.faixas[c.faixas.length-1].valor=precoNum(v); continue; }
  if(m=n.match(/^\[products_extras\]\[([^\]]+)\]\[(name|value)\]$/)){ if(!ex[m[1]]){ ex[m[1]]={id:m[1],nome:"",valor:0}; exOrd.push(m[1]); } if(m[2]==="name") ex[m[1]].nome=v; else ex[m[1]].valor=precoNum(v); continue; }
 }
 P.planos=ord.map((id,i)=>{ const p=pl[id]; return {id,nome:p.nome||PRECO_CHAVES_PLANO[i],chave:PRECO_CHAVES_PLANO[i]||p.nome,valor:p.valor,percentual:p.percentual,desativado:p.desativado,cor:p.cor,
  inclusos:(p.sug[p.sel]||p.sug["1"]||[]).filter(x=>x.nome)}; });
 P.atividades=atOrd.map(k=>{ const a=at[k]; return {chave:k,nome:a.nome,ativa:a.ativa,planos:a.planos,tributacoes:Object.entries(a.trib).filter(([t,l])=>t&&l.length).map(([t,l])=>({nome:t,faixas:l}))}; }).filter(a=>a.tributacoes.length);
 P.criterios=crOrd.map(id=>cr[id]).filter(c=>c.nome).map(c=>({...c,ativo:Object.values(c.planos).some(Boolean),
  forma:/sim ou n/i.test(c.tipo)?"simnao":(/m[uú]ltipla/i.test(c.tipo)?"escolha":"numero"),fator:/fator/i.test(c.acao)}));
 P.extras=exOrd.map(id=>ex[id]).filter(e=>e.nome);
 return P; }

// respostas: {faturamento, tributacao, atividade, crit:{[id]: número ou nome da opção}}
function precoCalcular(P,r){
 const out={planos:[],avisos:[]}; const ativ=P.atividades.find(a=>a.chave===r.atividade)||null;
 let tabela=null, faixaFat=null;
 if(ativ){ const t=ativ.tributacoes.find(x=>x.nome===r.tributacao);
  if(t){ const h=precoAchaFaixa(t.faixas,r.faturamento); faixaFat=h.faixa; tabela=h.faixa?h.faixa.valor:0; if(h.fora) out.avisos.push("Faturamento fora da tabela de "+t.nome+": usei a faixa mais próxima ("+(h.faixa?h.faixa.nome:"nenhuma")+")."); }
  else if(P.atividades.length) out.avisos.push("Não há tabela de "+r.tributacao+" para "+ativ.nome+".");
 }
 let totalBasico=null;
 P.planos.forEach((p,i)=>{ if(p.desativado) return; const linhas=[];
  if(ativ&&tabela!=null&&ativ.planos[p.chave]!==false) linhas.push({rotulo:`Mensalidade ${ativ.nome} · ${r.tributacao} · ${faixaFat?faixaFat.nome:""}`,valor:tabela});
  let vp=p.valor; if((P.percentual||p.percentual)&&i>0&&totalBasico!=null){ vp=totalBasico*p.valor/100; }
  if(vp) linhas.push({rotulo:"Valor do plano "+p.nome,valor:vp});
  (p.inclusos||[]).forEach(x=>{ if(x.valor) linhas.push({rotulo:x.nome,valor:x.valor}); });
  P.criterios.forEach(c=>{ if(!c.planos[p.chave]) return; const resp=r.crit?r.crit[c.id]:undefined; if(resp===undefined||resp===""||resp===null) return;
   let val=0, det="";
   if(c.forma==="numero"){ const q=Number(resp)||0; if(!q&&!c.faixas.some(f=>{const fr=precoFaixa(f.nome);return fr&&fr.lo===0;})) return;
    const h=precoAchaFaixa(c.faixas,q); if(!h.faixa) return; val=c.fator?q*h.faixa.valor:h.faixa.valor; det=c.fator?`${q} × ${precoMoeda(h.faixa.valor)}`:h.faixa.nome; }
   else { const f=c.faixas.find(x=>x.nome===resp); if(!f) return; val=f.valor; det=f.nome; }
   if(val) linhas.push({rotulo:`${c.nome} (${det})`,valor:val}); });
  const total=Math.round(linhas.reduce((s,l)=>s+l.valor,0)*100)/100; if(i===0) totalBasico=total;
  out.planos.push({id:p.id,nome:p.nome,cor:p.cor,total,linhas,inclusos:p.inclusos}); });
 return out; }
function precoMoeda(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }

async function precoCarregar(){

 }));

 try{ let raw=null; const {data,error}=await sb.storage.from("crm-arquivos").download("precificacao/nichos_vinculos.json"); if(!error&&data) raw=JSON.parse(await data.text());
  if(!raw){ const r=await fetch(`${PRECO_FN}?arquivo=nichos_vinculos`,{headers:{Authorization:"Bearer "+tok}}); if(r.ok) raw=await r.json(); }

 if(MODE!=="crm_precos") return;

 const fat=precoNum(S.resp.faturamento);

   <details class="preco-calc"><summary>Como chegamos nesse valor</summary>${p.linhas.map(l=>`<div class="ce-row"><span>${esc(l.rotulo)}</span><b class="num">${precoMoeda(l.valor)}</b></div>`).join("")||`<p class="sub">Nada somado ainda.</p>`}
    ${base!==p.total?`<div class="ce-row sub"><span>Arredondamento para cima</span><span class="num">${precoMoeda(base-p.total)}</span></div>`:""}
    <label class="crm-f" style="margin-top:8px"><span>Ajustar valor deste plano (opcional)</span><input class="inp" data-ajuste="${p.id}" value="${escAttr(aj??"")}" placeholder="${escAttr(precoValorTxt(base))}" inputmode="decimal"></label></details>

 // extras
 const exSel=S.extras;
 const busca=(S.busca||"").toLowerCase();
 const todosEx=P.extras.map(e=>({...e,arq:S.arq}));
 const visEx=todosEx.filter(e=>exSel[S.arq+":"+e.id]||(busca&&e.nome.toLowerCase().includes(busca))).slice(0,40);

// Tabela comparativa dos planos (colunas por plano, linhas por item incluso)
function precoTabela(R,S,ativs,fat){
 const semFat=!!(ativs.length&&!fat); const n=R.planos.length;
 const escolhido=S.cesta.find(x=>x.arq===S.arq); const iDest=escolhido?R.planos.findIndex(p=>p.id===escolhido.planoId):Math.min(1,n-1);
 const chave=x=>String(x||"").trim().toUpperCase().replace(/\s+/g," ");
 const itens=[]; const vistos=new Set();
 R.planos.slice().sort((a,b)=>(a.inclusos||[]).length-(b.inclusos||[]).length).forEach(p=>(p.inclusos||[]).forEach(x=>{ const k=chave(x.nome); if(!vistos.has(k)){ vistos.add(k); itens.push({k,nome:x.nome}); } }));
 const tem=(p,k)=>(p.inclusos||[]).some(x=>chave(x.nome)===k);
 const cap=t=>{ t=String(t||"").toLowerCase(); return t.charAt(0).toUpperCase()+t.slice(1); };
 const sub=["Essencial","Mais completo","Consultivo","Premium"];
 const col=(i,html,extra)=>`<div class="pt-c ${i===iDest?"pt-dest":""} ${extra||""}">${html}</div>`;
 const cols=R.planos.map((p,i)=>{ const base=precoTeto(p.total); const aj=S.ajuste[S.arq+":"+p.id]; const final=aj!=null&&aj!==""?precoNum(aj):base;
  const [int,dec]=precoMoeda(final).replace("R$","").trim().split(","); return {p,i,base,aj,final,int,dec}; });
 const ok='<svg viewBox="0 0 24 24" width="18" height="18" aria-label="Incluso"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const no='<svg viewBox="0 0 24 24" width="16" height="16" aria-label="Não incluso"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
 const corNome=c=>{ const h=String(c||"").replace("#",""); if(!/^[0-9a-f]{6}$/i.test(h)) return "#7fd0ea"; const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); return (0.299*r+0.587*g+0.114*b)<110?"#e8f1f4":"#"+h; };
 return `<div class="pt-wrap"><div class="pt" style="--n:${n}">
  <div class="pt-l pt-titulo"><span>Planos</span><b>${esc(PRECO_DB[S.arq].nome)}</b></div>
  ${cols.map(c=>col(c.i,`${c.i===iDest?`<span class="pt-selo">${escolhido?"Escolhido":"Recomendado"}</span>`:""}<b class="pt-nome" style="--pc:${escAttr(corNome(c.p.cor))}">${esc(c.p.nome.split(" - ")[0])}</b><span class="pt-sub">${esc(c.p.nome.split(" - ")[1]||sub[c.i]||"")}</span>`,"pt-cab")).join("")}
  <div class="pt-l pt-precorot">Mensalidade</div>
  ${cols.map(c=>col(c.i,semFat?`<span class="pt-vazio">Informe o faturamento</span>`:`<div class="pt-preco"><small>R$</small><b>${c.int}</b><sup>,${c.dec}</sup><em>/mês</em></div>${c.aj!=null&&c.aj!==""?`<span class="pt-tab">tabela ${precoMoeda(c.base)}</span>`:""}`,"pt-precocel")).join("")}
  ${itens.map((it,r)=>`<div class="pt-l ${r%2?"pt-z":""}">${esc(cap(it.nome))}</div>${cols.map(c=>col(c.i,tem(c.p,it.k)?`<span class="pt-ok">${ok}</span>`:`<span class="pt-no">${no}</span>`,r%2?"pt-z":"")).join("")}`).join("")}
  <div class="pt-l pt-acoesrot"><button class="txt-btn" id="ptCalc">${S.verCalc?"Esconder o cálculo":"Ver como chegamos nos valores"}</button></div>
  ${cols.map(c=>{ const na=S.cesta.find(x=>x.arq===S.arq&&x.planoId===c.p.id); return col(c.i,`<button class="pt-btn ${na?"on":""}" data-escolher="${c.p.id}" ${semFat?"disabled":""}>${na?"Escolhido ✓":"Escolher"}</button>`,"pt-acao"); }).join("")}
 </div></div>
 ${S.verCalc?`<div class="pt-calc">${cols.map(c=>`<div class="card ce-pad"><h4 style="margin:0 0 8px">${esc(c.p.nome)}</h4>${c.p.linhas.map(l=>`<div class="ce-row"><span>${esc(l.rotulo)}</span><b class="num">${precoMoeda(l.valor)}</b></div>`).join("")||`<p class="sub">Nada somado ainda.</p>`}
   ${c.base!==c.p.total?`<div class="ce-row sub"><span>Arredondamento para cima</span><span class="num">${precoMoeda(c.base-c.p.total)}</span></div>`:""}
   <div class="ce-row"><span><b>Total da tabela</b></span><b class="num">${precoMoeda(c.base)}</b></div>
   <label class="crm-f" style="margin-top:8px"><span>Ajustar o valor deste plano (opcional)</span><input class="inp" data-ajuste="${c.p.id}" value="${escAttr(c.aj??"")}" placeholder="${escAttr(precoValorTxt(c.base))}" inputmode="decimal"></label></div>`).join("")}</div>`:""}</div>`;
}

// Máscara de dinheiro: o usuário digita só números (85000 vira 85.000) e a vírgula dos centavos é opcional; ao sair do campo completa com ,00
function precoMascara(v){ v=String(v==null?"":v); const temVirg=v.includes(","); let [i,...d]=v.split(","); i=i.replace(/\D/g,"").replace(/^0+(?=\d)/,""); d=d.join("").replace(/\D/g,"").slice(0,2);
 const fi=i.replace(/\B(?=(\d{3})+(?!\d))/g,"."); return temVirg?(fi||"0")+","+d:fi; }
function precoMascaraFim(v){ v=precoMascara(v); if(!v) return v; if(!v.includes(",")) return v+",00"; const [i,d]=v.split(","); return i+","+(d+"00").slice(0,2); }
function precoValorTxt(n){ return (Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function precoLigarMascara(el,salvar){ if(!el) return; el.addEventListener("input",()=>{ const m=precoMascara(el.value); if(m!==el.value){ el.value=m; try{ el.setSelectionRange(m.length,m.length); }catch(_){} } salvar(el.value); });
 el.addEventListener("blur",()=>{ const m=precoMascaraFim(el.value); if(m!==el.value){ el.value=m; salvar(m); } }); }

function precoTotais(){ const S=PRECO_ST; const ex=Object.entries(S.extras).map(([k,s])=>({...s,k,total:(precoNum(s.valor)||0)*(Number(s.qtd)||1)}));
 const extrasM=ex.filter(e=>e.cobranca==="mensal"), extrasU=ex.filter(e=>e.cobranca!=="mensal");
 const mensal=S.cesta.reduce((s,c)=>s+c.valor,0)+extrasM.reduce((s,e)=>s+e.total,0);
 return {extrasM,extrasU,mensal,avulso:extrasU.reduce((s,e)=>s+e.total,0)}; }

function precoLigar(v,R,A){ const S=PRECO_ST; const box=v.querySelector("#crmBox"); const re=()=>precoPintar(v);
 let t=null; const reLento=()=>{ clearTimeout(t); t=setTimeout(()=>{ const f=document.activeElement; const id=f&&f.id, ds=f&&f.dataset?{...f.dataset}:null, pos=f&&f.selectionStart; re();
   let n=id?box.querySelector("#"+id):null; if(!n&&ds){ const k=Object.keys(ds)[0]; if(k) n=box.querySelector(`[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}="${ds[k]}"]`); }
   if(n&&n.focus){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } },350); };
 box.querySelector("#prNeg").onchange=e=>{ S.negocio=(S.negLista||[]).find(o=>o.id===e.target.value)||null; const nn=S.negocio&&S.negocio.campos&&(S.negocio.campos.nicho||(S.negocio.campos.proposta||{}).nicho); if(nn) precoEscolherNicho(nn); re(); };
 const inN=box.querySelector("#prNicho"); inN.onchange=()=>{ const v=inN.value.trim(); const ach=precoNichos().find(n=>n.toLowerCase()===v.toLowerCase());
  if(v&&!ach){ inN.value=S.nicho; crmToast("Escolha um nicho da lista, ou cadastre um novo em Vincular nichos."); return; } precoEscolherNicho(ach||""); re(); };
 inN.oninput=()=>{ const ach=precoNichos().find(n=>n===inN.value); if(ach){ precoEscolherNicho(ach); re(); } };
 const nx=box.querySelector("#prNichoX"); if(nx) nx.onclick=()=>{ S.nicho=""; re(); };
 box.querySelector("#prVinc").onclick=()=>precoVincularNichos(S.arq,re);
 const nl=box.querySelector("#prNichoLig"); if(nl) nl.onclick=async()=>{ const v=PRECO_NICHOS.vinculos; v[S.arq]=[...new Set([...(v[S.arq]||[]),S.nicho])]; try{ await precoSalvarNichos(); crmToast(`${S.nicho} vinculado a ${PRECO_DB[S.arq].nome}`); }catch(e){ crmToast(e.message); } re(); };
 box.querySelector("#prArq").onchange=e=>{ S.arq=e.target.value; re(); };
 const fat=box.querySelector("#prFat"); precoLigarMascara(fat,v=>{ S.resp.faturamento=v; reLento(); });
 box.querySelectorAll("[data-ativ]").forEach(i=>i.onchange=()=>{ S.resp.atividade=i.value; re(); });
 box.querySelectorAll("[data-trib]").forEach(i=>i.onchange=()=>{ S.resp.tributacao=i.value; re(); });

async function ctLer(chave){ if(CT.cache[chave]) return CT.cache[chave]; let raw=null;
 try{ const {data,error}=await sb.storage.from("crm-arquivos").download(`precificacao/${chave}.json`); if(!error&&data) raw=JSON.parse(await data.text()); }catch(_){}
 if(!raw){ const r=await fetch(`${CT_FN}?arquivo=${chave}`,{headers:{Authorization:"Bearer "+await ctTok()}}); if(r.ok) raw=await r.json(); }
 if(!raw) throw new Error("Não consegui abrir "+chave); CT.cache[chave]=raw; return raw; }
async function ctIndice(force){ if(CT.indice&&!force) return CT.indice; if(force) delete CT.cache.contratos_indice; const r=await ctLer("contratos_indice"); CT.indice=((r.dados&&r.dados.modelos)||r.modelos||[]); return CT.indice; }
async function ctModelo(chave){ const r=await ctLer(chave); return r.dados; }
async function ctConfig(){ if(CT.config) return CT.config; try{ const m=await ctModelo("contrato_config_resilcon"); CT.config={...CT_CONFIG_PADRAO,...(m.valores||{})}; }catch(_){ CT.config={...CT_CONFIG_PADRAO}; } return CT.config; }
async function ctSalvar(chave,modelo){ const r=await fetch(CT_FN,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await ctTok()},body:JSON.stringify({acao:"salvar_modelo",chave,modelo})});
 const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw new Error(j.erro||"Não foi possível salvar"); delete CT.cache[chave]; CT.indice=null; return j; }
async function ctExcluir(chave){ const r=await fetch(CT_FN,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await ctTok()},body:JSON.stringify({acao:"excluir_modelo",chave})});
 const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw new Error(j.erro||"Não foi possível excluir"); delete CT.cache[chave]; CT.indice=null; }

// ---------- variáveis ----------
const CT_MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function ctDataBR(iso){ if(!iso) return ""; const [a,m,d]=String(iso).slice(0,10).split("-"); return d&&m&&a?`${d}/${m}/${a}`:iso; }
function ctVariaveis(f,cfg){ const v={...cfg}; const hoje=new Date();
 Object.assign(v,{DIA_ATUAL:String(hoje.getDate()).padStart(2,"0"),MES_ATUAL:CT_MESES[hoje.getMonth()],ANO_ATUAL:String(hoje.getFullYear())});
 ["CLIENTE_NOME","CLIENTE_CPF","CLIENTE_RG","CLIENTE_ESTADO_CIVIL","CLIENTE_E-MAIL","CLIENTE_TELEFONE","CLIENTE_EMPRESA_NOME","CLIENTE_EMPRESA_DOCUMENTO","CLIENTE_LOGRADOURO","CLIENTE_NUMERO","CLIENTE_COMPLEMENTO","CLIENTE_BAIRRO","CLIENTE_CIDADE","CLIENTE_UF","CLIENTE_CEP"].forEach(k=>v[k]=f.cli[k]||"");
 v.DATA_VIGENCIA_DE=ctDataBR(f.inicio); v.DATA_VIGENCIA_ATE=ctDataBR(f.fim);
 const c=f.cesta||[], bpo=x=>/^bp/.test(x.arq||""); const pc=c.filter(x=>!bpo(x)), pb=c.filter(bpo);
 const ex=f.extras||[], exB=ex.filter(bpo), exC=ex.filter(x=>!bpo(x)); const tot=e=>(precoNum(e.valor)||0)*(Number(e.qtd)||1);
 const linhaEx=e=>`${e.nome} – ${precoMoeda(tot(e))}${e.cobranca==="mensal"?" por mês":e.cobranca==="hora"?` (${e.qtd} h)`:e.cobranca==="volume"?` (${e.qtd} un.)`:" (cobrança única)"}`;
 const soma=(l,fn)=>l.reduce((s,x)=>s+fn(x),0);
 v.VALOR_PLANO_CONTABIL=pc.length?precoMoeda(soma(pc,x=>x.valor)):""; v.VALOR_PLANO_BPO=pb.length?precoMoeda(soma(pb,x=>x.valor)):"";
 const mC=soma(pc,x=>x.valor)+soma(exC.filter(e=>e.cobranca==="mensal"),tot), mB=soma(pb,x=>x.valor)+soma(exB.filter(e=>e.cobranca==="mensal"),tot);
 v.VALOR_PROPOSTA_CONTABIL=pc.length||exC.length?precoMoeda(mC):""; v.VALOR_PROPOSTA_BPO=pb.length||exB.length?precoMoeda(mB):""; v.VALOR_PROPOSTA=precoMoeda(mC+mB);
 v.VALOR_PRODUTOS_SERVICOS_EXTRAS_CONTABIL=exC.filter(e=>!e.separado).map(linhaEx).join("; "); v.VALOR_PRODUTOS_SERVICOS_EXTRAS_CONTABIL_SEPARADOS=exC.filter(e=>e.separado).map(linhaEx).join("; ");
 v.VALOR_PRODUTOS_SERVICOS_EXTRAS_BPO=exB.filter(e=>!e.separado).map(linhaEx).join("; "); v.VALOR_PRODUTOS_SERVICOS_EXTRAS_BPO_SEPARADOS=exB.filter(e=>e.separado).map(linhaEx).join("; ");
 v.NOME_PLANO=c.map(x=>x.plano).join(" + "); v.SERVICOS_INCLUSOS=[...new Set(c.flatMap(x=>x.inclusos||[]))].join("; ");
 const cli=f.cli; v.CONTRATANTE=[cli.CLIENTE_EMPRESA_NOME||cli.CLIENTE_NOME,cli.CLIENTE_EMPRESA_DOCUMENTO?`inscrita no CNPJ sob nº ${cli.CLIENTE_EMPRESA_DOCUMENTO}`:"",
  cli.CLIENTE_LOGRADOURO?`com sede na ${cli.CLIENTE_LOGRADOURO}, nº ${cli.CLIENTE_NUMERO||"s/n"}${cli.CLIENTE_COMPLEMENTO?", "+cli.CLIENTE_COMPLEMENTO:""}, ${cli.CLIENTE_BAIRRO||""}, ${cli.CLIENTE_CIDADE||""}/${cli.CLIENTE_UF||""}, CEP ${cli.CLIENTE_CEP||""}`:"",
  cli.CLIENTE_NOME&&cli.CLIENTE_EMPRESA_NOME?`neste ato representada por ${cli.CLIENTE_NOME}${cli.CLIENTE_CPF?", CPF "+cli.CLIENTE_CPF:""}`:""].filter(Boolean).join(", ");
 return v; }
function ctTroca(t,v,marcar){ return String(t==null?"":t).replace(/\[([A-ZÇÃÕÁÉÍÓÚÂÊÔ0-9_\-]{3,})\]/g,(m,k)=>{ if(v&&v[k]!=null&&v[k]!=="") return v[k]; return marcar?`⟦${k}⟧`:m; }); }

function ctAbrirJanela(html){ const w=window.open("","_blank"); if(!w){ crmToast("O navegador bloqueou a janela. Libere pop-ups para o Resiltrack."); return null; } w.document.open(); w.document.write(html); w.document.close(); return w; }

 const m=crmModal("Modelos de contrato","Dados da Resilcon nos contratos","",`<p class="sub" style="margin:0 0 12px">Esses dados preenchem as palavras-chave [CONTABILIDADE_...] de todos os contratos.</p>

// foto vira JPEG de até 1800 px (mais leve e nítido para a leitura); PDF vai como está
function ctArquivoBase64(file){ return new Promise((ok,erro)=>{ const fr=new FileReader(); fr.onerror=erro;
 if(file.type==="application/pdf"){ fr.onload=()=>ok({tipo:"application/pdf",base64:String(fr.result).split(",")[1]}); fr.readAsDataURL(file); return; }
 fr.onload=()=>{ const img=new Image(); img.onerror=erro; img.onload=()=>{ const max=1800, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); ok({tipo:"image/jpeg",base64:c.toDataURL("image/jpeg",0.85).split(",")[1]}); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }
async function ctErroFn(e){ try{ if(e&&e.context&&typeof e.context.json==="function"){ const j=await e.context.json(); if(j&&j.erro) return j.erro; } }catch(_){} return (e&&e.message)||"Não consegui ler os dados."; }

async function ctGerar(opts){
 let lista=[]; try{ lista=(await ctIndice()).filter(m=>m.tipo!=="config"&&m.ativo!==false); }catch(e){ crmToast(crmErro(e)); return; }
 const cfg=await ctConfig();
 let negs=[]; try{ negs=(await crmRpc("crm_dados",{p_secao:"negocios",p_param:{funil:"vendas"}}))||[]; }catch(_){}
 const st={modelo:opts.modelo||(lista.find(m=>/b[aá]sico$/i.test(m.nome))||lista[0]||{}).chave,negocio:opts.negocio?opts.negocio.id:"",proposta:opts.proposta||null,cli:{},inicio:new Date().toISOString().slice(0,10),fim:"",oNeg:null,contato:null};
 const f=new Date(); f.setFullYear(f.getFullYear()+1); f.setDate(f.getDate()-1); st.fim=f.toISOString().slice(0,10);
 const m=crmModal("Contratos","Gerar contrato","",`<div class="ct-ed ct-ger">

   <label class="crm-f"><span>Modelo de contrato</span><select class="inp" id="gMod">${lista.map(x=>`<option value="${x.chave}" ${x.chave===st.modelo?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>
   <div id="gProp" class="ce-note"></div>

   <div class="ct-auto"><h4 class="crm-h4" style="margin:0">Preencher automaticamente</h4>
    <p class="sub" style="margin:0">Mande a foto ou o PDF do documento (RG, CNH, cartão CNPJ, contrato social, comprovante de endereço) ou cole os dados como vieram no WhatsApp ou e-mail. Os campos do contrato se preenchem sozinhos.</p>
    <label class="ct-drop" id="gDrop"><input type="file" id="gArq" accept="image/*,application/pdf" multiple hidden><b>Enviar foto ou PDF</b><span class="sub">Clique, arraste aqui ou tire a foto pelo celular. Pode enviar mais de um.</span></label>
    <div id="gArqs" class="ct-arqs"></div>

    <div class="crm-pe" style="gap:8px"><span class="sub" id="gAutoMsg" style="flex:1"></span><button type="button" class="view-btn ce-pri" id="gLer">Ler e preencher</button></div>
    <p class="sub" style="margin:0">Dica: só de digitar o CNPJ ou o CEP nos campos abaixo, o endereço e a razão social vêm da Receita.</p></div>
   <h4 class="crm-h4">Dados do cliente</h4><div class="crm-form" id="gCli" style="grid-template-columns:1fr 1fr"></div></div>
  <div class="ct-ed-r ct-ger-r"><p class="sub" style="margin:0 0 6px">Prévia. O que estiver em amarelo ainda falta preencher.</p><iframe id="gPrev" title="Prévia do contrato"></iframe></div></div>
  <div class="crm-pe" style="margin-top:12px"><span style="flex:1"></span><button class="view-btn ghost" id="gPdf">Imprimir ou salvar PDF</button><button class="view-btn ce-pri" id="gSalvar">Salvar no CRM</button></div>`);
 modal.classList.add("ct-modal");
 const camposCli=CT_PALAVRAS[0][1].filter(([k])=>k!=="CONTRATANTE");
 const pintaCli=()=>{ m.querySelector("#gCli").innerHTML=camposCli.map(([k,r])=>`<label class="crm-f"><span>${esc(r)}</span><input class="inp" data-cli="${k}" value="${escAttr(st.cli[k]||"")}"></label>`).join("");

 st.auto={}; st.arqs=[];

 const aplicar=(campos,fonte,fonteFixa,soVazios)=>{ let n=0; Object.entries(campos||{}).forEach(([k,v])=>{ if(k.startsWith("_")||!v) return; if(soVazios&&st.cli[k]&&k!=="CLIENTE_CEP") return; if(st.cli[k]!==v){ st.cli[k]=v; n++; } st.auto[k]=(fonte&&fonte[k])||fonteFixa; }); pintaCli(); prevLento(); return n; };
 const ctConsulta=async(body,fonte,txt,soVazios)=>{ msg(txt); try{ const {data,error}=await sb.functions.invoke("extrair-documento",{body}); if(error) throw error; if(data&&data.erro) throw new Error(data.erro);

// ---------- editor ----------
function ctEditor(chave,modelo,depois,novo){
 const M=JSON.parse(JSON.stringify(modelo));
 if(M.tipo==="texto"){ M.blocos=ctBlocosDe(M); M.tipo="blocos"; delete M.html; }
 M.blocos=M.blocos||[]; M.tema=ctTema(M); M.logo=ctLogo(M); M.midias=M.midias||[];
 M.blocos.forEach(b=>{ b.id=b.id||ctId(); b.style=b.style||{}; b.content=b.content||{}; if(b.visible==null) b.visible=true; const c=b.content;
  if(b.type==="assinaturas"&&!Array.isArray(c.assinantes)){ c.assinantes=[{nome:c.contratante||"[CLIENTE_EMPRESA_NOME]",papel:"CONTRATANTE"},{nome:c.contratada||"[CONTABILIDADE_NOME]",papel:"CONTRATADA"}]; delete c.contratante; delete c.contratada; if(c.testemunhas==null) c.testemunhas="0"; }
  if(b.type==="pagamento-contrato"&&!Array.isArray(c.campos)) c.campos=[];
  if(b.type==="split-image-text"&&c.imageSide&&(!b.variant||b.variant==="default")){ b.variant=c.imageSide==="right"?"right":"left"; delete c.imageSide; } });
 const S={ab:{},sel:M.blocos.length?0:-1,hist:[],pos:-1,salvo:null,ultimo:null,drag:null,timer:null,fechar:0};
 const snap=()=>JSON.stringify(M);
 const tela=document.createElement("div"); tela.className="cte"; tela.setAttribute("role","dialog"); tela.setAttribute("aria-label","Editor de modelo de contrato");
 tela.innerHTML=`<div class="cte-top">
  <div class="cte-top-l"><span class="cte-tag">${ctI("clau")} Contrato</span><input class="cte-nome" id="edNome" value="${escAttr(M.nome||"")}" aria-label="Nome do modelo" placeholder="Nome do modelo"></div>
  <div class="cte-top-c"><button class="cte-ib" data-t="desf" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">${ctI("desf")}</button><button class="cte-ib" data-t="ref" title="Refazer (Ctrl+Y)" aria-label="Refazer">${ctI("ref")}</button>
   <button class="cte-b" data-t="tema">${ctI("tema")} Tema</button><button class="cte-b" data-t="vars">${ctI("chave")} Palavras-chave</button><button class="cte-b" data-t="ver">${ctI("ver")} Ver contrato</button>
   <button class="cte-b cte-pri" data-t="salvar">${ctI("salvar")} Salvar</button><button class="cte-ib" data-t="menu" title="Mais opções" aria-label="Mais opções">${ctI("menu")}</button></div>
  <div class="cte-top-r"><span class="cte-st" id="edSt"></span><button class="cte-ib" data-t="fechar" title="Fechar" aria-label="Fechar">${ctI("fechar")}</button></div></div>
 <div class="cte-main"><aside class="cte-lib"><div class="cte-h">Biblioteca de blocos</div><div id="edLib"></div><p class="cte-dica">Clique para adicionar abaixo do bloco selecionado, ou arraste para o lugar certo no contrato. Sem limite de blocos.</p></aside>
  <main class="cte-cv" id="edCv"><div id="edHost"></div></main>
  <aside class="cte-pr"><div class="cte-h">Propriedades</div><div id="edPr"></div></aside></div>
 <div class="cte-pop" id="edPop" hidden></div>`;
 document.body.appendChild(tela); document.body.classList.add("cte-aberto");
 const $=s=>tela.querySelector(s); const host=$("#edHost"); const raiz=host.attachShadow({mode:"open"});
 let cfgV=null; ctConfig().then(cfg=>{ cfgV=ctVariaveis({cli:{},cesta:[],extras:[]},cfg); pintaCanvas(); });
 const vAmostra=()=>cfgV||ctVariaveis({cli:{},cesta:[],extras:[]},CT_CONFIG_PADRAO);
 const nomeB=b=>(CT_BLOCOS[b.type]||{}).nome||b.type;
 // ---- histórico ----
 const status=()=>{ const suj=snap()!==S.salvo; $("#edSt").textContent=suj?"Alterações não salvas":"Tudo salvo"; $("#edSt").classList.toggle("suj",suj);
  $('[data-t="desf"]').disabled=S.pos<=0; $('[data-t="ref"]').disabled=S.pos>=S.hist.length-1; };
 const registra=()=>{ const s=snap(); if(S.hist[S.pos]===s) return status(); S.hist=S.hist.slice(0,S.pos+1); S.hist.push(s); if(S.hist.length>120) S.hist.shift(); S.pos=S.hist.length-1; status(); };
 const mudou=(tudo)=>{ clearTimeout(S.timer); S.timer=setTimeout(registra,380); if(tudo) pintaCanvas(); else pintaBloco(S.sel); };
 const aplicaSnap=s=>{ const o=JSON.parse(s); const idSel=M.blocos[S.sel]&&M.blocos[S.sel].id; Object.keys(M).forEach(k=>delete M[k]); Object.assign(M,o);
  S.sel=Math.max(-1,M.blocos.findIndex(b=>b.id===idSel)); if(S.sel<0&&M.blocos.length) S.sel=0; $("#edNome").value=M.nome||""; pintaTudo(); status(); };
 const desfaz=()=>{ clearTimeout(S.timer); registra(); if(S.pos>0){ S.pos--; aplicaSnap(S.hist[S.pos]); } };
 const refaz=()=>{ if(S.pos<S.hist.length-1){ S.pos++; aplicaSnap(S.hist[S.pos]); } };
 // ---- biblioteca ----
 const pintaLib=()=>{ const cont={}; M.blocos.forEach(b=>cont[b.type]=(cont[b.type]||0)+1);
  $("#edLib").innerHTML=CT_GRUPOS.map(([g,n,cor])=>`<details class="cte-grp" ${S["g_"+g]===false?"":"open"} data-g="${g}"><summary style="color:${cor}">${ctI("seta")}<span>${esc(n)}</span></summary>
   ${Object.entries(CT_BLOCOS).filter(([,d])=>d.grupo===g).map(([k,d])=>`<button class="cte-li" draggable="true" data-add="${k}" title="Adicionar ${escAttr(d.nome)}">${ctI(d.ico)}<span>${esc(d.nome)}</span>${cont[k]?`<em>${cont[k]}</em>`:""}</button>`).join("")}</details>`).join("");
  $("#edLib").querySelectorAll("details").forEach(d=>d.ontoggle=()=>{ S["g_"+d.dataset.g]=d.open; });
  $("#edLib").querySelectorAll("[data-add]").forEach(bt=>{ bt.onclick=()=>adiciona(bt.dataset.add,S.sel<0?M.blocos.length:S.sel+1);
   bt.ondragstart=e=>{ S.drag={novo:bt.dataset.add}; e.dataTransfer.effectAllowed="copy"; e.dataTransfer.setData("text/plain","novo"); }; bt.ondragend=()=>{ S.drag=null; limpaDrop(); }; }); };
 const adiciona=(tipo,pos)=>{ const b=ctNovoBloco(tipo); if(M.tema.layoutId&&CT_LAYOUTS[M.tema.layoutId]&&CT_LAYOUTS[M.tema.layoutId].v[tipo]) b.variant=CT_LAYOUTS[M.tema.layoutId].v[tipo];
  M.blocos.splice(pos,0,b); S.sel=pos; pintaTudo(); registra(); rolaAte(pos); };
 const rolaAte=i=>setTimeout(()=>{ const w=raiz.querySelector(`.cv-w[data-i="${i}"]`); if(w) w.scrollIntoView({behavior:"smooth",block:"center"}); },30);
 // ---- canvas ----
 const tb=(i,b)=>`<div class="cv-tb" role="toolbar" aria-label="Ações do bloco"><button data-acao="arrasta" class="cv-arr" title="Arrastar para mover">${ctI("arrasta")}</button><button data-acao="up" title="Subir">${ctI("up")}</button><button data-acao="down" title="Descer">${ctI("down")}</button>
  <button data-acao="dup" title="Duplicar bloco">${ctI("dup")}</button><button data-acao="vis" title="${b.visible===false?"Mostrar":"Ocultar"} no contrato">${ctI(b.visible===false?"olhoNao":"olho")}</button><button data-acao="del" title="Remover bloco">${ctI("lixo")}</button></div>`;
 const wrap=(b,i)=>{ const ctx={canvas:true,tema:M.tema,logo:M.logo}; let html=ctRenderBloco({...b,visible:true},vAmostra(),ctx,true);
  if(!html) html=`<section class="ct-b cv-vazio">${esc(nomeB(b))}: preencha no painel ao lado</section>`;
  return `<div class="cv-w ${i===S.sel?"sel":""} ${b.visible===false?"oculto":""}" data-i="${i}"><span class="cv-nome">${esc(nomeB(b))}${b.visible===false?" (oculto)":""}</span>${tb(i,b)}${html}</div>`; };
 const CV_CSS=`:host{display:block}.cv-w{position:relative;border-radius:16px;outline:2px solid transparent;outline-offset:3px;cursor:pointer;transition:outline-color .12s}
.cv-w:hover{outline-color:rgba(0,103,137,.35)}.cv-w.sel{outline-color:#006789}.cv-w.oculto>section{opacity:.35}
.cv-tb{position:absolute;top:-17px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:#fff;border:1px solid #d6dde2;border-radius:10px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5}
.cv-w:hover .cv-tb,.cv-w.sel .cv-tb{display:flex}.cv-tb button{border:0;background:none;color:#334155;width:28px;height:26px;border-radius:7px;display:grid;place-items:center;cursor:pointer}.cv-tb button:hover{background:#eef3f5;color:#006789}.cv-arr{cursor:grab!important}
.cv-nome{position:absolute;top:-10px;left:14px;font:600 10px/1 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:#006789;color:#fff;padding:4px 7px;border-radius:6px;display:none;z-index:5}.cv-w.sel .cv-nome{display:block}
.cv-w.drop-antes:before,.cv-w.drop-depois:after{content:"";position:absolute;left:0;right:0;height:4px;background:#006789;border-radius:4px;z-index:6}.cv-w.drop-antes:before{top:-9px}.cv-w.drop-depois:after{bottom:-9px}
.cv-vazio{padding:28px!important;text-align:center;color:#64748b;background:#f8fafc;border:2px dashed #cbd5e1;font:14px Arial,sans-serif}
.cv-fim{border:2px dashed #cbd5e1;border-radius:14px;padding:22px;text-align:center;color:#64748b;font:14px Arial,sans-serif;margin-top:6px}.cv-fim.on{border-color:#006789;background:rgba(0,103,137,.06)}
.cv-livre-ed{outline:none;min-height:60px;cursor:text}.cv-livre-ed:focus{box-shadow:inset 0 0 0 2px rgba(0,103,137,.25);border-radius:6px}`;
 const pintaCanvas=()=>{ ctCarregaFonte(M.tema.fontPairId); const top=$("#edCv").scrollTop;
  raiz.innerHTML=`<style>${ctCss(M.tema,M.logo)}${CV_CSS}</style><div class="ct-fundo"><div class="doc">${M.blocos.map(wrap).join("")}<div class="cv-fim" data-fim="1">${M.blocos.length?"Arraste blocos da biblioteca para cá":"Contrato vazio. Clique ou arraste blocos da biblioteca para começar."}</div></div></div>`;
  ligaLivre(); $("#edCv").scrollTop=top; };
 const pintaBloco=i=>{ const w=raiz.querySelector(`.cv-w[data-i="${i}"]`); if(!w||!M.blocos[i]) return pintaCanvas(); const t=document.createElement("div"); t.innerHTML=wrap(M.blocos[i],i); w.replaceWith(t.firstElementChild); ligaLivre(); };
 // texto livre: edição direto no contrato
 const ligaLivre=()=>{ raiz.querySelectorAll(".cv-w.sel .ct-livre").forEach(el=>{ const i=+el.closest(".cv-w").dataset.i, b=M.blocos[i]; if(!b||b.type!=="texto-livre") return;
  el.innerHTML=b.content.html||""; el.contentEditable="true"; el.classList.add("cv-livre-ed"); el.spellcheck=true;
  el.oninput=()=>{ b.content.html=el.innerHTML; clearTimeout(S.timer); S.timer=setTimeout(registra,500); }; el.onfocus=()=>{ S.ultimo=el; }; }); };
 const seleciona=i=>{ if(S.sel===i) return; const ant=S.sel; S.sel=i; S.ab={}; if(ant>=0&&M.blocos[ant]) pintaBloco(ant); pintaBloco(i); pintaProps(); };
 raiz.addEventListener("click",e=>{ const w=e.target.closest(".cv-w"); if(!w) return; const i=+w.dataset.i; const ac=e.target.closest("[data-acao]");
  if(ac){ e.stopPropagation(); const a=ac.dataset.acao; const b=M.blocos[i]; if(a==="arrasta") return;
   if(a==="up"&&i>0){ [M.blocos[i-1],M.blocos[i]]=[M.blocos[i],M.blocos[i-1]]; S.sel=i-1; }
   else if(a==="down"&&i<M.blocos.length-1){ [M.blocos[i+1],M.blocos[i]]=[M.blocos[i],M.blocos[i+1]]; S.sel=i+1; }
   else if(a==="dup"){ const c=JSON.parse(JSON.stringify(b)); c.id=ctId(); M.blocos.splice(i+1,0,c); S.sel=i+1; }
   else if(a==="vis"){ b.visible=b.visible===false; S.sel=i; }
   else if(a==="del"){ M.blocos.splice(i,1); S.sel=Math.min(i,M.blocos.length-1); crmToast(`${nomeB(b)} removido. Ctrl+Z desfaz.`); }
   pintaTudo(); registra(); return; }
  if(e.target.closest(".cv-livre-ed")) return; seleciona(i); });
 // arrastar e soltar
 raiz.addEventListener("mousedown",e=>{ const h=e.target.closest(".cv-arr"); if(h){ h.closest(".cv-w").draggable=true; } });
 raiz.addEventListener("dragstart",e=>{ const w=e.target.closest&&e.target.closest(".cv-w"); if(!w) return; S.drag={mover:+w.dataset.i}; e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain","mover"); });
 const limpaDrop=()=>raiz.querySelectorAll(".drop-antes,.drop-depois,.cv-fim.on").forEach(x=>x.classList.remove("drop-antes","drop-depois","on"));
 const alvo=e=>{ const fim=e.target.closest&&e.target.closest(".cv-fim"); if(fim) return {pos:M.blocos.length,el:fim,cls:"on"}; const w=e.target.closest&&e.target.closest(".cv-w"); if(!w) return null;
  const r=w.getBoundingClientRect(), antes=e.clientY<r.top+r.height/2, i=+w.dataset.i; return {pos:antes?i:i+1,el:w,cls:antes?"drop-antes":"drop-depois"}; };
 raiz.addEventListener("dragover",e=>{ if(!S.drag) return; const a=alvo(e); if(!a) return; e.preventDefault(); limpaDrop(); a.el.classList.add(a.cls); });
 raiz.addEventListener("drop",e=>{ if(!S.drag) return; const a=alvo(e); limpaDrop(); if(!a) return; e.preventDefault(); const d=S.drag; S.drag=null;
  if(d.novo) return adiciona(d.novo,a.pos);
  if(d.mover!=null){ let p=a.pos; const [b]=M.blocos.splice(d.mover,1); if(p>d.mover) p--; M.blocos.splice(p,0,b); S.sel=p; pintaTudo(); registra(); } });
 raiz.addEventListener("dragend",e=>{ S.drag=null; limpaDrop(); raiz.querySelectorAll('.cv-w[draggable="true"]').forEach(w=>w.draggable=false); });
 $("#edCv").addEventListener("dragover",e=>{ if(S.drag) e.preventDefault(); });
 // ---- propriedades ----
 const pega=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
 const poe=(o,p,v)=>{ const ks=p.split("."); const last=ks.pop(); const a=ks.reduce((x,k)=>x[k],o); a[last]=v; };
 const ALINHA={textoContratante:"textAlignContratante",textoContratada:"textAlignContratada",text:"textAlign",description:"textAlign"};
 const alinhaHTML=(path,obj,k)=>{ const ak=ALINHA[k]; if(!ak||!(ak in obj)) return ""; const cur=obj[ak]||"left"; const base=path.replace(/[^.]+$/,ak);
  return `<span class="cte-al">${[["left","al","Alinhar à esquerda"],["center","ac","Centralizar"],["right","ar","Alinhar à direita"],["justify","aj","Justificar"]].map(([vv,ic,t])=>`<button type="button" class="${cur===vv?"on":""}" data-al="${base}" data-v="${vv}" title="${t}" aria-label="${t}">${ctI(ic)}</button>`).join("")}</span>`; };
 const imgCampo=(path,val)=>`<div class="cte-img">${val?`<img src="${escAttr(val)}" alt="">`:`<div class="cte-img-v">Sem imagem</div>`}
  <input class="inp" data-p="${path}" value="${escAttr(String(val||"").startsWith("data:")?"(imagem enviada)":val||"")}" placeholder="Cole o endereço da imagem">
  <div class="cte-img-a"><label class="cte-mb">Enviar imagem<input type="file" accept="image/*" hidden data-up="${path}"></label>${val?`<button type="button" class="cte-mb" data-limpa="${path}">Remover</button>`:""}</div>
  <div class="cte-midias">${[...CT_MIDIAS_PADRAO,...M.midias.filter(m=>!CT_MIDIAS_PADRAO.some(x=>x.url===m.url))].map(m=>`<button type="button" data-midia="${path}" data-url="${escAttr(m.url)}" title="${escAttr(m.name||"")}"><img src="${escAttr(m.url)}" alt="${escAttr(m.name||"")}" loading="lazy"></button>`).join("")}</div></div>`;
 const rot=k=>CT_CAMPOS_ROT[k]||k;
 const campo=(path,k,val,obj,tipo)=>{ if(/^(id|imageRef|titleAlign|methodsAlign|dueDateAlign|descriptionAlign|ctaText|ctaLink|imageSide)$/.test(k)||/^textAlign/.test(k)) return "";
  if(k==="html"&&tipo==="texto-livre") return `<div class="ce-note">Escreva direto no contrato, no bloco selecionado. Use a barra abaixo para formatar e o botão Palavras-chave para inserir dados.</div>
   <div class="cte-fmt">${[["bold","<b>N</b>","Negrito"],["italic","<i>I</i>","Itálico"],["underline","<u>S</u>","Sublinhado"],["insertUnorderedList","• Lista","Lista"],["insertOrderedList","1. Lista","Lista numerada"],["formatBlock:h2","Título","Título"],["formatBlock:h3","Subtítulo","Subtítulo"],["formatBlock:p","Parágrafo","Parágrafo"],["justifyLeft","Esq.","Esquerda"],["justifyCenter","Centro","Centralizar"],["justifyFull","Justif.","Justificar"],["removeFormat","Limpar","Limpar formatação"]].map(([c2,t,ti])=>`<button type="button" data-fmt="${c2}" title="${ti}">${t}</button>`).join("")}</div>`;
  if(/imageUrl$|backgroundImageUrl$/.test(k)) return `<div class="crm-f"><span>${esc(rot(k))}</span>${imgCampo(path,val)}</div>`;
  if(k==="testemunhas") return `<label class="crm-f"><span>Testemunhas</span><select class="inp" data-p="${path}">${["0","1","2","3","4"].map(n=>`<option ${String(/^s/i.test(val)?"2":/^n/i.test(val)?"0":val)===n?"selected":""} value="${n}">${n==="0"?"Sem testemunhas":n+" testemunha(s)"}</option>`).join("")}</select></label>`;
  if(k==="linhas"&&Array.isArray(val)) return tabelaHTML(path,obj);
